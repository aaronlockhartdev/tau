# Dependabot: the three ecosystems in this repo.
#
# - cargo: the workspace at the repo root (crates/*, app/src-tauri),
#   including the tauri-plugin-pilot git dependency (the upstream
#   mpiton/tauri-pilot we track for fixes).
# - npm: the frontend lives in app/ (no root package.json).
# - github-actions: .github/workflows/ci.yml.
#
# Grouping: routine minor + patch bumps are folded into a single PR per
# ecosystem; major updates stay individual (they warrant separate review).
#
# The Rust toolchain pin (dtolnay/rust-toolchain@1.98.1) is a deliberate
# version choice, not a dependency to ride along — ignored on purpose.
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/app"
    schedule:
      interval: "weekly"
    groups:
      minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "dtolnay/rust-toolchain"

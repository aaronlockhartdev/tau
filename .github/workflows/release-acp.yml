# Builds the thin `tau-acp` ACP binary for the platforms the ACP registry
# serves and publishes a GitHub Release. The registry's hourly cron bumps
# entry versions from these releases, so the asset names and the rendered
# `agent.json` asset are a stable contract (see acp/registry/).
name: release-acp

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (defaults to the tag; 0.0.0-dev for manual runs)"
        required: false

jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - name: Build static musl binary in a native rust container
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            -v acp-linux-x86_64:/build \
            -w /src \
            -e RUSTUP_TOOLCHAIN=1.98.1 \
            -e CARGO_TARGET_DIR=/build \
            rust:1.98-bookworm \
            bash -c "apt-get update -qq && apt-get install -y -qq musl-tools && \
              rustup target add x86_64-unknown-linux-musl && \
              cargo build --target x86_64-unknown-linux-musl --release --bin tau-acp"
      - name: Pack and checksum
        run: |
          mkdir -p dist
          C=$(docker create -v acp-linux-x86_64:/build alpine sh)
          docker cp "$C":/build/x86_64-unknown-linux-musl/release/tau-acp dist/tau-acp
          docker rm "$C"
          file dist/tau-acp
          tar -czf dist/tau-acp-linux-x86_64.tar.gz -C dist tau-acp
          sha256sum dist/tau-acp-linux-x86_64.tar.gz > dist/tau-acp-linux-x86_64.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: |
            dist/tau-acp-linux-x86_64.tar.gz
            dist/tau-acp-linux-x86_64.tar.gz.sha256

  linux-aarch64:
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      # musl.cc cross toolchain instead of QEMU: a static musl binary needs
      # only a foreign linker, and emulated builds of this workspace segfault
      # (the lesson build-eval-linux.yml was written around).
      - name: Cross-build static musl binary
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            -v acp-linux-aarch64:/build \
            -w /src \
            -e RUSTUP_TOOLCHAIN=1.98.1 \
            -e CARGO_TARGET_DIR=/build \
            rust:1.98-bookworm \
            bash -c "apt-get update -qq && apt-get install -y -qq musl-tools curl && \
              curl -sL https://musl.cc/aarch64-linux-musl-cross.tgz | tar xz -C /opt && \
              rustup target add aarch64-unknown-linux-musl && \
              CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=/opt/aarch64-linux-musl-cross/bin/aarch64-linux-musl-gcc \
              cargo build --target aarch64-unknown-linux-musl --release --bin tau-acp"
      - name: Pack and checksum
        run: |
          mkdir -p dist
          C=$(docker create -v acp-linux-aarch64:/build alpine sh)
          docker cp "$C":/build/aarch64-unknown-linux-musl/release/tau-acp dist/tau-acp
          docker rm "$C"
          file dist/tau-acp
          tar -czf dist/tau-acp-linux-aarch64.tar.gz -C dist tau-acp
          sha256sum dist/tau-acp-linux-aarch64.tar.gz > dist/tau-acp-linux-aarch64.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: linux-aarch64
          path: |
            dist/tau-acp-linux-aarch64.tar.gz
            dist/tau-acp-linux-aarch64.tar.gz.sha256

  darwin-aarch64:
    runs-on: macos-15
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - name: Build native binary
        run: cargo build --release --bin tau-acp
      - name: Pack and checksum
        run: |
          mkdir -p dist
          cp target/release/tau-acp dist/tau-acp
          file dist/tau-acp
          tar -czf dist/tau-acp-darwin-aarch64.tar.gz -C dist tau-acp
          shasum -a 256 dist/tau-acp-darwin-aarch64.tar.gz > dist/tau-acp-darwin-aarch64.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: darwin-aarch64
          path: |
            dist/tau-acp-darwin-aarch64.tar.gz
            dist/tau-acp-darwin-aarch64.tar.gz.sha256

  release:
    needs: [linux-x86_64, linux-aarch64, darwin-aarch64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v${{ github.event.inputs.version || '0.0.0-dev' }}"
          fi
          VERSION="${TAG#v}"
          SHA_LINUX_X86_64=$(cut -d' ' -f1 artifacts/linux-x86_64/tau-acp-linux-x86_64.tar.gz.sha256)
          SHA_LINUX_AARCH64=$(cut -d' ' -f1 artifacts/linux-aarch64/tau-acp-linux-aarch64.tar.gz.sha256)
          SHA_DARWIN_AARCH64=$(cut -d' ' -f1 artifacts/darwin-aarch64/tau-acp-darwin-aarch64.tar.gz.sha256)
          env TAG="$TAG" VERSION="$VERSION" \
            SHA_LINUX_X86_64="$SHA_LINUX_X86_64" \
            SHA_LINUX_AARCH64="$SHA_LINUX_AARCH64" \
            SHA_DARWIN_AARCH64="$SHA_DARWIN_AARCH64" \
            envsubst < acp/registry/agent.json > agent.json
          gh release create "$TAG" \
            --title "tau-acp $VERSION" \
            --notes "ACP registry binary release; the rendered agent.json is included as an asset." \
            artifacts/linux-x86_64/tau-acp-linux-x86_64.tar.gz \
            artifacts/linux-aarch64/tau-acp-linux-aarch64.tar.gz \
            artifacts/darwin-aarch64/tau-acp-darwin-aarch64.tar.gz \
            agent.json

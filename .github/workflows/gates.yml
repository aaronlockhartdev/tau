# The gate lane runs the gate table in `AGENTS.md` §Gates, so the table is the
# only place a gate is defined. The steps here install what the table's commands
# need; they are not gates.
name: gates
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Actions are pinned to a commit SHA; its tag is on the line above.
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # No toolchain step. The runner's rustup reads `rust-toolchain.toml` for this
      # directory, so the pin lives in one file; `dtolnay/rust-toolchain` takes the
      # toolchain as a required input, which would pin it a second time.
      # Swatinem/rust-cache v2.9.3
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      # taiki-e/install-action v2.90.3
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519
        with:
          tool: cargo-deny@0.20.2,cargo-nextest@0.9.152
      # taiki-e/cache-cargo-install-action v3.0.8: rumdl and lychee are not in
      # install-action, and this action installs one crate per step.
      - uses: taiki-e/cache-cargo-install-action@9ee83daaa7b96a6fab930949ecf1122bba04a389
        with:
          tool: rumdl@0.3.4
      - uses: taiki-e/cache-cargo-install-action@9ee83daaa7b96a6fab930949ecf1122bba04a389
        with:
          tool: lychee@0.24.2
      - name: gates
        run: cargo run -p tau-tools --bin gates

name: Nightly

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

# Least-privilege GITHUB_TOKEN: no job here needs write access.
permissions:
  contents: read

jobs:
  fuzz-long:
    # The long leg of the fuzz split: 1 h per target + corpus trim
    # (cargo-fuzz book CI pattern; the PR leg is fuzz-smoke in ci.yml).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly

      - uses: swatinem/rust-cache@v2.9.2

      - uses: taiki-e/install-action@v2.87.20
        with:
          tool: cargo-fuzz@0.13.2

      - name: Fuzz long (1 h per target) + corpus trim
        run: |
          cd fuzz
          cargo +nightly fuzz build --target x86_64-unknown-linux-gnu
          for t in parse_command parse_event parse_output parse_sse parse_session roundtrip_command; do
            cargo +nightly fuzz run "$t" --target x86_64-unknown-linux-gnu -- -max_total_time=3600
            cargo +nightly fuzz cmin "$t"
          done

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: fuzz-artifacts-nightly
          path: fuzz/artifacts
          if-no-files-found: ignore

  miri:
    # UB/aliasing checks scoped to the pure protocol crate — never a PR gate
    # (research/testing-rust.md §6: Miri can't run the network/FFI paths).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: miri

      - uses: swatinem/rust-cache@v2.9.2

      - name: Miri (tau-protocol)
        run: cargo +nightly miri test -p tau-protocol --lib

  asan:
    # ASan on the full workspace — nightly only: too slow for a PR gate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly

      - uses: swatinem/rust-cache@v2.9.2

      - name: ASan
        # RUSTC_WORKSPACE_WRAPPER scopes the flag to workspace members:
        # rustc refuses to instrument proc-macro units (ci/sanitizer-wrapper.sh).
        env:
          RUSTC_WORKSPACE_WRAPPER: ${{ github.workspace }}/ci/sanitizer-wrapper.sh
          SANITIZER: address
        run: cargo +nightly test --workspace

  tsan:
    # TSan on the full workspace — nightly only: too slow for a PR gate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: clippy

      - uses: swatinem/rust-cache@v2.9.2

      - uses: taiki-e/install-action@v2.87.20
        with:
          tool: cargo-machete@0.9.2

      - name: Machete (unused-deps scan — informational)
        # The tool self-declares imprecision, so this reports, not gates.
        continue-on-error: true
        run: cargo +nightly machete

      - name: Nursery lint scan (report-only — informational)
        # `redundant_clone` and `missing_const_for_fn` are nursery (nightly-only,
        # FPs expected): reports so trends are visible, does not gate.
        continue-on-error: true
        run: >-
          cargo +nightly clippy --workspace --all-targets --
          -W clippy::redundant_clone -W clippy::missing_const_for_fn

      - name: TSan
        env:
          RUSTC_WORKSPACE_WRAPPER: ${{ github.workspace }}/ci/sanitizer-wrapper.sh
          SANITIZER: thread
        run: cargo +nightly test --workspace

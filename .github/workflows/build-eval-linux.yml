# Builds the in-container tau-eval binary on a native x86_64 Linux machine.
# The binary is a static musl build: arm64 hosts cannot cross-compile it (no
# C cross-compiler for the zstd/aws-lc deps), QEMU-emulated builds segfault,
# and the trial images span glibc vintages, so the binary carries no glibc
# floor. It is downloaded into
# target/x86_64-unknown-linux-musl/release/tau-eval (workflow_dispatch is
# manual; the rig's first-use check finds the file and skips building).
name: build-eval-linux

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build static musl binary in a native rust container
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            -v tau-eval-build:/build \
            -w /src \
            -e RUSTUP_TOOLCHAIN=1.98.1 \
            -e CARGO_TARGET_DIR=/build/target \
            rust:1.98-bookworm \
            bash -c "apt-get update -qq && apt-get install -y -qq musl-tools && \
              rustup target add x86_64-unknown-linux-musl && \
              cargo build --target x86_64-unknown-linux-musl --release -p tau-eval"
      - name: Extract the binary from the build volume
        run: |
          mkdir -p target/x86_64-unknown-linux-musl/release
          C=$(docker create -v tau-eval-build:/build alpine sh)
          docker cp "$C":/build/target/x86_64-unknown-linux-musl/release/tau-eval \
            target/x86_64-unknown-linux-musl/release/tau-eval
          docker rm "$C"
      - uses: actions/upload-artifact@v4
        with:
          name: tau-eval-x86_64-linux
          path: target/x86_64-unknown-linux-musl/release/tau-eval

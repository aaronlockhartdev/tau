name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-15, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2

      - name: Install webkit2gtk
        if: runner.os == 'Linux'
        # The workspace links the Tauri app crate, which needs webkit to compile on Linux.
        run: sudo apt-get update -y && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.146

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo nextest run --workspace

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci

      - name: Build
        working-directory: app
        run: npm run build

      - name: Test
        working-directory: app
        run: npm run test

  app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.98.1

      - uses: swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Build
        run: just build

      - name: Launch smoke (leg a)
        run: just acceptance a

  linux-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install webkit2gtk + xvfb
        # The Tauri app crate needs webkit to link; xvfb gives the webview an X display.
        run: sudo apt-get update -y && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev xvfb

      - uses: dtolnay/rust-toolchain@1.98.1

      - uses: swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Build
        run: just build

      - name: Acceptance (offline core leg e)
        run: just acceptance e

      - name: Launch smoke (leg a, xvfb)
        run: just acceptance a

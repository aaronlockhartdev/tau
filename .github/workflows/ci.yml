name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-15, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2.9.2

      - name: Install webkit2gtk
        if: runner.os == 'Linux'
        # The workspace links the Tauri app crate, which needs webkit to compile on Linux.
        run: sudo apt-get update -y && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - uses: taiki-e/install-action@v2.87.19
        with:
          tool: nextest@0.9.146

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo nextest run --workspace

  file-size:
    # The AGENTS.md hard limit: no code file over 1000 lines — no grandfathering
    # (roadmap H). The repo-wide glob keeps the scope self-maintaining; the
    # vendored third_party is third-party code under its own license.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: File-size gate
        run: |
          find . -type f \
            \( -name '*.rs' -o -name '*.svelte' -o -name '*.ts' -o -name '*.js' -o -name '*.mjs' \) \
            -not -path '*/node_modules/*' \
            -not -path './target/*' \
            -not -path '*/dist/*' \
            -not -path './third_party/*' -print0 \
            | xargs -0 wc -l \
            | awk '$1 > 1000 && $2 != "total" { print "over the 1000-line hard limit: " $2 " (" $1 " lines)"; bad = 1 } END { if (bad) exit 1 }'
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci

      - name: Build
        working-directory: app
        run: npm run build

      - name: Protocol parity
        # ADR-0006's TS mirror of the Rust command surface must not silently drift (roadmap C6).
        run: node app/svelte/scripts/protocol-parity.mjs

      - name: Test
        working-directory: app
        run: npm run test

  app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@1.98.1

      - uses: swatinem/rust-cache@v2.9.2

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: taiki-e/install-action@v2.87.19
        with:
          tool: just

      - name: Build
        run: just build

      - name: Launch smoke
        run: just acceptance launch

      - name: Rust tests before E2E (official CI guide)
        run: cargo test -p tau-core

      - name: Build debug binary + install frontend deps
        run: |
          cargo build -p tau-app
          (cd app && npm ci)

      - name: E2E (real app on the shared fixture, WebdriverIO)
        # The GUI's test (roadmap G/G2): the debug binary on the shared
        # fixture, driven over the embedded WebDriver server; the runner
        # runs the lean 1k mode (docs/research/tauri-ci.md §4) — the full
        # 10k/perf bar is local via `just acceptance e2e`.
        run: |
          cd app && TAU_E2E_MODE=lean npm run test:frontend

      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-macos
          path: target/e2e/**
          if-no-files-found: warn

  linux-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install webkit2gtk + xvfb
        # The Tauri app crate needs webkit to link; xvfb gives the webview an X display.
        run: sudo apt-get update -y && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev xvfb

      - uses: dtolnay/rust-toolchain@1.98.1

      - uses: swatinem/rust-cache@v2.9.2

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: taiki-e/install-action@v2.87.19
        with:
          tool: just

      - name: Build
        run: just build

      - name: Acceptance (offline core suite)
        run: just acceptance core

      - name: Launch smoke (xvfb)
        run: just acceptance launch

      - name: Rust tests before E2E (official CI guide)
        run: cargo test -p tau-core

      - name: Build debug binary + install frontend deps
        run: |
          cargo build -p tau-app
          (cd app && npm ci)

      - name: E2E (real app on the shared fixture, WebdriverIO, xvfb)
        # The GUI's test (roadmap G/G2); xvfb gives the WebKitGTK webview
        # its display (official CI guide). The runner runs the lean 1k mode
        # (docs/research/tauri-ci.md §4) — the full 10k/perf bar is local.
        run: |
          cd app && TAU_E2E_MODE=lean xvfb-run -a npm run test:frontend

      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-linux
          path: target/e2e/**
          if-no-files-found: warn

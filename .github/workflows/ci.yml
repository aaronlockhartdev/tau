name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-15, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2.9.2

      - name: Install webkit2gtk
        if: runner.os == 'Linux'
        # The workspace links the Tauri app crate, which needs webkit to compile on Linux.
        run: sudo apt-get update -y && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - uses: taiki-e/install-action@v2.87.20
        with:
          tool: nextest@0.9.146

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo nextest run --workspace

  rust-deny:
    # Supply-chain gate (advisories + SPDX licenses + duplicates); cargo-deny
    # subsumes cargo-audit — research/testing-rust.md §5.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@1.98.1

      - uses: swatinem/rust-cache@v2.9.2

      - uses: taiki-e/install-action@v2.87.20
        with:
          tool: cargo-deny@0.20.2

      - name: Supply chain
        run: cargo deny check

  rust-coverage:
    # Report only — the 80% aim is a review-time standard, not a gate
    # (agreed phase-1 direction); --fail-under-lines is the one-flag upgrade.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: llvm-tools-preview

      - uses: swatinem/rust-cache@v2.9.2

      - name: Install webkit2gtk
        if: runner.os == 'Linux'
        run: sudo apt-get update -y && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - uses: taiki-e/install-action@v2.87.20
        with:
          tool: cargo-llvm-cov@0.9.1

      - uses: taiki-e/install-action@v2.87.20
        with:
          tool: nextest@0.9.146

      - name: Coverage (no floor)
        run: cargo llvm-cov nextest --workspace --html --output-dir coverage

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: rust-coverage
          path: coverage

  fuzz-smoke:
    # The official cargo-fuzz CI pattern (rust-fuzz book): a short per-target
    # budget on PR; the long run + corpus trim live in nightly.yml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly

      - uses: swatinem/rust-cache@v2.9.2

      - uses: taiki-e/install-action@v2.87.20
        with:
          tool: cargo-fuzz@0.13.2

      - name: Fuzz smoke (300 s per target)
        run: |
          cd fuzz
          # Explicit gnu target: cargo-fuzz's Linux default is musl, whose
          # static libc is incompatible with ASan ("sanitizer is incompatible
          # with statically linked libc").
          cargo +nightly fuzz build --target x86_64-unknown-linux-gnu
          for t in parse_command parse_event parse_output parse_sse parse_session roundtrip_command; do
            cargo +nightly fuzz run "$t" --target x86_64-unknown-linux-gnu -- -max_total_time=300
          done

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore
  file-size:
    # The AGENTS.md hard limit: no code file over 1000 lines — no grandfathering
    # (roadmap H). The repo-wide glob keeps the scope self-maintaining; the
    # vendored third_party is third-party code under its own license.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: File-size gate
        run: |
          find . -type f \
            \( -name '*.rs' -o -name '*.svelte' -o -name '*.ts' -o -name '*.js' -o -name '*.mjs' \) \
            -not -path '*/node_modules/*' \
            -not -path './target/*' \
            -not -path '*/dist/*' \
            -not -path './third_party/*' -print0 \
            | xargs -0 wc -l \
            | awk '$1 > 1000 && $2 != "total" { print "over the 1000-line hard limit: " $2 " (" $1 " lines)"; bad = 1 } END { if (bad) exit 1 }'
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci

      - name: Lint
        working-directory: app
        run: npx eslint .

      - name: Build
        working-directory: app
        run: npm run build

      - name: Protocol parity
        # ADR-0006's TS mirror of the Rust command surface must not silently drift (roadmap C6).
        run: node app/svelte/scripts/protocol-parity.mjs

      - name: Test
        working-directory: app
        run: npx vitest run --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v7.0.1
        with:
          name: frontend-coverage
          path: app/coverage/

  macos-acceptance:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@1.98.1

      - uses: swatinem/rust-cache@v2.9.2

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: taiki-e/install-action@v2.87.20
        with:
          tool: just

      - name: Build
        run: just build

      - name: Acceptance (full set — deterministic mock LLM)
        # launch + live-tools + live-subagent + live-om + core + e2e in one
        # run: the live-* suites run against the mock (phase 1 §4), so the
        # whole set is a CI gate; e2e stays on the replay leg here (the 10k
        # stress leg is a local perf bar — docs/research/tauri-ci.md §4).
        run: TAU_E2E_MODE=replay just acceptance

      - name: Upload dmg (distribution artifact)
        uses: actions/upload-artifact@v7.0.1
        with:
          name: tau-macos-dmg
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: warn

      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: e2e-failure-macos
          path: target/e2e/**
          if-no-files-found: warn

  linux-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install webkit2gtk + xvfb
        # The Tauri app crate needs webkit to link; xvfb gives the webview an X display.
        run: sudo apt-get update -y && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev xvfb

      - uses: dtolnay/rust-toolchain@1.98.1

      - uses: swatinem/rust-cache@v2.9.2

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: taiki-e/install-action@v2.87.20
        with:
          tool: just

      - name: Build
        run: just build

      - name: Acceptance (full set — deterministic mock LLM)
        # launch + live-tools + live-subagent + live-om + core + e2e in one
        # run (the justfile wraps the headless e2e leg in xvfb); e2e stays
        # on the replay leg (the 10k stress leg is a local perf bar).
        run: TAU_E2E_MODE=replay just acceptance

      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: e2e-failure-linux
          path: target/e2e/**
          if-no-files-found: warn

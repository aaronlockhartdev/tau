[package]
name = "tau-test"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
# Cargo forbids partial overrides of inherited workspace lints, so the
# workspace list is restated here with the panic-fence exemptions
# (AGENTS.md: test-harness crates may unwrap/panic). Keep in sync with
# the root [workspace.lints.clippy].
clippy.pedantic = { level = "warn", priority = -1 }
clippy.as_conversions = "deny"
clippy.string_slice = "deny"
clippy.missing_errors_doc = "allow"
clippy.missing_panics_doc = "allow"
clippy.missing_safety_doc = "allow"
clippy.unwrap_used = "allow"
clippy.panic = "allow"
clippy.dbg_macro = "deny"

[dependencies]
tau-core = { path = "../tau-core" }
tau-mock-llm = { path = "../tau-mock-llm" }
tokio = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
tempfile = { workspace = true }

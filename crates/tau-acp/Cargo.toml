[package]
name = "tau-acp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
# Production (default): compile tracing out (max_level_off, zero cost).
# Diagnostic: `--no-default-features --features log-llm-requests` → trace level
# + the RUST_LOG-driven subscriber. This only selects the `max_level` — the wire
# log is ordinary `trace!`, so no separate feature gates it. The two max_levels
# are mutually exclusive: tracing resolves to the most restrictive enabled. (#98)
default = ["tracing/max_level_off"]
log-llm-requests = ["tracing/max_level_trace", "dep:tracing-subscriber"]

[dependencies]
tau-core = { path = "../tau-core" }
tau-protocol = { path = "../tau-protocol" }
tokio = { workspace = true, features = ["io-std"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter", "fmt"] }

[dev-dependencies]
tau-mock-llm = { path = "../tau-mock-llm" }
tempfile = { workspace = true }

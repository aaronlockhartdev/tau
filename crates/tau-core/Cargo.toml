[package]
name = "tau-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Gates the provider wire log (request + response as `tracing` events). The
# `max_level` is set by the consuming binary (off by default, trace for a
# diagnostic build), not here. Replaces the bespoke file-append logger. (#98)
log-llm-requests = []

[dependencies]
serde = { workspace = true }
base64 = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { version = "0.1" }
reqwest = { workspace = true }
toml = { workspace = true }
zstd = { workspace = true }
xxhash-rust = { workspace = true }
# Adjective-noun session names (top-level and sub-agent children).
names = { workspace = true }
rand = { workspace = true }
notify = { workspace = true }
notify-debouncer-full = { workspace = true }
tau-protocol = { path = "../tau-protocol" }

[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }
sha2 = { workspace = true }
tracing-test = { version = "0.2", features = ["no-env-filter"] }

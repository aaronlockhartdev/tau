[workspace]
resolver = "2"
members = ["crates/tau-core", "crates/tau-protocol", "crates/tau-mock-llm", "crates/tau-test", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
base64 = "0.23"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
toml = "1"
tempfile = "3"
zstd = "0.14"
xxhash-rust = { version = "0.8", features = ["xxh3", "xxh32"] }
names = { version = "0.14", default-features = false }
rand = "0.10"
proptest = "1.11"
insta = { version = "1", features = ["json"] }
sha2 = "0.10"
notify = "8.2"
notify-debouncer-full = "0.7"

[workspace.lints.clippy]
# Maximum strictness (2026-10-01): the whole pedantic group (CI's `-D warnings`
# makes it a hard gate), plus the two restriction lints section 0 deferred
# under the wave rule. Deliberate exceptions below are documented, one line each.
# Rationale and sources: docs/research/refactor-rust.md §2.
pedantic = { level = "warn", priority = -1 }
as_conversions = "deny"
string_slice = "deny"
# The panic fence (AGENTS.md Best practices → Rust): production code must
# not panic on foreseeable failure — expect() with a stated invariant, or a
# Result path, not unwrap()/panic!(). Test code and the test-harness crates
# (tau-test, tau-mock-llm) are exempted per-crate below. The two "warn"s
# flip to "deny" once the production conversions land.
unwrap_used = "warn"
panic = "warn"
# Zero-tolerance everywhere: dbg! is a debugging artifact, never shipped.
# (the clippy lint is named `dbg_macro`)
dbg_macro = "deny"
# The docs lints conflict with the codified comment discipline (AGENTS.md):
# doc comments are for public API items whose contract is not self-evident,
# not mandatory on every Result/panic/unsafe surface.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_safety_doc = "allow"

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.dependencies]
cucumber = "0.23"
proptest = "1.12"
rusqlite = { version = "0.41", default-features = false, features = ["bundled"] }
rusqlite_migration = "2.7"
serde_json = "1"
tau-core = { path = "crates/tau-core" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# The bug-catching groups are denied; the style groups stay warn, where the
# false-positive rate is high and there is no auto-fix (R-workspace-09).
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
# The two `await_holding_*` denies are the mechanical form of a rule the lanes cannot test, at the
# clauses' request (R-workspace-09, R-workspace-15). `await_holding_invalid_type` is the opt-in
# half: `clippy.toml` names the blocking types one by one as core grows them.
await_holding_lock = "deny"
await_holding_invalid_type = "deny"
unwrap_used = "deny"
expect_used = "deny"
# `unwrap_used`/`expect_used` deny everywhere except test code, which opts out
# at the crate root with `#![cfg_attr(test, allow(...))]`.

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.dependencies]
cucumber = "0.23"
proptest = "1.12"
rusqlite = { version = "0.41", default-features = false, features = ["bundled"] }
rusqlite_migration = "2.7"
serde_json = "1"
tau-core = { path = "crates/tau-core" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# The bug-catching groups are denied; the style groups stay warn, where the
# false-positive rate is high and there is no auto-fix (R-workspace-09).
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
# The two `await_holding_*` denies are at the clause's request (R-workspace-09); the type list is a
# `clippy.toml` item, not a level here (tasks.md in `changes/adopt_async_core`).
await_holding_lock = "deny"
await_holding_invalid_type = "deny"
unwrap_used = "deny"
expect_used = "deny"
# `unwrap_used`/`expect_used` deny everywhere except test code, which opts out
# at the crate root with `#![cfg_attr(test, allow(...))]`.

# Terminal-Bench 2.0 selection for the live leg.
#
# The dataset itself is not in this repo: the rig fetches it at runtime
# (shallow clone of `repo` into target/terminal-bench, skipped when
# present). This file records the curation only: which tasks we
# benchmark, and which we exclude with the reason on record.

repo = "https://github.com/laude-institute/terminal-bench-2"

tasks = [
    "adaptive-rejection-sampler",
    "bn-fit-modify",
    "break-filter-js-from-html",

[[quarantine]]
    name = "build-pmars"
    reason = "oracle gate failed: apt pin drift (dpkg-dev=1.22.21 no longer in the image's apt sources); environment issue, not agent-measurable"

[[quarantine]]
    name = "build-pov-ray"
    reason = "oracle gate failed: the oracle downloads POV-Ray source from povray.org, which 403s this egress; external service block"

[[quarantine]]
    name = "git-multibranch"
    reason = "oracle gate failed: the oracle requires tmux, which the pre-built task image does not provide; upstream image/oracle mismatch"

# Gate config for `cargo deny check` (AGENTS.md: dependencies current).
# RustSec is one advisory source; Dependabot is the other (.github/dependabot.yml).

[advisories]
db-urls = ["https://github.com/RustSec/advisory-db.git"]
version = 2

[licenses]
# The workspace is unlicensed scaffold code today; this list is the tree's, not
# a licence choice. Extend it when a dependency lands under a new terms.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0",
  "CC0-1.0",
  "BSL-1.0",
  "LGPL-2.1-or-later",
  "OpenSSL",
  "BlueOak-1.0.0",
]
# The six workspace crates are scaffold: version 0.0.0, no `license` field, and
# `publish = false`, which is what marks them private here. A crate that becomes
# publishable needs a `license` field, and then this check covers it.
private = { ignore = true }
confidence-threshold = 1.0

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>τ pulse · feed-first prototype</title>
<style>
:root {
  --bg: #0a0c10; --panel: #11141a; --panel2: #161b23; --line: #1e232d; --line2: #2a3140;
  --text: #e6e9ef; --text2: #9aa3b2; --faint: #5c6572;
  --accent: #4c8dff; --green: #3fb950; --red: #f85149; --amber: #d29920; --purple: #a371f7;
  --mono: 'SF Mono', ui-monospace, 'Menlo', monospace;
  --sans: -apple-system, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font: 13px var(--sans); }
#app { display: grid; grid-template-rows: 48px 1fr 24px; height: 100vh; }

/* ── topbar ─────────────────────────────────────────────── */
.topbar { display: flex; align-items: center; gap: 12px; padding: 0 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
.logo { font-weight: 700; font-size: 13.5px; letter-spacing: .01em; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.logo .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px rgba(63,185,80,.55); }
.topbar .sub { font-size: 11.5px; color: var(--faint); white-space: nowrap; }
.search { flex: 0 1 240px; position: relative; }
.search input { width: 100%; background: var(--bg); border: 1px solid var(--line2); border-radius: 6px; color: var(--text); font: 12.5px var(--sans); padding: 5px 10px 5px 26px; outline: none; }
.search input:focus { border-color: var(--accent); }
.search svg { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); width: 12px; height: 12px; stroke: var(--faint); fill: none; stroke-width: 2; }
.spacer { flex: 1; }
.btn { display: flex; align-items: center; gap: 6px; background: var(--bg); border: 1px solid var(--line2); border-radius: 6px; color: var(--text2); font: 12px var(--sans); padding: 5px 10px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--faint); color: var(--text); }
.btn kbd { font: 10px var(--mono); color: var(--faint); }
.bell { position: relative; }
.bell .n { position: absolute; top: -6px; right: -6px; min-width: 15px; height: 15px; border-radius: 8px; background: var(--red); color: #fff; font: 700 9.5px var(--mono); display: flex; align-items: center; justify-content: center; padding: 0 3px; }

/* ── body: rail | feedcol | drawer ──────────────────────── */
.body { display: grid; grid-template-columns: 40px 1fr 0px; min-height: 0; }
#app.drawer .body { grid-template-columns: 40px 1fr 440px; }

.ws-rail { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; padding: 10px 0; gap: 7px; }
.ws-dot { width: 11px; height: 11px; border-radius: 3.5px; cursor: pointer; opacity: .45; border: 1px solid transparent; }
.ws-dot:hover { opacity: .8; }
.ws-dot.on { opacity: 1; border-color: var(--text); }
.ws-dot.all { background: var(--line2) !important; border-radius: 50%; }
.rail-sep { width: 18px; height: 1px; background: var(--line); margin: 5px 0; flex: none; }
.sess-dot { width: 8px; height: 8px; border-radius: 50%; cursor: pointer; opacity: .55; flex: none; }
.sess-dot:hover { opacity: 1; }
.sess-dot.on { opacity: 1; box-shadow: 0 0 0 2px var(--panel), 0 0 0 3.5px var(--text2); }
.sess-dot.running { animation: pulse 1.3s infinite; }

.feedcol { display: grid; grid-template-rows: auto auto 1fr; min-width: 0; min-height: 0; background: var(--bg); position: relative; }

/* filter chips + live toggle */
.chips { display: flex; align-items: center; gap: 6px; padding: 7px 12px; border-bottom: 1px solid var(--line); }
.chip { font-size: 11.5px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line2); color: var(--text2); cursor: pointer; display: flex; gap: 5px; align-items: center; white-space: nowrap; }
.chip:hover { border-color: var(--faint); color: var(--text); }
.chip.on { background: rgba(76,141,255,.14); border-color: var(--accent); color: var(--text); }
.chip .n { font: 10px var(--mono); color: var(--faint); }
.chip.on .n { color: var(--text2); }
.livebtn { margin-left: auto; display: flex; align-items: center; gap: 6px; font: 10.5px var(--mono); color: var(--faint); cursor: pointer; user-select: none; }
.livebtn .ld { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
.livebtn.on { color: var(--green); }
.livebtn.on .ld { background: var(--green); animation: pulse 1.3s infinite; }

/* live strip */
.strip { display: flex; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); overflow-x: auto; align-items: center; min-height: 44px; }
.tile { display: flex; align-items: center; gap: 9px; padding: 6px 11px; background: var(--panel); border: 1px solid var(--line); border-radius: 7px; cursor: pointer; white-space: nowrap; flex: none; }
.tile:hover { border-color: var(--line2); background: var(--panel2); }
.tile .pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--green); animation: pulse 1.3s infinite; }
.tile .nm { font-size: 12px; font-weight: 600; }
.tile .tk { font: 10.5px var(--mono); color: var(--faint); }
.strip .empty { font-size: 12px; color: var(--faint); }

/* feed */
.feed { overflow-y: auto; padding-bottom: 28px; scroll-behavior: auto; }
.feedempty { padding: 30px 12px; font-size: 12.5px; color: var(--faint); }
.needs { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid rgba(248,81,73,.35); padding: 8px 12px 9px; }
.needs .h { font-size: 10px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--red); margin-bottom: 6px; }
.needrow { display: flex; align-items: center; gap: 9px; padding: 6px 9px; border-radius: 6px; cursor: pointer; background: rgba(248,81,73,.08); margin-bottom: 4px; border: 1px solid rgba(248,81,73,.22); }
.needrow:hover { background: rgba(248,81,73,.14); }
.needrow .nm { font-size: 12px; font-weight: 600; white-space: nowrap; }
.needrow .why { color: var(--text2); font-size: 12px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.needrow .ago { font: 10.5px var(--mono); color: var(--faint); }
.needrow .op { font-size: 11px; color: var(--red); font-weight: 600; white-space: nowrap; }

.row { display: grid; grid-template-columns: 44px 10px 158px 14px 1fr auto; gap: 8px; align-items: baseline; padding: 3.5px 12px; cursor: pointer; border-left: 2px solid transparent; }
.row:hover { background: rgba(255,255,255,.03); }
.row.sel { background: rgba(76,141,255,.09); border-left-color: var(--accent); }
.row .t { font: 10.5px var(--mono); color: var(--faint); }
.row .dot { width: 7px; height: 7px; border-radius: 50%; align-self: center; }
.row .who { font-size: 12px; font-weight: 600; color: var(--text2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .ic { font-size: 11px; color: var(--faint); text-align: center; }
.row .tx { font-size: 12.5px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .tx code { font: 11.5px var(--mono); background: var(--panel2); padding: 1px 5px; border-radius: 4px; }
.row .rt { font: 10.5px var(--mono); color: var(--faint); white-space: nowrap; }
.row.k-think .tx { color: var(--text2); font-style: italic; }
.row.k-think .ic { color: var(--purple); }
.row.k-tool .ic { color: var(--accent); }
.row.k-file .ic { color: var(--green); }
.row.k-sub .ic { color: var(--amber); }
.row.k-user .tx { color: var(--text); font-weight: 500; }
.row.k-user .who { color: var(--accent); }
.row.k-needs .tx { color: var(--red); }
.row.k-needs .ic { color: var(--red); }
.row.k-needs { background: rgba(248,81,73,.05); }
.row.k-cost .rt { color: var(--green); }
.row.k-compact .tx { color: var(--faint); }
.row.k-queue .tx { color: var(--text2); }
.row.k-queue .ic { color: var(--faint); }
.row.live .dot { background: var(--green) !important; animation: pulse 1.1s infinite; }
.row.new { animation: rowin .3s ease; }
@keyframes rowin { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }

/* jump-to-latest pill */
.jlatest { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 6; background: var(--accent); color: #fff; font: 11.5px var(--sans); font-weight: 600; border: none; border-radius: 999px; padding: 6px 14px; cursor: pointer; box-shadow: 0 6px 20px rgba(76,141,255,.4); display: none; }
.jlatest.show { display: block; }

/* ── drawer ─────────────────────────────────────────────── */
.drawer { min-width: 0; overflow: hidden; border-left: 1px solid var(--line); background: var(--panel); display: grid; grid-template-rows: auto 1fr auto auto; }
.dhead { display: flex; align-items: center; gap: 9px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.dhead .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.dhead .nm { font-weight: 700; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dhead .ws { font: 10.5px var(--mono); color: var(--faint); border: 1px solid var(--line2); border-radius: 4px; padding: 1px 6px; flex: none; }
.dhead .mdl { font: 10.5px var(--mono); color: var(--faint); margin-left: auto; flex: none; }
.dhead .x { background: none; border: none; color: var(--faint); cursor: pointer; font-size: 15px; line-height: 1; padding: 2px 6px; border-radius: 4px; flex: none; }
.dhead .x:hover { color: var(--text); background: var(--panel2); }
.dtrans { overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 9px; }
.dentry { max-width: 94%; }
.dentry .eh { display: flex; gap: 8px; align-items: baseline; margin-bottom: 3px; }
.dentry .who { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text2); }
.dentry .tm { font: 10px var(--mono); color: var(--faint); }
.dentry .eb { font-size: 12.5px; line-height: 1.5; color: var(--text); }
.dentry .eb code { font: 11.5px var(--mono); background: var(--panel2); padding: 1px 5px; border-radius: 4px; }
.dentry.user { align-self: flex-end; background: rgba(76,141,255,.1); border: 1px solid rgba(76,141,255,.28); border-radius: 8px; padding: 7px 10px; }
.dentry.user .who { color: var(--accent); }
.dentry.k-tool .eb { color: var(--text2); font: 11.5px var(--mono); }
.dentry.k-file .eb { color: var(--text2); font: 11.5px var(--mono); }
.dentry.k-sub .eb { color: var(--text2); }
.dentry.k-needs .eb { color: var(--red); }
.dentry.k-cost .eb { color: var(--faint); font: 11.5px var(--mono); }
.dentry.k-compact .eb { color: var(--faint); font: 11.5px var(--mono); }
.dentry.k-think .eb { color: var(--faint); font-style: italic; }
.dentry.k-queue .eb { color: var(--text2); }
.dqueue { border-top: 1px solid var(--line); padding: 7px 12px; max-height: 96px; overflow-y: auto; }
.dq-h { font-size: 9.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin: 3px 0; }
.dq-i { font-size: 12px; color: var(--text2); padding: 2px 0; }
.dcomp { border-top: 1px solid var(--line); padding: 10px 12px 12px; }
.dcomp textarea { width: 100%; background: var(--bg); border: 1px solid var(--line2); border-radius: 6px; color: var(--text); font: 13px var(--sans); padding: 8px 10px; resize: none; height: 54px; outline: none; }
.dcomp textarea:focus { border-color: var(--accent); }
.dcomp .f { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.dcomp .lane { font: 10.5px var(--mono); color: var(--faint); cursor: pointer; border: 1px solid var(--line2); border-radius: 5px; padding: 3px 8px; }
.dcomp .lane.on { color: var(--text); border-color: var(--accent); background: rgba(76,141,255,.12); }
.dcomp .send { margin-left: auto; background: var(--accent); border: none; color: #fff; font: 12px var(--sans); font-weight: 600; border-radius: 6px; padding: 6px 14px; cursor: pointer; }
.dcomp .send:hover { filter: brightness(1.1); }

/* ── statusbar ──────────────────────────────────────────── */
.statusbar { display: flex; align-items: center; gap: 16px; padding: 0 12px; background: var(--panel); border-top: 1px solid var(--line); font: 11px var(--mono); color: var(--faint); white-space: nowrap; overflow: hidden; }
.statusbar b { color: var(--text2); font-weight: 500; }
.statusbar .r { margin-left: auto; }

/* ── toasts + palette ───────────────────────────────────── */
.toasts { position: fixed; right: 14px; bottom: 34px; display: flex; flex-direction: column; gap: 8px; z-index: 60; }
.toast { background: var(--panel2); border: 1px solid var(--line2); border-left: 3px solid var(--accent); border-radius: 7px; padding: 9px 13px; font-size: 12.5px; box-shadow: 0 10px 30px rgba(0,0,0,.5); animation: rowin .25s ease; max-width: 340px; }
.toast.red { border-left-color: var(--red); }
.toast .tt { font-weight: 600; }
.toast .ts { color: var(--text2); font-size: 11.5px; margin-top: 2px; }
.pal { position: fixed; left: 50%; top: 15%; transform: translate(-50%, -8px); width: 560px; max-width: calc(100vw - 32px); z-index: 50; background: var(--panel); border: 1px solid var(--line2); border-radius: 8px; overflow: hidden; opacity: 0; pointer-events: none; transition: opacity .15s, transform .15s; box-shadow: 0 16px 48px rgba(0,0,0,.55); }
.pal.open { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
.pal-in { width: 100%; padding: 13px 16px; background: none; border: none; outline: none; color: var(--text); font: 13.5px var(--sans); border-bottom: 1px solid var(--line); }
.pal-list { max-height: 340px; overflow-y: auto; padding: 6px; }
.pal-g { padding: 8px 10px 3px; font-size: 10px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); }
.pal-item { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 6px; font-size: 13px; color: var(--text2); cursor: pointer; }
.pal-item.on { background: rgba(76,141,255,.13); color: var(--text); }
.pal-item kbd { margin-left: auto; font: 10.5px var(--mono); color: var(--faint); }
.pal-empty { padding: 18px 12px; font-size: 12.5px; color: var(--faint); }
.pal-foot { padding: 7px 12px; border-top: 1px solid var(--line); font: 10.5px var(--mono); color: var(--faint); }
</style>
</head>
<body>
<div id="app"></div>
<script>
// ── helpers ──────────────────────────────────────────────
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const pad2 = n => String(n).padStart(2,'0');
const now = () => { const d = new Date(); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); };
const ago = min => { const d = new Date(Date.now() - min * 60000); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); };
let _eid = 0;
function ev(time, sid, kind, text, rt, live) { return { id: 'e' + (++_eid), time, sid, kind, text: esc(text), rt: rt || '', live: !!live, born: 0 }; }
function push(sid, kind, text, rt, live) { const e = ev(now(), sid, kind, text, rt, live); e.born = Date.now(); FEED.push(e); return e; }

// ── data ─────────────────────────────────────────────────
const WS = {
  tau:    { name: 'tau',           color: '#4c8dff' },
  chairs: { name: 'bloody-chairs', color: '#d29920' },
  pi:     { name: 'pi',            color: '#a371f7' },
};
const SESS = [
  { id: 's1', ws: 'tau',    name: 'CSS architecture review',    model: 'qwen3.7:latest', state: 'running', tok: 42100, cost: 0.31, files: 2, activity: 'drafting token scale' },
  { id: 's2', ws: 'tau',    name: 'Refactor store windowing',   model: 'qwen3.7:latest', state: 'running', tok: 84200, cost: 0.31, files: 2, activity: 'bash cargo clippy' },
  { id: 's3', ws: 'tau',    name: 'Wayfinder map #12',          model: 'gpt-5.2',        state: 'needs',   tok: 41200, cost: 0.12, files: 0, activity: 'asked a question', need: '“Should the board view ship in v0?”', needAgo: '12m' },
  { id: 's4', ws: 'chairs', name: 'Input remap pass',           model: 'gpt-5.2',        state: 'running', tok: 18200, cost: 0.12, files: 1, activity: 'editing src/timing.rs' },
  { id: 's5', ws: 'tau',    name: 'Compaction thresholds',      model: 'gpt-5.2',        state: 'idle',    tok: 61000, cost: 0.18, files: 3, activity: 'done 3d' },
  { id: 's6', ws: 'chairs', name: 'Credits screen pass',        model: 'llama3.3:70b',   state: 'idle',    tok: 22000, cost: 0.04, files: 2, activity: 'idle 40m' },
  { id: 's7', ws: 'pi',     name: 'Protocol versioning note',   model: 'o4-mini',        state: 'running', tok: 9400,  cost: 0.06, files: 1, activity: 'reading docs/spec/v0.md' },
  { id: 's8', ws: 'pi',     name: 'Fuzz harness triage',        model: 'gpt-5.2',        state: 'done',    tok: 31000, cost: 0.09, files: 4, activity: 'finished 26m' },
];
const sById = id => SESS.find(x => x.id === id);
const fmtK = n => n >= 1000 ? (n/1000).toFixed(1) + 'k' : String(n);

let FEED = [
  ev(ago(15),'s2','turn','turn started · qwen3.7:latest'),
  ev(ago(14),'s2','tool','bash ✓ 2.4s — cargo test -p tau-gui','2.4s'),
  ev(ago(14),'s1','tool','grep ✓ 0.2s — “hover” → 7 components','0.2s'),
  ev(ago(13),'s1','think','thinking 4.2s'),
  ev(ago(13),'s1','entry','So my read: keep the per-component <style> blocks — scoped styles are the feature, not the bug.'),
  ev(ago(12),'s7','turn','turn started · o4-mini'),
  ev(ago(12),'s7','tool','read ✓ 0.3s — docs/spec/v0.md','0.3s'),
  ev(ago(11),'s4','turn','turn started · gpt-5.2'),
  ev(ago(11),'s4','tool','bash ✓ 1.1s — grep -rn “bind” src/','1.1s'),
  ev(ago(10),'s3','needs','needs you — “Should the board view ship in v0?”','12m'),
  ev(ago(9),'s1','sub','researcher → running · context: fresh · 18.2k tok'),
  ev(ago(9),'s1','entry','I will draft a token scale with the two themes in mind while the researcher surveys sibling tools.'),
  ev(ago(8),'s2','entry','windowing pass is in — virtualization off, paged hydration on'),
  ev(ago(8),'s1','file','wrote docs/notes/tokens.md · +18','+18'),
  ev(ago(7),'s7','file','wrote docs/adr/0011-protocol-versioning.md · +42','+42'),
  ev(ago(7),'s7','cost','turn complete · +$0.02 · 9.4k tok','+$0.02'),
  ev(ago(6),'s1','compact','compaction · observation log · 25.5k / 40.0k'),
  ev(ago(6),'s4','entry','two bindings collide — remapping layer 3 before the global map applies'),
  ev(ago(5),'s1','entry','the scale gets a per-theme accent family: --acc, --acc-soft, --acc-ghost'),
  ev(ago(5),'s2','tool','bash … running — cargo clippy -p tau-gui','live',true),
  ev(ago(4),'s1','queue','steering queued — “Also consider a shared tokens layer so the two themes can swap”'),
  ev(ago(3),'s4','queue','follow-up queued — “then check the settings page”'),
];

const QUEUE = {
  s1: { steering: ['Also consider a shared tokens layer so the two themes can swap'], followup: [] },
  s4: { steering: [], followup: ['then check the settings page'] },
};

// ── state ────────────────────────────────────────────────
const S = {
  ws: null, filter: 'all', live: true, search: '',
  drawer: null, selId: null,
  dtext: {}, dlane: {},
  pal: false, palText: '', palSel: 0,
  toasts: [], bell: 1,
  sim: { t: 0, i: 0 },
};
function toast(tt, ts, red) { S.toasts.push({ tt, ts, red }); if (S.toasts.length > 3) S.toasts.shift(); setTimeout(() => { S.toasts.shift(); render(); }, 6000); }

// ── filters ──────────────────────────────────────────────
const FILTERS = {
  all:     () => true,
  running: e => sById(e.sid).state === 'running',
  needs:   () => false,
  tools:   e => e.kind === 'tool' || e.kind === 'think',
  files:   e => e.kind === 'file',
  subs:    e => e.kind === 'sub',
  cost:    e => e.kind === 'cost',
};
const CHIPDEFS = [ ['all','all'], ['running','running'], ['needs','needs you'], ['tools','tools'], ['files','files'], ['subs','sub-agents'], ['cost','cost'] ];
function visibleFeed() {
  const q = S.search.toLowerCase();
  return FEED.filter(e => (!S.ws || sById(e.sid).ws === S.ws) && (S.filter === 'needs' ? e.kind === 'needs' : FILTERS[S.filter])(e) && (!q || (e.text + ' ' + sById(e.sid).name).toLowerCase().includes(q)));
}
function chipCount(id) {
  const inWs = e => !S.ws || sById(e.sid).ws === S.ws;
  if (id === 'needs') return SESS.filter(s => s.state === 'needs' && (!S.ws || s.ws === S.ws)).length;
  return id === 'all' ? FEED.filter(inWs).length : FEED.filter(e => inWs(e) && FILTERS[id](e)).length;
}
// ── render ───────────────────────────────────────────────
const ICON = { turn: '▶', think: '✻', tool: '⚙', entry: '✎', user: '➤', needs: '!', sub: '⑂', file: '≡', cost: '$', compact: '⇓', queue: '⏱' };

function shell() {
  const run = SESS.filter(s => s.state === 'running' && (!S.ws || s.ws === S.ws)).length;
  const need = SESS.filter(s => s.state === 'needs' && (!S.ws || s.ws === S.ws)).length;
  const tot = SESS.reduce((a, s) => a + s.cost, 0).toFixed(2);
  return `
  <div class="topbar">
    <div class="logo"><span class="dot"></span>τ pulse</div>
    <div class="sub">feed-first · every session, one stream</div>
    <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="s-search" placeholder="filter the stream…  ( / )" value="${esc(S.search)}"></div>
    <div class="spacer"></div>
    <button class="btn bell" data-act="bell">🔔${S.bell ? `<span class="n">${S.bell}</span>` : ''}</button>
    <button class="btn" data-act="pal">command <kbd>⌘K</kbd></button>
  </div>
  <div class="body">${railHtml()}${feedcolHtml()}${drawerHtml()}</div>
  <div class="statusbar">
    <span><b>${run}</b> running</span>
    <span><b style="color:${need ? 'var(--red)' : ''}">${need}</b> need you</span>
    <span><b>${FEED.length}</b> events</span>
    <span>$<b>${tot}</b> total</span>
    <span class="r">${S.live ? 'live ●' : 'paused'} · j/k move · ⏎ open · ⌘K</span>
  </div>
  <div class="toasts">${S.toasts.map(t => `<div class="toast ${t.red ? 'red' : ''}"><div class="tt">${esc(t.tt)}</div>${t.ts ? `<div class="ts">${esc(t.ts)}</div>` : ''}</div>`).join('')}</div>
  ${palHtml()}
  `;
}

function railHtml() {
  const wsDots = Object.entries(WS).map(([id, w]) =>
    `<div class="ws-dot ${S.ws === id ? 'on' : ''}" style="background:${w.color}" data-act="ws" data-id="${id}" title="${w.name}"></div>`).join('');
  const dots = SESS.filter(s => !S.ws || s.ws === S.ws).map(s =>
    `<div class="sess-dot ${S.drawer === s.id ? 'on' : ''} ${s.state === 'running' ? 'running' : ''}" style="background:${WS[s.ws].color}${s.state !== 'running' ? ';opacity:.3' : ''}" data-act="sdot" data-id="${s.id}" title="${esc(s.name)} · ${s.state}"></div>`).join('');
  return `<div class="ws-rail">
    <div class="ws-dot all ${S.ws === null ? 'on' : ''}" data-act="ws" data-id="" title="all workspaces"></div>
    ${wsDots}<div class="rail-sep"></div>${dots}
  </div>`;
}

function feedInnerHtml() {
  const vis = visibleFeed();
  const needs = SESS.filter(s => s.state === 'needs' && (!S.ws || s.ws === S.ws));
  const needsHtml = needs.length ? `<div class="needs"><div class="h">needs you · ${needs.length}</div>${needs.map(s =>
    `<div class="needrow" data-act="sdot" data-id="${s.id}"><span class="nm">${esc(s.name)}</span><span class="why">${esc(s.need || '')}</span><span class="ago">${s.needAgo || ''}</span><span class="op">open →</span></div>`).join('')}</div>` : '';
  const rows = vis.length ? vis.map(e => {
    const s = sById(e.sid); const age = Date.now() - e.born;
    return `<div class="row k-${e.kind} ${e.live ? 'live' : ''} ${age < 500 ? 'new' : ''} ${S.selId === e.id ? 'sel' : ''}" data-act="row" data-id="${e.id}" data-sid="${e.sid}">
      <span class="t">${e.time}</span><span class="dot" style="background:${WS[s.ws].color}"></span>
      <span class="who">${esc(s.name)}</span><span class="ic">${ICON[e.kind] || '·'}</span>
      <span class="tx">${e.text}</span><span class="rt">${e.rt}</span>
    </div>`;}).join('') : '<div class="feedempty">no events match — clear the search or pick a wider filter</div>';
  return { needsHtml, rows };
}
function feedcolHtml() {
  const vis = visibleFeed();
  const chips = CHIPDEFS.map(([id, label]) =>
    `<div class="chip ${S.filter === id ? 'on' : ''}" data-act="chip" data-id="${id}">${label}<span class="n">${chipCount(id)}</span></div>`).join('');
  const running = SESS.filter(s => s.state === 'running' && (!S.ws || s.ws === S.ws));
  const strip = running.length ? running.map(s =>
    `<div class="tile" data-act="sdot" data-id="${s.id}"><span class="pulse"></span><span class="nm">${esc(s.name)}</span><span class="tk">${fmtK(s.tok)} tok · ${esc(s.activity)}</span></div>`).join('')
    : '<span class="empty">nothing running right now</span>';
  const inner = feedInnerHtml();
  const needsHtml = inner.needsHtml, rows = inner.rows;
  return `<div class="feedcol">
    <div class="chips">${chips}<div class="livebtn ${S.live ? 'on' : ''}" data-act="live"><span class="ld"></span>${S.live ? 'live' : 'paused'}</div></div>
    <div class="strip">${strip}</div>
    <div class="feed" id="feed">${needsHtml}${rows}</div>
    <button class="jlatest" id="jlatest">↓ latest</button>
  </div>`;
}

function dentryHtml(e) {
  const who = e.kind === 'user' ? 'you' : e.kind === 'entry' ? 'agent' : { tool: 'tool', file: 'file', sub: 'sub-agent', think: 'thinking', cost: 'turn', compact: 'om', queue: 'queue', needs: 'attention', turn: 'turn' }[e.kind] || e.kind;
  return `<div class="dentry k-${e.kind} ${e.kind === 'user' ? 'user' : ''}">
    <div class="eh"><span class="who">${who}</span><span class="tm">${e.time}</span></div>
    <div class="eb">${e.text}</div>
  </div>`;
}

function drawerHtml() {
  if (!S.drawer) return '<div class="drawer"></div>';
  const s = sById(S.drawer);
  const kinds = ['entry','user','tool','file','sub','think','cost','compact','queue','needs'];
  const entries = FEED.filter(e => e.sid === s.id && kinds.includes(e.kind)).slice(-16);
  const q = QUEUE[s.id] || { steering: [], followup: [] };
  const lane = S.dlane[s.id] || 'steering';
  const qh = (q.steering.length || q.followup.length) ? `<div class="dqueue">
    ${q.steering.length ? `<div class="dq-h">steering — next opportunity</div>${q.steering.map(x => `<div class="dq-i">${esc(x)}</div>`).join('')}` : ''}
    ${q.followup.length ? `<div class="dq-h">follow-up — after work completes</div>${q.followup.map(x => `<div class="dq-i">${esc(x)}</div>`).join('')}` : ''}
  </div>` : '';
  return `<div class="drawer">
    <div class="dhead">
      <span class="dot" style="background:${WS[s.ws].color}"></span>
      <span class="nm">${esc(s.name)}</span><span class="ws">${WS[s.ws].name}</span>
      <span class="mdl">${s.model} · ${s.state}</span>
      <button class="x" data-act="dclose">✕</button>
    </div>
    <div class="dtrans" id="dtrans">${entries.map(dentryHtml).join('')}</div>
    ${qh}
    <div class="dcomp">
      <textarea id="dcomp-in" placeholder="message — enter sends as ${lane}">${esc(S.dtext[s.id] || '')}</textarea>
      <div class="f">
        <span class="lane ${lane === 'steering' ? 'on' : ''}" data-act="dlane" data-id="${s.id}" data-v="steering">steering</span>
        <span class="lane ${lane === 'followup' ? 'on' : ''}" data-act="dlane" data-id="${s.id}" data-v="followup">follow-up</span>
        <button class="send" data-act="dsend" data-id="${s.id}">send</button>
      </div>
    </div>
  </div>`;
}

function palItems() {
  const items = [];
  for (const [id, label] of CHIPDEFS) items.push({ g: 'filter', label: 'filter: ' + label, run: () => { S.filter = id; } });
  items.push({ g: 'view', label: (S.live ? 'pause' : 'resume') + ' live stream', run: () => { S.live = !S.live; } });
  items.push({ g: 'view', label: S.drawer ? 'close session drawer' : 'open a session', run: () => { S.drawer = S.drawer ? null : 's1'; } });
  for (const s of SESS) items.push({ g: 'open session', label: s.name + '  ·  ' + WS[s.ws].name, run: () => { S.drawer = s.id; if (S.ws && s.ws !== S.ws) S.ws = null; } });
  return items;
}
function palHtml() {
  if (!S.pal) return '';
  const q = S.palText.toLowerCase();
  const items = palItems().filter(i => !q || i.label.toLowerCase().includes(q));
  let html = '', lastG = '';
  for (const i of items) { if (i.g !== lastG) { html += `<div class="pal-g">${i.g}</div>`; lastG = i.g; } html += `<div class="pal-item">${esc(i.label)}</div>`; }
  return `<div class="pal open"><input class="pal-in" id="pal-in" placeholder="type a command…" value="${esc(S.palText)}"><div class="pal-list">${html || '<div class="pal-empty">no matches</div>'}</div><div class="pal-foot">${items.length} commands · ⏎ run first · esc close</div></div>`;
}

// ── render ───────────────────────────────────────────────
function render() { wire(); }
function wire() {
  const app = document.getElementById('app');
  app.className = S.drawer ? 'drawer' : '';
  const was = document.activeElement && document.activeElement.id ? document.activeElement.id : null;
  const feed = document.getElementById('feed');
  const dist = feed ? feed.scrollHeight - feed.scrollTop - feed.clientHeight : 0;
  const stick = S.live && dist < 60;
  const dtr = document.getElementById('dtrans');
  const dstick = dtr ? dtr.scrollHeight - dtr.scrollTop - dtr.clientHeight < 50 : true;
  app.innerHTML = shell();

  const f2 = document.getElementById('feed');
  if (f2) {
    f2.scrollTop = stick ? f2.scrollHeight : Math.max(0, f2.scrollHeight - dist - f2.clientHeight);
    f2.addEventListener('scroll', () => { const jl = document.getElementById('jlatest'); if (jl) jl.classList.toggle('show', f2.scrollHeight - f2.scrollTop - f2.clientHeight > 120); });
  }
  const d2 = document.getElementById('dtrans');
  if (d2 && dstick) d2.scrollTop = d2.scrollHeight;

  app.addEventListener('click', e => {
    const el = e.target.closest('[data-act]'); if (!el) return;
    const act = el.dataset.act, id = el.dataset.id;
    if (act === 'ws') { S.ws = id || null; S.selId = null; }
    else if (act === 'sdot') S.drawer = id;
    else if (act === 'chip') S.filter = id;
    else if (act === 'live') S.live = !S.live;
    else if (act === 'bell') S.filter = S.filter === 'needs' ? 'all' : 'needs';
    else if (act === 'pal') S.pal = true;
    else if (act === 'row') S.selId = id;
    else if (act === 'dclose') S.drawer = null;
    else if (act === 'dlane') S.dlane[id] = el.dataset.v;
    else if (act === 'dsend') { dsend(id); return; }
    else if (act === 'palx') { S.pal = false; render(); return; }
    render();
  });
  app.addEventListener('dblclick', e => { const el = e.target.closest('[data-act="row"]'); if (el) { S.drawer = el.dataset.sid; render(); } });
  const sr = app.querySelector('#s-search');
  if (sr) sr.addEventListener('input', () => { S.search = sr.value; const f = document.getElementById('feed'); if (f) { const i2 = feedInnerHtml(); f.innerHTML = i2.needsHtml + i2.rows; } });
  const ci = app.querySelector('#dcomp-in');
  if (ci) { ci.addEventListener('input', () => { S.dtext[S.drawer] = ci.value; }); ci.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); dsend(S.drawer); } }); }
  const pi = app.querySelector('#pal-in');
  if (pi) pi.addEventListener('input', () => {
    S.palText = pi.value;
    const q = S.palText.toLowerCase();
    const items = palItems().filter(i => !q || i.label.toLowerCase().includes(q));
    let html = '', lastG = '';
    for (const i of items) { if (i.g !== lastG) { html += `<div class="pal-g">${i.g}</div>`; lastG = i.g; } html += `<div class="pal-item">${esc(i.label)}</div>`; }
    const list = document.querySelector('.pal-list'); if (list) list.innerHTML = html || '<div class="pal-empty">no matches</div>';
    const foot = document.querySelector('.pal-foot'); if (foot) foot.textContent = items.length + ' commands · ⏎ run first · esc close';
  });

  if (was === 's-search') { const i = app.querySelector('#s-search'); if (i) { i.focus(); i.selectionStart = i.selectionEnd = i.value.length; } }
  if (was === 'dcomp-in') { const i = app.querySelector('#dcomp-in'); if (i) i.focus(); }
  const p = app.querySelector('#pal-in');
  if (p) { p.focus(); if (was === 'pal-in') { p.selectionStart = p.selectionEnd = p.value.length; } else p.select(); }
}

function dsend(id) {
  const s = sById(id); if (!s) return;
  const txt = (S.dtext[id] || '').trim(); if (!txt) return;
  const lane = S.dlane[id] || 'steering';
  push(id, 'user', txt);
  s.state = 'running'; s.activity = 'turn started';
  S.dtext[id] = '';
  toast(s.name, 'sent as ' + lane);
  setTimeout(() => { push(id, 'entry', 'on it — folding your note into the current turn.'); render(); }, 1500);
}

// ── keyboard ─────────────────────────────────────────────
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  const inInput = tag === 'input' || tag === 'textarea';
  if (e.metaKey && e.key === 'k') { e.preventDefault(); S.pal = !S.pal; render(); return; }
  if (e.key === 'Escape') { if (S.pal) { S.pal = false; } else if (S.drawer) { S.drawer = null; } render(); return; }
  if (S.pal) { if (e.key === 'Enter') { const q = S.palText.toLowerCase(); const items = palItems().filter(i => !q || i.label.toLowerCase().includes(q)); if (items[0]) { items[0].run(); S.pal = false; } } render(); return; }
  if (inInput) return;
  if (e.key === '/') { e.preventDefault(); const i = document.getElementById('s-search'); if (i) i.focus(); return; }
  if (e.key === 'l') { S.live = !S.live; render(); return; }
  if (e.key === 'd' && S.drawer) { S.drawer = null; render(); return; }
  const fi = '1234567'.indexOf(e.key);
  if (fi >= 0 && fi < CHIPDEFS.length) { S.filter = CHIPDEFS[fi][0]; render(); return; }
  if (e.key === 'j' || e.key === 'k') {
    const vis = visibleFeed(); if (!vis.length) return;
    let idx = vis.findIndex(x => x.id === S.selId);
    idx = e.key === 'j' ? Math.min(vis.length - 1, idx + 1) : Math.max(0, idx <= 0 ? 0 : idx - 1);
    S.selId = vis[idx].id; render();
    const f = document.getElementById('feed'); if (f) { const r = f.querySelector('.row.sel'); if (r) r.scrollIntoView({ block: 'nearest' }); }
    return;
  }
  if (e.key === 'Enter' && S.selId) { const ev2 = FEED.find(x => x.id === S.selId); if (ev2) { S.drawer = ev2.sid; render(); } }
});

// ── simulation ───────────────────────────────────────────
const SIMSCRIPT = [
  { at: 1.0,  fn: () => push('s1','tool','grep ✓ 0.4s — “acc-” → 3 components','0.4s') },
  { at: 2.4,  fn: () => { const r = FEED.find(x => x.live); if (r) { r.live = false; r.text = esc('bash ✓ 6.2s — cargo clippy -p tau-gui (2 warnings)'); r.rt = '6.2s'; r.born = Date.now(); } } },
  { at: 4.0,  fn: () => push('s7','think','thinking 2.8s') },
  { at: 5.5,  fn: () => push('s4','file','wrote src/timing.rs · +4 −2','+4 −2') },
  { at: 7.0,  fn: () => push('s1','entry','the reviewer is unblocked — pointing it at docs/notes/tokens.md') },
  { at: 8.5,  fn: () => { const s = sById('s4'); s.state = 'needs'; s.need = 'reviewer waiting for the input map draft'; s.needAgo = 'now'; push('s4','needs','needs you — reviewer waiting for the input map draft','now'); S.bell++; toast(s.name, 'sub-agent waiting on you', true); } },
  { at: 10.0, fn: () => push('s1','file','wrote app/svelte/lib/tokens.css · +31','+31') },
  { at: 11.5, fn: () => { const s = sById('s7'); s.state = 'idle'; s.activity = 'idle'; push('s7','cost','turn complete · +$0.03 · 9.8k tok','+$0.03'); } },
  { at: 13.0, fn: () => push('s1','sub','researcher → done · 4 tools surveyed · report in-thread') },
  { at: 14.5, fn: () => push('s2','entry','clean — both warnings pre-existing in the test harness') },
  { at: 16.0, fn: () => push('s1','think','thinking 3.1s') },
  { at: 17.5, fn: () => push('s4','tool','bash … running — cargo test -p bloody-chairs','live',true) },
  { at: 19.5, fn: () => { const r = [...FEED].reverse().find(x => x.live); if (r) { r.live = false; r.text = esc('bash ✓ 3.9s — 42 tests passed'); r.rt = '3.9s'; r.born = Date.now(); } } },
  { at: 21.0, fn: () => { const s = sById('s1'); s.state = 'idle'; s.activity = 'idle'; push('s1','cost','turn complete · +$0.06 · 47.2k tok','+$0.06'); } },
  { at: 22.5, fn: () => { const s = sById('s2'); s.state = 'idle'; s.activity = 'idle'; push('s2','cost','turn complete · +$0.04 · 88.1k tok','+$0.04'); } },
  { at: 24.0, fn: () => push('s4','entry','the remap pass is done — one collision left, flagging it for you') },
];
function simTick() {
  S.sim.t += 0.1;
  while (S.sim.i < SIMSCRIPT.length && SIMSCRIPT[S.sim.i].at <= S.sim.t) { SIMSCRIPT[S.sim.i].fn(); S.sim.i++; }
  const a = document.activeElement;
  const typing = a && (a.id === 's-search' || a.id === 'dcomp-in' || a.id === 'pal-in');
  if (!S.pal && !typing) render();
}

render();
setInterval(simTick, 100);
</script>
</body>
</html>

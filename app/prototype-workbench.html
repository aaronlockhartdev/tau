<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>τ workbench · session-first prototype</title>
<!--
  WORKBENCH — the session-first prototype. Home is ONE session, done exceptionally:
  transcript central, crew (sub-agents) first-class in the right dock AND nested live
  in the parent transcript, attention as a small compact sheet, fleet as a step-out
  list for the scale-up case. Sized for the real day: 1 session + 3–4 workers.
  Run: open app/prototype-workbench.html
-->
<style>
/* ============ tokens ============ */
:root {
  --bg: #0d0e11;
  --panel: #141519;
  --raised: #1a1c21;
  --line: #26282f;
  --line2: #30323b;
  --text: #e8eaed;
  --text2: #9ba0aa;
  --faint: #6b7078;
  --acc: #4c8dff;
  --ok: #3fb950;
  --warn: #d9a03f;
  --bad: #f0553f;
  --sans: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
  --mono: ui-monospace, 'SF Mono', Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body { font: 13px/1.55 var(--sans); color: var(--text); background: var(--bg); }
#app { display: grid; grid-template-rows: 48px 1fr 24px; height: 100vh; }
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
svg { display: block; }
::selection { background: rgba(76,141,255,.22); }
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-thumb { background: #2c2e36; border-radius: 5px; border: 2px solid var(--bg); }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
@keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes flashbg { 0% { background: rgba(76,141,255,.14); } 100% { background: transparent; } }
@keyframes rise { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }

/* ============ topbar ============ */
.topbar { display: flex; align-items: center; gap: 12px; padding: 0 12px; background: var(--bg); border-bottom: 1px solid var(--line); }
.wstabs { display: flex; align-items: stretch; gap: 1px; }
.wstab { position: relative; display: flex; align-items: center; gap: 7px; padding: 0 10px; font-size: 12.5px; font-weight: 500; color: var(--text2); border-radius: 8px 8px 0 0; }
.wstab:hover { background: rgba(255,255,255,.05); color: var(--text); }
.wstab.on { background: var(--panel); color: var(--text); font-weight: 600; }
.wstab.on::before, .wstab.on::after { content: ""; position: absolute; bottom: 0; width: 9px; height: 9px; }
.wstab.on::before { left: -9px; background: radial-gradient(circle at 100% 100%, var(--panel) 6.5px, transparent 7px); }
.wstab.on::after { right: -9px; background: radial-gradient(circle at 0 100%, var(--panel) 6.5px, transparent 7px); }
.wstab .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); animation: pulse 1.4s infinite; }
.wstab .dot.idle { background: var(--faint); animation: none; }
.wstab-add { display: grid; place-items: center; width: 26px; color: var(--faint); border-radius: 6px; }
.wstab-add:hover { background: rgba(255,255,255,.07); color: var(--text); }
.tbsp { flex: 1; }
.ibtn { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; color: var(--text2); position: relative; }
.ibtn:hover { background: rgba(255,255,255,.07); color: var(--text); }
.ibtn svg { width: 15px; height: 15px; }
.bcnt { position: absolute; top: 2px; right: 1px; min-width: 15px; height: 15px; padding: 0 4px; border-radius: 8px; background: var(--bad); color: #fff; font-size: 10px; font-weight: 700; display: grid; place-items: center; }
.kbtn { display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 10px; border: 1px solid var(--line2); border-radius: 8px; color: var(--text2); font-size: 12px; }
.kbtn:hover { border-color: #3a3d47; color: var(--text); }
.kbtn svg { width: 13px; height: 13px; }
.kbtn kbd { font: 10.5px var(--mono); color: var(--faint); }

/* ============ body grid ============ */
.body { display: grid; grid-template-columns: 256px minmax(0,1fr) 300px; min-height: 0; }
.pane { background: var(--panel); min-height: 0; display: flex; flex-direction: column; }
.pane.left { border-right: 1px solid var(--line); }
.dock { border-left: 1px solid var(--line); min-height: 0; }
.phead { display: flex; align-items: center; gap: 8px; padding: 9px 12px 7px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
.newghost { margin-left: auto; font-size: 11px; font-weight: 600; letter-spacing: 0; text-transform: none; color: var(--text2); padding: 2px 8px; border-radius: 6px; border: 1px solid var(--line2); }
.newghost:hover { color: var(--text); border-color: #3a3d47; }
.ptabs { display: flex; gap: 2px; padding: 0 12px 8px; border-bottom: 1px solid var(--line); }
.ptab { padding: 3px 9px; font-size: 11.5px; font-weight: 600; color: var(--faint); border-radius: 6px; }
.ptab:hover { color: var(--text2); }
.ptab.on { color: var(--text); background: var(--raised); }
.pscroll { flex: 1; overflow-y: auto; padding: 8px 8px 16px; }
.grp { font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); padding: 10px 8px 5px; }
.sessrow { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; }
.sessrow:hover { background: rgba(255,255,255,.04); }
.sessrow.active { background: var(--raised); border-color: var(--line2); }
.sessrow.needs { background: rgba(240,85,63,.08); }
.sessrow.needs:hover { background: rgba(240,85,63,.13); }
.sessrow.sel { outline: 1px solid var(--acc); outline-offset: -1px; }
.sessrow .sdot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.sdot.run { background: var(--ok); animation: pulse 1.4s infinite; }
.sdot.needs { background: var(--bad); }
.sdot.idle { background: #4a4d55; }
.sdot.done { background: #2e8b42; }
.sdot.fail { background: var(--bad); animation: none; }
.sessrow .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px; }
.sessrow .tag { font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--faint); }
.tag.run { color: var(--ok); } .tag.needs { color: var(--bad); } .tag.done { color: #4aa75e; }
.crewsub { margin: 2px 0 4px 21px; border-left: 1px solid var(--line); padding-left: 8px; }
.crewk { display: flex; align-items: center; gap: 7px; padding: 3px 6px; border-radius: 6px; cursor: pointer; font-size: 12px; color: var(--text2); }
.crewk:hover { background: rgba(255,255,255,.05); color: var(--text); }
.crewk.on { background: rgba(76,141,255,.12); color: var(--text); }
.crewk .sdot { width: 6px; height: 6px; }
.crewk .cktag { margin-left: auto; font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--faint); }

/* file tree (left, files tab) */
.frow { display: flex; align-items: center; gap: 7px; padding: 4px 8px; border-radius: 7px; cursor: pointer; font-size: 12.5px; color: var(--text2); }
.frow:hover { background: rgba(255,255,255,.04); color: var(--text); }
.frow.sel { background: var(--raised); color: var(--text); }
.frow .fp { color: var(--faint); font-size: 11px; width: 14px; text-align: center; }
.frow .fnm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fbadge { font: 10px var(--mono); font-weight: 700; width: 15px; text-align: center; border-radius: 4px; }
.fbadge.m { color: var(--warn); } .fbadge.a { color: var(--ok); } .fbadge.d { color: var(--bad); }
.fcount { font: 10.5px var(--mono); color: var(--faint); }

/* ============ center ============ */
.center { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg); }
.chead { display: flex; align-items: center; gap: 10px; padding: 10px 18px; border-bottom: 1px solid var(--line); background: var(--bg); }
.chead .cname { font-size: 14px; font-weight: 700; }
.chead .cws { font-size: 11px; color: var(--faint); padding: 1px 7px; border: 1px solid var(--line2); border-radius: 20px; }
.schip { font-size: 10.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 2px 8px; border-radius: 20px; }
.schip.run { color: var(--ok); background: rgba(63,185,80,.12); }
.schip.needs { color: var(--bad); background: rgba(240,85,63,.12); }
.schip.idle { color: var(--faint); background: rgba(255,255,255,.06); }
.schip.done { color: #4aa75e; background: rgba(63,185,80,.09); }
.fchip { display: flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; color: var(--acc); background: rgba(76,141,255,.12); border: 1px solid rgba(76,141,255,.3); padding: 2px 9px; border-radius: 20px; cursor: pointer; white-space: nowrap; }
.fchip svg { width: 10px; height: 10px; }
.fchip:hover { background: rgba(76,141,255,.2); }
.chead .cright { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--faint); }
.chead .cright .mono { font-family: var(--mono); }
.tscroll { flex: 1; overflow-y: auto; min-height: 0; }
.page { max-width: 860px; margin: 0 auto; padding: 18px 22px 8px; }
.earlier { text-align: center; font-size: 11.5px; color: var(--faint); padding: 8px 0 14px; cursor: pointer; }
.earlier:hover { color: var(--text2); }
.earlier::before { content: "── "; } .earlier::after { content: " ──"; }

/* entries */
.tuser { margin: 14px 0 10px; }
.tuser .role { font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); }
.tuser p { margin: 4px 0 0; font-size: 13.5px; line-height: 1.6; }
.tmsg { margin: 0 0 16px; position: relative; }
.tmsg .who { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
.tmsg .who b { font-size: 12px; }
.tmsg .who .ts { font-size: 11px; color: var(--faint); }
.think { border: 1px solid var(--line); border-radius: 8px; background: rgba(255,255,255,.02); margin: 6px 0; font-size: 12px; color: var(--text2); }
.think .th { display: flex; align-items: center; gap: 7px; padding: 6px 10px; cursor: pointer; }
.think .th .el { margin-left: auto; font: 10.5px var(--mono); color: var(--faint); }
.think .th .tw { font-size: 11px; }
.think .tb { display: none; padding: 0 12px 9px; color: var(--faint); font-size: 12px; }
.think.open .tb { display: block; }
.tools { margin: 8px 0; display: grid; gap: 4px; }
.tcard { display: grid; grid-template-columns: 18px 1fr auto; gap: 8px; align-items: start; border: 1px solid var(--line); border-radius: 8px; background: var(--raised); padding: 6px 10px; }
.tcard .ticon { font-size: 12px; color: var(--faint); margin-top: 2px; }
.tcard .tname { font: 12px var(--mono); font-weight: 600; }
.tcard .targs { font: 11.5px var(--mono); color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tcard .tstate { font: 10.5px var(--mono); color: var(--faint); white-space: nowrap; }
.tcard.running .tstate { color: var(--acc); }
.tcard.running .ticon { color: var(--acc); animation: spin 1.1s linear infinite; display: inline-block; }
.tcard.err .tname { color: var(--bad); }
.tcard .tout { display: none; grid-column: 1 / 4; margin-top: 6px; padding: 8px 10px; background: var(--bg); border-radius: 6px; font: 11.5px/1.6 var(--mono); color: var(--text2); white-space: pre-wrap; }
.tcard.open .tout { display: block; }
.tcard { cursor: pointer; }
.md { font-size: 13.5px; line-height: 1.65; margin: 8px 0; }
.md b { color: #fff; }
.caret { display: inline-block; width: 7px; height: 13px; background: var(--acc); vertical-align: -2px; animation: blink .9s steps(1) infinite; border-radius: 1px; }
.sysdiv { display: flex; align-items: center; gap: 8px; margin: 14px 0; padding: 5px 10px; border: 1px dashed var(--line2); border-radius: 8px; font-size: 11.5px; color: var(--faint); }
.sysdiv .sic { font-size: 12px; }
.sysdiv.compact { color: var(--warn); border-color: rgba(217,160,63,.35); }
.sysdiv.drain { color: var(--acc); border-color: rgba(76,141,255,.35); }

/* sub-agent block in transcript */
.subblock { margin: 10px 0 12px; border: 1px solid var(--line); border-left: 2px solid var(--faint); border-radius: 8px; background: rgba(255,255,255,.015); }
.subblock.running { border-left-color: var(--ok); }
.subblock.needs { border-left-color: var(--bad); background: rgba(240,85,63,.05); }
.subblock.done { border-left-color: #2e8b42; }
.subblock.failed { border-left-color: var(--bad); }
.sbhead { display: flex; align-items: center; gap: 8px; padding: 7px 10px; }
.sbhead .sbnm { font-size: 12.5px; font-weight: 700; }
.sbhead .sbt { font-size: 11.5px; color: var(--faint); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sbhead .sbmeta { font: 10.5px var(--mono); color: var(--faint); }
.fbtn { font-size: 10.5px; font-weight: 700; color: var(--acc); border: 1px solid rgba(76,141,255,.4); padding: 1px 9px; border-radius: 20px; }
.fbtn:hover { background: rgba(76,141,255,.15); }
.fbtn.on { background: var(--acc); color: #fff; border-color: var(--acc); }
.sbbody { padding: 2px 10px 9px; display: grid; gap: 3px; }
.sbbody .tcard { background: var(--panel); opacity: .88; }
.sbdotline { display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--faint); padding: 2px 0; }
.report { margin: 10px 0 14px; border: 1px solid rgba(63,185,80,.35); border-left: 3px solid var(--ok); border-radius: 8px; background: rgba(63,185,80,.06); padding: 9px 12px; cursor: pointer; }
.report:hover { background: rgba(63,185,80,.1); }
.report .rlab { display: flex; align-items: center; gap: 7px; font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--ok); }
.report .rlab svg { width: 12px; height: 12px; }
.report .rlab .rsub { font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--faint); }
.report .rtxt { margin-top: 5px; font-size: 12.5px; line-height: 1.55; color: var(--text); }
.report.ask { border-color: rgba(240,85,63,.4); border-left-color: var(--bad); background: rgba(240,85,63,.06); }
.report.ask .rlab { color: var(--bad); }
.tacts { position: absolute; top: 2px; right: 0; display: none; gap: 4px; }
.tmsg:hover .tacts, .report:hover .tacts { display: flex; }
.tact { font-size: 10.5px; font-weight: 600; color: var(--faint); border: 1px solid var(--line2); background: var(--panel); padding: 1px 8px; border-radius: 6px; }
.tact:hover { color: var(--text); border-color: #3a3d47; }
.dimmed { opacity: .38; }

/* new-activity pill */
.newpill { position: absolute; bottom: 148px; left: 50%; transform: translateX(-50%); background: var(--acc); color: #fff; font-size: 11.5px; font-weight: 700; padding: 4px 12px; border-radius: 20px; box-shadow: 0 4px 14px rgba(76,141,255,.4); cursor: pointer; display: flex; gap: 6px; align-items: center; }

/* ============ queue + composer ============ */
.queue { border-top: 1px solid var(--line); background: var(--panel); padding: 8px 18px 4px; }
.ql { font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); margin-bottom: 4px; }
.qsec { display: flex; align-items: baseline; gap: 8px; padding: 5px 0 2px; }
.qsec .qk { font-size: 10.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
.qsec.steer .qk { color: var(--acc); } .qsec.follow .qk { color: var(--warn); }
.qsec .qd { font-size: 10.5px; color: var(--faint); }
.qrow { display: flex; align-items: center; gap: 8px; padding: 3px 0 3px 12px; font-size: 12.5px; }
.qrow .qtxt { flex: 1; }
.qrow .qdel { color: var(--faint); font-size: 14px; line-height: 1; opacity: 0; }
.qrow:hover .qdel { opacity: 1; }
.qrow:hover .qdel:hover { color: var(--bad); }
.composer { margin: 10px 18px 12px; border: 1px solid var(--line2); border-radius: 12px; background: var(--raised); }
.composer:focus-within { border-color: rgba(76,141,255,.5); }
.composer textarea { display: block; width: 100%; background: none; border: none; outline: none; resize: none; color: var(--text); font: 13.5px/1.55 var(--sans); padding: 11px 14px 4px; }
.composer textarea::placeholder { color: var(--faint); }
.cf { display: flex; align-items: center; gap: 8px; padding: 6px 10px 9px; }
.lanes { display: flex; gap: 2px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
.lane { font-size: 11px; font-weight: 600; color: var(--faint); padding: 2px 9px; border-radius: 6px; white-space: nowrap; }
.lane:hover { color: var(--text2); }
.lane.on { background: var(--raised); color: var(--text); }
.lane.on.steer { color: var(--acc); } .lane.on.force { color: var(--bad); } .lane.on.follow { color: var(--warn); }
.cspacer { flex: 1; }
.modelchip { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text2); border: 1px solid var(--line2); padding: 3px 9px; border-radius: 8px; }
.modelchip:hover { color: var(--text); border-color: #3a3d47; }
.modelchip .mmono { font-family: var(--mono); }
.send { display: grid; place-items: center; width: 34px; height: 28px; border-radius: 8px; background: var(--acc); color: #fff; }
.send:hover { background: #5d99ff; }
.send svg { width: 14px; height: 14px; }
.send.stop { background: var(--bad); }
.send.stop:hover { background: #ff6a52; }

/* ============ right dock ============ */
.dhead { display: flex; align-items: center; gap: 2px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
.dtab { font-size: 11.5px; font-weight: 600; color: var(--faint); padding: 3px 10px; border-radius: 7px; }
.dtab:hover { color: var(--text2); }
.dtab.on { color: var(--text); background: var(--raised); }
.dtab .dn { font-size: 10px; color: var(--faint); margin-left: 5px; }
.dscroll { flex: 1; overflow-y: auto; padding: 10px 10px 16px; }
.dhint { font-size: 11px; color: var(--faint); padding: 2px 6px 8px; }

/* crew rows */
.crewrow { border: 1px solid var(--line); border-radius: 10px; background: var(--raised); margin-bottom: 8px; overflow: hidden; }
.crewrow.needs { border-color: rgba(240,85,63,.45); background: rgba(240,85,63,.07); }
.crewrow.failed { border-color: rgba(240,85,63,.45); }
.crewrow.flash { animation: flashbg 1.2s ease-out; }
.cr1 { display: flex; align-items: center; gap: 8px; padding: 8px 10px 4px; cursor: pointer; }
.cr1 .nm { flex: 1; min-width: 0; font-size: 12.5px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cr1 .stag { font-size: 9.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
.stag.run { color: var(--ok); } .stag.needs { color: var(--bad); } .stag.idle { color: var(--faint); } .stag.done { color: #4aa75e; } .stag.fail { color: var(--bad); }
.cr2 { padding: 0 10px 4px; font-size: 11.5px; color: var(--text2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cr3 { display: flex; align-items: center; gap: 10px; padding: 4px 10px 8px; font: 10.5px var(--mono); color: var(--faint); }
.cr3 .live { color: var(--acc); }
.cr3 .cx { margin-left: auto; font-size: 9px; color: var(--faint); transition: transform .15s; }
.crewrow.open .cx { transform: rotate(90deg); }
.crxm { display: none; border-top: 1px solid var(--line); padding: 7px 10px; font-size: 11.5px; color: var(--text2); }
.crewrow.open .crxm { display: block; }
.crxm div { padding: 1.5px 0; }
.crxm .t { color: var(--faint); font: 10px var(--mono); margin-right: 6px; }

/* task cards */
.taskcard { border: 1px solid var(--line); border-radius: 10px; background: var(--raised); padding: 9px 11px; margin-bottom: 9px; }
.taskcard .tt { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 700; }
.tstate { margin-left: auto; font-size: 9.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 1.5px 8px; border-radius: 20px; }
.tstate.inp { color: var(--acc); background: rgba(76,141,255,.13); }
.tstate.pend { color: var(--faint); background: rgba(255,255,255,.06); }
.tstate.done { color: #4aa75e; background: rgba(63,185,80,.1); }
.tstate.blocked { color: var(--bad); background: rgba(240,85,63,.12); }
.tprog { display: flex; align-items: center; gap: 8px; margin: 7px 0 4px; }
.tbar { flex: 1; height: 4px; border-radius: 2px; background: var(--bg); overflow: hidden; }
.tbar i { display: block; height: 100%; background: var(--acc); border-radius: 2px; }
.tprog .tpct { font: 10.5px var(--mono); color: var(--faint); }
.tsteps { margin: 6px 0; display: grid; gap: 3px; }
.step { display: flex; gap: 7px; font-size: 12px; color: var(--text2); }
.step .si { width: 14px; flex: none; text-align: center; font-size: 11px; }
.step.done { color: var(--faint); } .step.done .si { color: var(--ok); }
.step.cur { color: var(--text); } .step.cur .si { color: var(--acc); }
.tcrit { margin-top: 7px; padding-top: 7px; border-top: 1px solid var(--line); display: grid; gap: 3px; }

function sessionsHtml() {

  for (const k of wsKeys) {
    const list = SESS.filter(s => s.ws === k);
    html += `<div class="grp">${esc(WS[k].name)} · ${list.length}</div>`;

/* ============ center: transcript ============ */
function toolsHtml(items, keyBase) {

}

  const tool = u.state === 'running' ? `<div class="tcard running"><span class="ticon">◌</span><span><span class="tname">${esc(tn || '…')}</span> <span class="targs">${esc(ta || '')}</span></span><span class="tstate">running</span><div class="tout"></div></div>` : '';
  const parked = u.state === 'idle' && u.wait ? `<div class="sbdotline"><span class="sdot idle"></span>parked · waiting on ${u.wait}</div>` : '';

}
function reportHtml(u) {
  return `<div class="report" data-act="follow" data-id="${u.id}">
    <div class="rlab">${I.check} report · ${esc(u.name)} <span class="rsub">schema-validated · ${u.el}</span></div>
    <div class="rtxt">${esc(u.report || '')}</div>
  </div>`;
}
function entryHtml(e, idx) {
  switch (e.k) {
    case 'user': return `<div class="tuser"><span class="role">You${e.t ? ' · ' + e.t : ''}</span><p>${esc(e.text)}</p></div>`;
    case 'think': {
      const open = e.open || S.thinkAll;
      return `<div class="think ${open ? 'open' : ''}" data-act="think" data-id="${idx}">
        <div class="th">✦ reasoning<span class="tw">${open ? '▾' : '▸'}</span><span class="el">${esc(e.meta || '')}</span></div>
        <div class="tb">${esc(e.text)}</div></div>`; }
    case 'tools': return toolsHtml(e.items, 't' + idx);
    case 'md': {
      let text = e.text;
      if (e.stream && !S.streamDone) text = text.slice(0, Math.max(0, S.streamChars));
      return `<div class="md">${text.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`(.+?)`/g, '<code>$1</code>')}${e.stream && !S.streamDone ? '<span class="caret"></span>' : ''}</div>`;
    }
    case 'sys': {
      const icon = e.kind === 'compact' ? '⇢' : e.kind === 'drain' ? '≡' : e.kind === 'wake' ? '◈' : '⊕';
      return `<div class="sysdiv ${e.kind}"><span class="sic">${icon}</span>${esc(e.text)}</div>`; }
    case 'sub': { const u = uById(e.sub); return u ? subblockHtml(u) : ''; }
    case 'report': { const u = uById(e.sub); return u ? reportHtml(u) : ''; }
    case 'ask': return `<div class="report ask"><div class="rlab">✳ waiting on you</div><div class="rtxt">${esc(e.text)}</div></div>`;
    default: return '';
  }
}
function followDim(e) {
  if (!S.follow) return '';
  if (e.k === 'sub' && e.sub === S.follow) return '';
  if (e.k === 'report' && e.sub === S.follow) return '';
  return ' dimmed';
}
function centerHtml() {

function palItems() {

  for (const u of CREW) items.push({ g: 'follow crew', label: u.name + '  ·  ' + u.state, run: () => { S.session = 's1'; S.follow = u.id; S.dockTab = 'crew'; } });

function frailsHtml() {
  if (!S.focus) return '';
  const rbtn = (id, icon, title) => `<button class="${S.insp === id ? 'on' : ''}" data-act="insp" data-id="${id}" title="${title}">${icon}</button>`;
  let insp = '';
  if (S.insp) {
    const body = S.insp === 'crew' ? CREW.filter(u => u.sid === S.session).map(crewRowHtml).join('')
      : S.insp === 'tasks' ? TASKS.map(taskCardHtml).join('')
      : S.insp === 'files' ? filesListHtml()
      : sessionsHtml();
    insp = `<div class="insp ${S.insp === 'sessions' ? 'l' : 'r'}">
      <div class="sh"><span style="font-size:11.5px;font-weight:700;color:var(--text2);padding:2px 8px">${S.insp === 'sessions' ? 'Sessions' : S.insp[0].toUpperCase() + S.insp.slice(1)}</span>
      <button class="ibtn x" data-act="inspx">${I.x}</button></div>
      <div class="dscroll">${body}</div>
    </div>`;
  }
  return `<div class="frail l">${rbtn('sessions', I.search, 'sessions')}</div>
    <div class="frail r">${rbtn('crew', I.users, 'crew')}${rbtn('tasks', I.check, 'tasks')}${rbtn('files', I.file, 'files')}</div>${insp}`;
}

/* ============ shell + render ============ */
function shell() {
  return topbarHtml() +
    `<div class="body">${leftHtml()}${centerHtml()}${dockHtml()}</div>` +
    statusbarHtml() + frailsHtml() + attentionHtml() + fleetHtml() + palHtml() + toastsHtml();
}
function render() {
  const app = document.getElementById('app');
  app.className = (S.focus ? 'mode-focus' : '') + (S.peekFile ? ' has-peek' : '');
  const cs = document.getElementById('tscroll');
  const cdist = cs ? cs.scrollHeight - cs.scrollTop - cs.clientHeight : 0;
  const cstick = cdist < 80;
  const was = document.activeElement && document.activeElement.id ? document.activeElement.id : null;
  app.innerHTML = shell();
  const c2 = document.getElementById('tscroll');
  if (c2) c2.scrollTop = cstick ? c2.scrollHeight : Math.max(0, c2.scrollHeight - cdist - c2.clientHeight);
  if (was === 'comp-in') { const i = document.getElementById('comp-in'); if (i) { i.focus(); i.selectionStart = i.selectionEnd = i.value.length; } }
  const p = document.getElementById('pal-in');
  if (p) { p.focus(); if (was === 'pal-in') { p.selectionStart = p.selectionEnd = p.value.length; } else p.select(); }
  wire();
}
/* ============ queue + send ============ */
const QUEUE = { steer: ['Also check whether tokens.css is imported by the docs site'], follow: ['After the pass: run the contrast audit across dark + light'] };
function send() {
  const text = S.compT.trim(); if (!text) return;
  const s = sById(S.session);
  S.compT = '';
  const mine = S.userAdds[S.session] = S.userAdds[S.session] || [];
  if (s.state === 'running' && S.lane !== 'force') {
    (S.lane === 'steering' ? QUEUE.steer : QUEUE.follow).push(text);
    toast(s.name, 'queued · ' + (S.lane === 'steering' ? 'next tool boundary' : 'after work completes'));
  } else {
    if (S.lane === 'force' && s.state === 'running') mine.push({ k: 'sys', kind: 'drain', text: 'force · in-flight stream interrupted — partial kept, delivered at head of queue' });
    mine.push({ k: 'user', text, t: now() });
    if (s.state !== 'running') { s.state = 'running'; S.tps = 18; toast(s.name, 'turn started', 'ok'); }
  }
  render();
}

/* ============ wire ============ */
function wire() {
  const app = document.getElementById('app');
  app.onclick = e => {
    const palIt = e.target.closest('[data-pal]');
    if (palIt) {
      const items = palItems().filter(i => !S.palText || i.label.toLowerCase().includes(S.palText.toLowerCase()));
      const fn = items[+palIt.dataset.pal]; S.pal = false;
      if (fn) fn.run();
      render(); return;
    }
    const el = e.target.closest('[data-act]'); if (!el) return;
    const act = el.dataset.act, id = el.dataset.id;
    switch (act) {
      case 'wstab': S.ws = id; break;
      case 'newws': toast('new workspace', 'pick a folder…', 'ok'); break;
      case 'newsess': toast(WS[S.ws].name, 'new session ready', 'ok'); break;
      case 'attention': S.sheet = S.sheet === 'attention' ? null : 'attention'; break;
      case 'focus': S.focus = !S.focus; S.insp = null; break;
      case 'pal': S.pal = !S.pal; S.palText = ''; S.palSel = 0; break;
      case 'overlay': S.sheet = null; break;
      case 'overlay-pal': S.pal = false; break;
      case 'open': { const s = sById(id); S.ws = s.ws; S.session = s.id; S.follow = null; S.peekFile = null; break; }
      case 'follow': {
        if (S.session !== 's1') { S.ws = 'tau'; S.session = 's1'; }
        S.follow = S.follow === id ? null : id; S.dockTab = 'crew';
        toast(uById(id).name, S.follow ? 'following its stream' : 'unfollowed');
        break;
      }
      case 'unfollow': S.follow = null; break;
      case 'ptab': S.paneTab = id; break;
      case 'dtab': S.dockTab = id; break;
      case 'peek': S.peekFile = S.peekFile === id ? null : id; break;
      case 'peekx': S.peekFile = null; break;
      case 'commit': toast(sById(S.session).name, 'commit requested · queued as follow-up', 'ok'); break;
      case 'think': S.thinkAll = !S.thinkAll; break;
      case 'tcard': S.openTools[id] = !S.openTools[id]; break;
      case 'subx': S.openSubs[id] = !S.openSubs[id]; break;
      case 'lane': S.lane = id; break;
      case 'model': toast('providers', 'gpt-5.2 · claude-sonnet-4 · qwen3.7 — ⌘K to switch', 'ok'); break;
      case 'send': send(); return;
      case 'qdel': { const [sec, i] = id.split(':'); QUEUE[sec === 'steer' ? 'steer' : 'follow'].splice(+i, 1); break; }
      case 'jump': { const s = sById(id); S.ws = s.ws; S.session = s.id; S.sheet = null; S.follow = null; break; }
      case 'insp': S.insp = S.insp === id ? null : id; break;
      case 'inspx': S.insp = null; break;
      case 'pill': S._newPill = false; break;
    }
    render();
  };
  const ci = document.getElementById('comp-in');
  if (ci) ci.addEventListener('input', () => { S.compT = ci.value; });
  const pi = document.getElementById('pal-in');
  if (pi) pi.addEventListener('input', () => {
    S.palText = pi.value; S.palSel = 0;
    const q = S.palText.toLowerCase();
    const items = palItems().filter(i => !q || i.label.toLowerCase().includes(q));
    let html = '', lastG = '';
    items.forEach((i, n) => {
      if (i.g !== lastG) { html += `<div class="pal-g">${i.g}</div>`; lastG = i.g; }
      html += `<div class="pal-item ${n === 0 ? 'sel' : ''}" data-pal="${n}">${esc(i.label)}${i.k ? `<span class="pk">${i.k}</span>` : ''}</div>`;
    });
    const list = document.getElementById('pal-list'); if (list) list.innerHTML = html || '<div class="pal-empty">no matches</div>';
    const foot = document.getElementById('pal-foot'); if (foot) foot.textContent = items.length + ' commands · ⏎ run · esc close';
  });
}

/* ============ keyboard ============ */
const ALL_ORDER = () => { const out = []; for (const k of Object.keys(WS)) for (const s of SESS.filter(x => x.ws === k)) out.push(s); return out; };
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  const inInput = tag === 'input' || tag === 'textarea';
  if (e.metaKey && e.key === 'k') { e.preventDefault(); S.pal = !S.pal; S.palText = ''; S.palSel = 0; render(); return; }
  if (e.metaKey && e.key === '.') { e.preventDefault(); S.sheet = S.sheet === 'attention' ? null : 'attention'; render(); return; }
  if (e.metaKey && e.key === '\\') { e.preventDefault(); S.sheet = S.sheet === 'fleet' ? null : 'fleet'; render(); return; }
  if (e.metaKey && (e.key === '1' || e.key === '2' || e.key === '3')) { e.preventDefault(); S.dockTab = ['crew', 'tasks', 'files'][+e.key - 1]; render(); return; }
  if (e.key === 'Escape') {
    if (S.pal) S.pal = false;
    else if (S.sheet) S.sheet = null;
    else if (S.peekFile) S.peekFile = null;
    else if (S.insp) S.insp = null;
    else if (S.follow) S.follow = null;
    render(); return;
  }
  if (inInput) {
    if (e.target.id === 'comp-in' && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); return; }
    if (e.target.id === 'pal-in') {
      const items = palItems().filter(i => !S.palText || i.label.toLowerCase().includes(S.palText.toLowerCase()));
      if (e.key === 'ArrowDown') { e.preventDefault(); S.palSel = Math.min(items.length - 1, S.palSel + 1); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); S.palSel = Math.max(0, S.palSel - 1); }
      else if (e.key === 'Enter') { e.preventDefault(); S.pal = false; const fn = items[S.palSel]; if (fn) fn.run(); }
      render(); return;
    }
    return;
  }
  if (e.key === 'j') { S.sessSel = Math.min(ALL_ORDER().length - 1, S.sessSel + 1); render(); }
  else if (e.key === 'k') { S.sessSel = Math.max(0, S.sessSel - 1); render(); }
  else if (e.key === 'Enter') { const s = ALL_ORDER()[S.sessSel]; if (s) { S.ws = s.ws; S.session = s.id; render(); } }
  else if (e.key === 'r') { S.thinkAll = !S.thinkAll; render(); }
  else if (e.key === 'f') { S.focus = !S.focus; S.insp = null; render(); }
});

/* ============ simulation (the acceptance story: 1 session + 2 live child streams) ============ */
const SIMSCRIPT = [
  { at: 2,   fn: () => { const u = uById('u1'); u.latest = 'bash · rg -n "use:.*" docs/research'; u.tok += 400; markFlash('u1'); } },
  { at: 4,   fn: () => { const u = uById('u3'); u.latest = 'edit · svelte/Transcript.svelte'; u.tok += 600; markFlash('u3'); } },
  { at: 6.5, fn: () => { const u = uById('u1'); u.tok += 900; u.latest = 'read · pi/src/agent/theme.rs'; markFlash('u1'); } },
  { at: 8,   fn: () => { const u = uById('u2'); u.state = 'running'; u.wait = null; u.latest = 'read · design-tokens.css (extracted)'; u.tok += 500; markFlash('u2');
    const i = T.findIndex(x => x.k === 'sub' && x.sub === 'u2');
    if (i > -1) T.splice(i, 0, { k: 'sys', kind: 'wake', text: 'subagent woke · reviewer — parent resumed, review started' });
    toast('reviewer', 'woke · now running', 'ok'); } },
  { at: 10,  fn: () => { const q = QUEUE.steer.shift(); if (q) { const i = T.findIndex(x => x.id === 'stream'); if (i > -1) T.splice(i, 0, { k: 'sys', kind: 'drain', text: 'steering delivered · ' + q }); } } },
  { at: 12,  fn: () => { const u = uById('u1'); u.state = 'done'; u.latest = 'done · report delivered';
    u.report = 'The pi harness keeps its scale in one file (theme.rs) — 8 steps, hue fixed, lightness ramped. Mirroring that shape keeps the token file a single source of truth. Conductor and Zed split the scale across two files; both drift.';
    const i = T.findIndex(x => x.k === 'sub' && x.sub === 'u1');
    if (i > -1) T.splice(i + 1, 0, { k: 'report', sub: 'u1' });
    TASKS[0].pct = 62; markFlash('u1'); toast('researcher', 'report landed in-thread', 'ok'); } },
  { at: 15,  fn: () => { const s = sById('s5'); s.state = 'needs'; s.needs = 'Which binding should win at the layer-3 collision?'; toast('Input remap pass', 'asked a question · bloody-chairs', 'bad'); } },
  { at: 17,  fn: () => { S.om.obs = 9800; S.om.pending = 0;
    const i = T.findIndex(x => x.id === 'stream');
    if (i > -1) T.splice(i, 0, { k: 'sys', kind: 'compact', text: 'observer · 31.2k unobserved → 4.1k observations · gen 8' }); } },
  { at: 20,  fn: () => { const u = uById('u3'); u.state = 'done'; u.latest = 'done · report delivered';
    u.report = 'Extraction done: 7 components now read the accent scale from :root. Composer −31 inline lines, Transcript −12. Snapshot diff is clean; the contrast sweep is the remaining step.';
    const i = T.findIndex(x => x.k === 'sub' && x.sub === 'u3');
    if (i > -1) T.splice(i + 1, 0, { k: 'report', sub: 'u3' });
    TASKS[0].pct = 80; markFlash('u3'); toast('coder', 'extraction pass complete', 'ok'); } },
  { at: 24,  fn: () => { const s = sById('s1'); s.state = 'idle'; S.streamDone = true; S.tps = 0; S.om.busy = false; toast(s.name, 'turn complete · 26.4k tok · +$0.09', 'ok'); } },
];
function simTick() {
  const a = document.activeElement;
  const typing = a && (a.id === 'comp-in' || a.id === 'pal-in');
  if (S.pal || typing) return; // demo freezes while the user is driving
  const cs = document.getElementById('tscroll');
  const atBottom = cs ? cs.scrollHeight - cs.scrollTop - cs.clientHeight < 80 : true;
  S.sim.t += 0.1;
  let fired = false;
  while (S.sim.i < SIMSCRIPT.length && SIMSCRIPT[S.sim.i].at <= S.sim.t) { SIMSCRIPT[S.sim.i].fn(); S.sim.i++; fired = true; }
  const s = sById('s1');
  if (s.state === 'running' && !S.streamDone) {
    S.streamChars += 2; S.tps = 18; s.tok += 25;
    const stream = T.find(e => e.id === 'stream');
    if (stream && S.streamChars >= stream.text.length) S.streamDone = true;
  }
  for (const u of CREW) if (u.state === 'running') u.tok += 8;
  if (fired && !atBottom) S._newPill = true;
  if (atBottom) S._newPill = false;
  render();
}
render();
setInterval(simTick, 100);
</script>

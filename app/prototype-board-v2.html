<title>tau · board v2 prototype</title>
<!--
  BOARD V2 — the board is a first-class center view (Board | Chat | Changes),
  and attention is a computed, global state (bell + badges + toasts).
  Research: docs/research/prototype-board-v2.md (critique of v1 + the board
  category: Conductor, Vibe Kanban, Crystal/Nimbalyst, Omnara/Happy;
  attention layer: Codex activity, Devin notifications, Factory sounds;
  ergonomics baseline: pi's TUI keymap).

  New in v2 over prototype-board.html:
  - Board view: fleet columns (Running / Needs you / Idle / Done), summary
    strip with tokens + cost, card → chat.
  - Attention: global bell with count, needs-you sheet with jump, reason
    chips, toasts, a simulated cross-workspace needs-you event.
  - Transcript: turn timeline strip, expandable tool rows (args + output),
    collapsible reasoning, hover actions (copy / branch / fork), compaction
    recall cards, spawn cards with open-session, per-turn cost, branch chip.
  - Queue: 3 sections (reports / steering / follow-up), delete, restore.
  - Composer: force lane reads red + explains itself, stop morph, / and @
    autocomplete, model menu, activity chip + OM meter.
  - Left pane Sessions | Files per spec §9: nested sub-agent groups,
    lifecycle tags, search, archive folder; git-badged file tree with
    changed-file → diff jump.
  - Right pane Tasks | Sub-agents: filters, full task sections (steps +
    expected output, criteria, evidence, blockers, resume contract, worker
    click-through, cost); sub-agent tree with context-mode chips and
    open / stop / message actions.
  - Changes: stat bar, unified/split, per-file list, "ask the agent" commit
    row (v0-honest: the agent commits), file-tree linkage.
  - Focus mode: pill rails + NON-MODAL inspectors + ⌥↑/↓ session hopping.
  - Palette: ~20 commands, session jumps, keymap page (pi-parity bindings).
  - Lualine status bar: state · ws · session · lane · queue | om + pending ·
    render window · streams · model · tps.
  - A live scripted simulation (streams, turn end, queue drain, sub-agent
    completion, cross-workspace attention).

  Run:  open app/prototype-board-v2.html
-->
<style>
/* ============ tokens ============ */
:root {
  --bg: #0d0e11;
  --panel: #141519;
  --raised: #1a1c21;
  --line: #26282f;
  --text: #e8eaed;
  --text2: #9ba0aa;
  --faint: #6b7078;
  --acc: #4c8dff;
  --ok: #3fb950;
  --warn: #d9a03f;
  --bad: #f0553f;
  --sans: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
  --mono: ui-monospace, 'SF Mono', Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body { font: 13px/1.55 var(--sans); color: var(--text); background: var(--bg); }
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
svg { display: block; }
#app svg { width: 14px; height: 14px; flex: none; }
::selection { background: rgba(76, 141, 255, .22); }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 1px; border-radius: 4px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes toastin { from { transform: translateX(14px); opacity: 0; } }
@keyframes slidein { from { transform: translateX(16px); opacity: 0; } }

/* ============ topbar ============ */
.shell { display: grid; grid-template-rows: 48px 1fr 24px; height: 100%; }
.topbar { display: flex; align-items: center; gap: 10px; padding: 0 12px; background: var(--bg); }
.wstabs { align-self: stretch; display: flex; align-items: stretch; gap: 1px; }
.wstab { position: relative; display: flex; align-items: center; gap: 7px; padding: 0 8px 0 10px; font-size: 12.5px; font-weight: 500; color: var(--text2); border-radius: 8px 8px 0 0; }
.wstab:hover { background: rgba(255, 255, 255, .05); color: var(--text); }
.wstab.on { background: var(--panel); color: var(--text); font-weight: 600; }
.wstab.on::before, .wstab.on::after { content: ""; position: absolute; bottom: 0; width: 9px; height: 9px; }
.wstab.on::before { left: -9px; background: radial-gradient(circle at 100% 100%, var(--panel) 6.5px, transparent 7px); }
.wstab.on::after { right: -9px; background: radial-gradient(circle at 0 100%, var(--panel) 6.5px, transparent 7px); }
.wstab .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); flex: none; animation: pulse 1.4s infinite; }
.wstab .dot.off { background: var(--faint); animation: none; }
.wstab .tx { display: grid; place-items: center; width: 16px; height: 16px; margin-left: 2px; border-radius: 4px; color: var(--faint); opacity: 0; }
.wstab:hover .tx, .wstab.on .tx { opacity: 1; }
.wstab .tx:hover { background: rgba(255, 255, 255, .1); color: var(--text); }
#app .wstab .tx svg { width: 10px; height: 10px; }
.wstab-add { align-self: center; width: 26px; height: 26px; margin-left: 4px; display: grid; place-items: center; border-radius: 6px; color: var(--faint); }
.wstab-add:hover { background: rgba(255, 255, 255, .06); color: var(--text2); }
.tbsession { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 300px; }
.tbsession .sdot { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); flex: none; }
.tbsession .sdot.run { background: var(--acc); animation: pulse 1.4s infinite; }
.tbsession .sdot.needs { background: var(--bad); animation: pulse 1.4s infinite; }
.topbar .spacer { flex: 1; }
.kbtn { display: flex; align-items: center; gap: 7px; padding: 5px 10px; border: 1px solid var(--line); border-radius: 6px; color: var(--faint); font-size: 12px; }
.kbtn:hover { color: var(--text2); }
.kbtn kbd { font: 10.5px var(--mono); color: var(--faint); }
.ibtn { position: relative; width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; color: var(--faint); }
.ibtn:hover { color: var(--text2); background: var(--raised); }
.ibtn .bcount { position: absolute; top: -3px; right: -3px; min-width: 14px; height: 14px; border-radius: 7px; background: var(--bad); color: #fff; font: 9px/14px var(--mono); text-align: center; padding: 0 3px; }
.ibtn.labeled { width: auto; padding: 0 9px; gap: 6px; font-size: 11.5px; font-weight: 600; }
.ibtn.labeled.on { background: var(--raised); color: var(--text); }

/* ============ body grid ============ */
.body { display: grid; grid-template-columns: 1fr; min-height: 0; }
.swatch { min-width: 0; min-height: 0; position: relative; }
.compact { display: grid; grid-template-columns: 272px 1fr 296px; height: 100%; min-width: 0; }
.pane { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--panel); }
.pane.left { border-right: 1px solid var(--line); }
.pane.right { border-left: 1px solid var(--line); }
.phead { padding: 10px 12px 8px; border-bottom: 1px solid var(--line); }
.phead.row { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 600; color: var(--text2); }
.newghost { margin-left: auto; display: flex; align-items: center; gap: 5px; padding: 2.5px 8px; border: 1px solid var(--line); border-radius: 4px; font-size: 11px; font-weight: 500; color: var(--faint); }
.newghost:hover { color: var(--text2); }
#app .newghost svg { width: 10px; height: 10px; }
.group { padding: 10px 12px 4px; font-size: 10px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); display: flex; align-items: center; gap: 6px; cursor: pointer; }
.group .gn { font: 10px var(--mono); }
.ptabs { display: flex; gap: 16px; padding: 0 12px; border-bottom: 1px solid var(--line); }
.ptab { padding: 10px 0 8px; font-size: 11px; font-weight: 600; color: var(--faint); position: relative; }
.ptab.on { color: var(--text); }
.ptab.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; background: var(--line); }
.ptab .pn { font: 10px var(--mono); color: var(--faint); margin-left: 4px; }
.psec { flex: 1; overflow-y: auto; padding: 8px; }
.search { display: flex; align-items: center; gap: 7px; margin: 0 4px 8px; padding: 5px 9px; border-radius: 6px; background: var(--bg); border: 1px solid var(--line); color: var(--faint); font-size: 12px; }
.search input { flex: 1; background: none; border: none; outline: none; color: var(--text); font: 12px var(--sans); min-width: 0; }
#app .search svg { width: 12px; }
.chips { display: flex; gap: 5px; margin: 0 4px 8px; }
.chip { font-size: 10.5px; font-weight: 600; color: var(--faint); border: 1px solid var(--line); border-radius: 4px; padding: 2px 8px; }
.chip.on { color: var(--text); background: var(--raised); border-color: #33363e; }

/* ============ session list ============ */
.srow { padding: 6px 10px 7px; border-radius: 6px; cursor: pointer; }
.srow:hover { background: var(--raised); }
.srow.on, .srow.on:hover { background: rgba(76, 141, 255, .13); }
.srow .sr-t { display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 500; color: var(--text2); }
.srow.on .sr-t { color: var(--text); font-weight: 600; }
.srow .sr-t .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sdot { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); flex: none; }
.sdot.run { background: var(--acc); animation: pulse 1.4s infinite; }
.sdot.needs { background: var(--bad); animation: pulse 1.4s infinite; }
.sdot.done { background: var(--ok); }
.sdot.fail { background: var(--bad); }
.tag { font: 9.5px var(--mono); font-weight: 600; padding: 0 5px; border-radius: 3px; border: 1px solid var(--line); color: var(--faint); flex: none; }
.tag.run { color: var(--acc); border-color: rgba(76,141,255,.4); }
.tag.idle { color: var(--warn); border-color: rgba(217,160,63,.4); }
.tag.done { color: var(--ok); border-color: rgba(63,185,80,.4); }
.tag.fail { color: var(--bad); border-color: rgba(240,85,63,.4); }
.srow .sr-m { font: 10.5px var(--mono); color: var(--faint); padding-left: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.srow.child { margin-left: 14px; border-left: 1px solid var(--line); }
.gkids { margin-left: 7px; border-left: 1px solid var(--line); }
.garrow { font-size: 9px; color: var(--faint); width: 10px; flex: none; }

/* ============ file tree ============ */
.frow { display: flex; align-items: center; gap: 6px; padding: 4px 8px; border-radius: 5px; font-size: 12.5px; color: var(--text2); cursor: pointer; }
.frow:hover { background: var(--raised); }
.frow.on { background: rgba(76, 141, 255, .13); color: var(--text); }
.frow .fname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.frow .ic { width: 13px; color: var(--faint); }
.gbadge { font: 9.5px var(--mono); font-weight: 700; flex: none; }
.gbadge.M { color: var(--warn); }
.gbadge.A { color: var(--ok); }
.gstat { font: 10px var(--mono); color: var(--faint); flex: none; }
.gstat .da { color: var(--ok); }
.gstat .dd { color: var(--bad); }

/* ============ center view switch ============ */
.chead { flex: none; display: flex; align-items: center; gap: 10px; padding: 8px 44px 0; }
.cswitch { display: flex; gap: 2px; padding: 2px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
.cbtn { display: flex; align-items: center; gap: 5px; padding: 3px 11px; border-radius: 4px; font-size: 11px; font-weight: 600; color: var(--faint); }
.cbtn:hover { color: var(--text2); }
.cbtn.on { background: var(--raised); color: var(--text); }
.ccount { font: 10px var(--mono); color: var(--faint); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
.cbtn.on .ccount { color: var(--text2); }
.branchchip { display: flex; align-items: center; gap: 5px; font: 10.5px var(--mono); color: var(--faint); border: 1px solid var(--line); border-radius: 4px; padding: 2px 8px; cursor: pointer; }
.branchchip:hover { color: var(--text2); }

/* ============ board view ============ */
.board { height: 100%; overflow-y: auto; }
.bsum { display: flex; align-items: center; gap: 14px; padding: 9px 16px; border-bottom: 1px solid var(--line); background: var(--panel); font: 11px var(--mono); color: var(--text2); position: sticky; top: 0; }
.bsum .bsumdot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); animation: pulse 1.4s infinite; }

.bsum .warn { color: var(--bad); }
.bsum .spacer { flex: 1; }
.bcols { display: grid; grid-template-columns: repeat(4, minmax(170px, 1fr)); gap: 10px; padding: 12px 14px 20px; align-items: start; }
.bcol { min-width: 0; }
.bcol-h { display: flex; align-items: center; gap: 6px; font-size: 10px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); padding: 2px 4px 8px; }
.bcol-h .cdot { width: 6px; height: 6px; border-radius: 50%; }
.bcol-h .n { font: 10px var(--mono); }
.bcard { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 9px 10px 8px; margin-bottom: 8px; cursor: pointer; }
.bcard:hover { border-color: #343841; background: var(--raised); }

.bcard .bt { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--text); }
.bcard .bt .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bcard .ba { font: 11px var(--mono); color: var(--text2); margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bcard .bm { font: 10.5px var(--mono); color: var(--faint); margin-top: 6px; display: flex; gap: 8px; flex-wrap: wrap; }
.why { font-size: 10px; font-weight: 600; color: var(--bad); background: rgba(240,85,63,.12); border: 1px solid rgba(240,85,63,.3); padding: 1px 6px; border-radius: 4px; margin-top: 7px; display: inline-block; }
.bcard .wslab { font: 9.5px var(--mono); color: var(--faint); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }

/* ============ transcript ============ */
.center { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--bg); }
.tscroll { flex: 1; overflow-y: auto; }
.page { max-width: 740px; margin: 0 auto; padding: 18px 44px 16px; }
.tl { position: sticky; top: 0; z-index: 5; display: flex; gap: 6px; align-items: center; padding: 2px 44px 10px; flex-wrap: wrap; background: var(--bg); }
.tlc { display: flex; align-items: center; gap: 5px; font: 10.5px var(--mono); color: var(--text2); background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 2.5px 8px; cursor: pointer; }
.tlc:hover { border-color: #343841; }
.tlc .td { width: 5px; height: 5px; border-radius: 50%; background: var(--ok); }
.tlc.run { border-color: rgba(76,141,255,.5); color: var(--acc); }
.tlc.run .td { background: var(--acc); animation: pulse 1.4s infinite; }
.tlc .el { color: var(--faint); }
.tl .tlmore { font: 10.5px var(--mono); color: var(--faint); }
.tuser { margin: 0 0 22px; display: flex; flex-direction: column; align-items: flex-end; position: relative; }
.tuser .role { font-size: 11px; color: var(--faint); margin-bottom: 4px; display: flex; gap: 6px; align-items: center; }
.tuser p { display: block; max-width: 64%; margin: 0; font-size: 13px; line-height: 1.6; color: var(--text); }
.lanechip { font: 9.5px var(--mono); font-weight: 700; padding: 0 5px; border-radius: 3px; border: 1px solid var(--line); color: var(--faint); }
.lanechip.force { color: var(--bad); border-color: rgba(240,85,63,.4); }
.lanechip.steering { color: var(--acc); border-color: rgba(76,141,255,.4); }
.lanechip.follow_up { color: var(--warn); border-color: rgba(217,160,63,.4); }
.tmsg { margin-bottom: 10px; position: relative; }
.acts { position: absolute; top: -6px; right: 0; display: none; gap: 2px; background: var(--raised); border: 1px solid var(--line); border-radius: 5px; padding: 2px; box-shadow: 0 4px 12px rgba(0,0,0,.35); }
.tmsg:hover .acts, .tuser:hover .acts { display: flex; }
.act { width: 22px; height: 20px; display: grid; place-items: center; border-radius: 4px; color: var(--faint); font-size: 10px; }
.act:hover { background: rgba(255,255,255,.08); color: var(--text); }
#app .act svg { width: 11px; height: 11px; }
.tmsg .who { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
.tmsg .who b { font-size: 12.5px; font-weight: 600; color: var(--text); }
.tmsg .who .ts { font-size: 11px; color: var(--faint); }
.tmsg .who .cost { font: 10.5px var(--mono); color: var(--faint); }
.think { display: flex; align-items: baseline; gap: 8px; margin: 0 0 12px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); font: italic 12px/1.55 var(--sans); color: var(--text2); cursor: pointer; }
.think .tk { font-style: normal; font-size: 10px; font-weight: 700; color: var(--faint); letter-spacing: .05em; }
.think .el { margin-left: auto; font: 10.5px var(--mono); font-style: normal; color: var(--faint); flex: none; }
.think.open .ttext { display: block; }
.think .ttext { display: none; font-style: normal; color: var(--text2); margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--line); }
.md { font-size: 13.5px; line-height: 1.65; color: #d6d9de; }
.md h3 { margin: 18px 0 8px; font-size: 15px; font-weight: 600; color: var(--text); }
.md p { margin: 10px 0; }
.md ul { margin: 10px 0; padding-left: 22px; }

.md code { font: 12px var(--mono); color: var(--text); background: var(--raised); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; }

.caret { display: inline-block; width: 2px; height: 12px; margin-left: 3px; background: var(--acc); vertical-align: -1px; animation: blink 1s steps(1) infinite; }

/* tool groups */
.tools { margin: 12px 0; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); overflow: hidden; }
.tools .th { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-bottom: 1px solid var(--line); font-size: 11px; font-weight: 600; color: var(--text2); cursor: pointer; }
.tools .th .ic { width: 13px; color: var(--faint); }

.trow { display: flex; align-items: center; gap: 9px; padding: 5px 12px; font: 12px var(--mono); color: var(--text2); cursor: pointer; border-left: 2px solid transparent; }

.spin { width: 10px; height: 10px; flex: none; border: 1.5px solid var(--line); border-top-color: var(--faint); border-radius: 50%; animation: spin .8s linear infinite; }

/* system dividers + recall + spawn cards */
.sysdiv { display: flex; align-items: center; gap: 10px; margin: 18px 0; font-size: 11px; color: var(--faint); cursor: default; }
.sysdiv::before, .sysdiv::after { content: ""; height: 1px; background: var(--line); flex: 1; }

.sysdiv.click { cursor: pointer; }
.sysdiv.click:hover { color: var(--text2); }
.recall { margin: -8px 0 18px; padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-top: none; border-radius: 0 0 6px 6px; font: 11.5px/1.6 var(--mono); color: var(--text2); }

.qrow { display: flex; align-items: center; gap: 9px; padding: 3px 44px; font-size: 12.5px; color: var(--text2); }

.composer .aci { display: flex; align-items: center; gap: 8px; padding: 6px 10px; font-size: 12.5px; cursor: pointer; }

.modelmenu { position: absolute; bottom: 100%; right: 0; margin-bottom: 4px; width: 260px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 8px 24px rgba(0,0,0,.45); z-index: 10; overflow: hidden; }

/* ============ right pane: tasks ============ */
.taskcard { margin: 0 0 10px; padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }

.taskcard .tt .st i { width: 5px; height: 5px; border-radius: 50%; }

.taskcard .tt .st.pend { color: var(--faint); }
.taskcard .tt .st.pend i { background: var(--faint); }
.pbar { height: 3px; border-radius: 2px; background: var(--line); margin: 9px 0; overflow: hidden; }

.step { display: flex; align-items: baseline; gap: 8px; padding: 2px 0; font-size: 12px; color: var(--text2); }

.step.active .mk { color: var(--acc); }
.crits { display: flex; flex-wrap: wrap; gap: 5px; }
.crit { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text2); border: 1px solid var(--line); border-radius: 4px; padding: 2px 7px; }
.crit .c { font-size: 10px; }
.crit.sat { color: var(--text); }
.crit.sat .c { color: var(--ok); }
.crit.fail { color: var(--bad); }
.crit.fail .c { color: var(--bad); }
.crit.pend .c { color: var(--faint); }
.ev { margin-top: 6px; padding: 6px 9px; background: var(--raised); border-radius: 4px; font: 11px/1.5 var(--mono); color: var(--text2); }
.ev .ok { color: var(--ok); }
.ev.bad { color: var(--bad); }
.rc { margin-top: 8px; padding: 8px 10px; background: var(--bg); border: 1px dashed var(--line); border-radius: 5px; font: 11px/1.55 var(--mono); color: var(--text2); }
.rc .rcl { color: var(--faint); }
.workerrow { display: flex; align-items: center; gap: 7px; margin-top: 8px; font: 11px var(--mono); color: var(--text2); }

.workerrow .wo:hover { text-decoration: underline; }
.taskcard .tc-actions { margin-top: 9px; display: flex; gap: 6px; }
.tmini { font-size: 10.5px; font-weight: 600; color: var(--faint); border: 1px solid var(--line); border-radius: 4px; padding: 2px 8px; }
.tmini:hover { color: var(--text2); border-color: #343841; }
.tmini.danger:hover { color: var(--bad); border-color: rgba(240,85,63,.4); }

/* sub-agents */
.subrow { display: flex; gap: 9px; padding: 8px; border-radius: 6px; cursor: pointer; align-items: flex-start; }
.subrow:hover { background: var(--raised); }
.subrow .sd { margin-top: 5px; }
.subrow .sbody { flex: 1; min-width: 0; }
.subrow .sn { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--text); }
.subrow .sn .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ctx { font: 9.5px var(--mono); font-weight: 700; padding: 0 5px; border-radius: 3px; border: 1px solid var(--line); color: var(--faint); flex: none; }

.subrow .sb { font-size: 11.5px; color: var(--faint); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.subrow .sm { font: 10.5px var(--mono); color: var(--faint); margin-top: 3px; display: flex; gap: 8px; }

.seclabel { font-size: 11px; font-weight: 600; color: var(--text2); padding: 10px 8px 4px; display: flex; align-items: center; gap: 6px; }
.seclabel .sn2 { font: 10px var(--mono); color: var(--faint); }

/* ============ changes / diff ============ */
.review { display: grid; grid-template-columns: 240px minmax(0, 1fr); height: 100%; }
.rlist { border-right: 1px solid var(--line); overflow-y: auto; padding: 8px; min-width: 0; }
.dsum { padding: 6px 8px 10px; border-bottom: 1px solid var(--line); margin-bottom: 8px; font: 11px var(--mono); color: var(--faint); display: flex; align-items: center; gap: 8px; }
.dsum .spacer { flex: 1; }
.rfile { display: flex; flex-direction: column; gap: 2px; padding: 7px 9px; border-radius: 6px; cursor: pointer; }
.rfile:hover { background: var(--raised); }
.rfile.on { background: rgba(76, 141, 255, .13); }
.rfile .rf { font: 12px var(--mono); color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rfile .rm { font: 10.5px var(--mono); color: var(--faint); }
.rdiff { overflow-y: auto; padding: 12px 18px; min-width: 0; }
.dft { display: flex; align-items: center; gap: 7px; padding: 4px 4px 6px; font: 12px var(--mono); color: var(--text2); border-bottom: 1px solid var(--line); margin-bottom: 4px; }
.dft .da, .da { color: var(--ok); }
.dft .dd, .dd { color: var(--bad); }
.dl { display: flex; gap: 8px; padding: 1px 4px; font: 11.5px/1.55 var(--mono); white-space: pre; color: var(--faint); }

.dl.add { background: rgba(63, 185, 80, .1); color: #a5d6a9; }

.dl.del { background: rgba(240, 85, 63, .1); color: #e5a091; }
.dl.del .dm { color: var(--bad); }

/* ============ focus mode ============ */
.focuscol { display: none; height: 100%; }
.focus .compact { display: none; }
.focus .focuscol { display: flex; flex-direction: column; }
.focuscol .page { max-width: 760px; padding: 24px 48px 16px; }
.lrail, .rrail { position: fixed; top: 48px; bottom: 24px; width: 48px; display: none; flex-direction: column; align-items: center; gap: 6px; padding: 10px 0; background: var(--panel); z-index: 5; }
.lrail { left: 0; border-right: 1px solid var(--line); }
.rrail { right: 0; border-left: 1px solid var(--line); }
.focus .lrail, .focus .rrail { display: flex; }
.focus .swatch { margin: 0 48px; }
.rbtn { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 6px; color: var(--faint); }
.rbtn:hover { background: var(--raised); color: var(--text2); }
.rbtn.on { background: var(--raised); color: var(--text); }
.focus .sheet { right: 56px; }
.focus .lsheet { left: 56px; }

/* ============ sheets and modals (non-modal in focus) ============ */
.scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, .5); opacity: 0; pointer-events: none; transition: opacity .18s; z-index: 20; }
.scrim.open { opacity: 1; pointer-events: auto; }
.sheet, .lsheet { position: fixed; top: 48px; bottom: 12px; width: 320px; z-index: 30; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; display: flex; flex-direction: column; overflow: hidden; transform: translateX(16px); opacity: 0; pointer-events: none; transition: transform .18s cubic-bezier(.32, .72, .28, 1), opacity .18s; box-shadow: 0 12px 40px rgba(0,0,0,.5); }
.sheet { right: 12px; }
.lsheet { left: 12px; transform: translateX(-16px); }
.sheet.open, .lsheet.open { transform: translateX(0); opacity: 1; pointer-events: auto; }
.sheet .sh, .lsheet .sh { display: flex; align-items: center; gap: 10px; padding: 12px 14px 10px; border-bottom: 1px solid var(--line); }
.sheet .sh b, .lsheet .sh b { font-size: 13px; font-weight: 600; color: var(--text); }
.sheet .sh .x, .lsheet .sh .x { margin-left: auto; color: var(--faint); padding: 4px; border-radius: 4px; }
.sheet .sh .x:hover, .lsheet .sh .x:hover { background: var(--raised); color: var(--text); }
.sheet .stabs, .lsheet .stabs { display: flex; gap: 14px; padding: 0 14px; border-bottom: 1px solid var(--line); }
.sheet .stab, .lsheet .stab { padding: 9px 0 7px; font-size: 11px; font-weight: 600; color: var(--faint); position: relative; cursor: pointer; }
.sheet .stab.on, .lsheet .stab.on { color: var(--text); }

.sheet .ssec, .lsheet .lbody { flex: 1; overflow-y: auto; padding: 8px 8px 14px; }
.needrow { display: flex; flex-direction: column; gap: 3px; padding: 9px 10px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; }
.needrow:hover { background: var(--raised); }
.needrow .nr-t { display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; color: var(--text); }
.needrow .nr-ws { font: 10px var(--mono); color: var(--faint); }
.needrow .nr-why { font-size: 11.5px; color: var(--bad); }

.cmodal { position: fixed; left: 50%; top: 50%; z-index: 30; width: 400px; max-height: 70vh; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; display: flex; flex-direction: column; overflow: hidden; transform: translate(-50%, -50%) scale(.97); opacity: 0; pointer-events: none; transition: transform .18s cubic-bezier(.32, .72, .28, 1), opacity .18s; }
.cmodal.open { transform: translate(-50%, -50%) scale(1); opacity: 1; pointer-events: auto; }
.cmodal .sh { display: flex; align-items: center; gap: 10px; padding: 12px 14px 10px; border-bottom: 1px solid var(--line); }
.cmodal .sh b { font-size: 13px; font-weight: 600; }
.cmodal .sh .x { margin-left: auto; color: var(--faint); padding: 4px; border-radius: 4px; }
.cmodal .sh .x:hover { background: var(--raised); color: var(--text); }
.cmodal .lbody { flex: 1; overflow-y: auto; padding: 10px 12px 14px; }
.cmodal .h { font-size: 11px; font-weight: 600; color: var(--faint); padding: 10px 4px 5px; }
.setrow { display: flex; align-items: center; gap: 9px; padding: 7px 6px; font-size: 12.5px; color: var(--text2); }

.toggle.on { background: rgba(76,141,255,.4); }
.toggle.on::after { left: 14px; background: var(--acc); }

.pal { position: fixed; left: 50%; top: 16%; transform: translate(-50%, -8px); width: 580px; max-width: calc(100vw - 32px); z-index: 40; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; opacity: 0; pointer-events: none; transition: opacity .15s, transform .15s; box-shadow: 0 16px 48px rgba(0,0,0,.5); }

.pal-in { width: 100%; padding: 13px 16px; background: none; border: none; outline: none; color: var(--text); font: 13.5px var(--sans); border-bottom: 1px solid var(--line); }

.pal-item { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 6px; font-size: 13px; color: var(--text2); cursor: pointer; }
.pal-item.on { background: rgba(76, 141, 255, .13); color: var(--text); }
.pal-item kbd { margin-left: auto; font: 10.5px var(--mono); color: var(--faint); }
.pal-empty { padding: 18px 12px; font-size: 12.5px; color: var(--faint); }
.pal-foot { padding: 7px 12px; border-top: 1px solid var(--line); font: 10.5px var(--mono); color: var(--faint); }
.kmap { padding: 4px 12px 12px; }
.kmap .kr { display: flex; align-items: center; gap: 10px; padding: 5px 8px; font-size: 12.5px; color: var(--text2); }
.kmap .kr kbd { font: 11px var(--mono); color: var(--text); background: var(--raised); border: 1px solid var(--line); border-radius: 4px; padding: 2px 7px; min-width: 84px; text-align: center; }
.kmap .kr .kd { color: var(--faint); font-size: 11.5px; }

/* ============ statusbar ============ */
.statusbar { display: flex; align-items: center; gap: 14px; padding: 0 14px; border-top: 1px solid var(--line); background: var(--panel); font: 11px var(--mono); color: var(--faint); overflow: hidden; white-space: nowrap; }
.statusbar .sdot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); animation: pulse 1.4s infinite; }
.statusbar .sdot.idle { background: var(--faint); animation: none; }

.statusbar .spacer { flex: 1; }
.statusbar .omgauge { width: 34px; height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; display: inline-block; vertical-align: middle; }
.statusbar .omgauge i { display: block; height: 100%; background: var(--text2); }
.statusbar .omgauge i.hot { background: var(--warn); }

/* ============ toasts ============ */
.toasts { position: fixed; right: 12px; bottom: 36px; z-index: 50; display: flex; flex-direction: column; gap: 8px; width: 324px; }
.toast { background: var(--raised); border: 1px solid var(--line); border-left: 2px solid var(--acc); border-radius: 6px; padding: 9px 12px; font-size: 12px; cursor: pointer; box-shadow: 0 8px 24px rgba(0,0,0,.45); animation: toastin .22s cubic-bezier(.32,.72,.28,1); }

.toast .tt { font-weight: 600; color: var(--text); }
.toast .tm { font: 10.5px var(--mono); color: var(--faint); margin-top: 2px; }

function mdToHtml(md) {

    else if (/^- /.test(l)) { if (!inList) { out.push('<ul>'); inList = true; } out.push('<li>' + l.slice(2) + '</li>'); }
    else { if (inList) { out.push('</ul>'); inList = false; } if (l) out.push('<p>' + l + '</p>'); }
  }
  if (inList) out.push('</ul>');
  return out.join('')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')

}

  const [cls, label] = stMap[t.state] || ['pend', t.state];

  const collapsed = S.collapsedTasks[t.id];
  let h = '<div class="taskcard">' +
    '<div class="tt" data-task="' + t.id + '"><span>' + esc(t.title) + '</span><span class="st ' + cls + '"><i></i>' + label + '</span></div>';
  if (!collapsed) {
    if (t.pct != null) h += '<div class="pbar"><i style="width:' + t.pct + '%"></i></div>';
    if (worker) h += '<div class="workerrow">' + IC.bot + ' ' + esc(worker.title.split(' · ')[0]) + ' · ' + worker.model +
      ' <span class="wo" data-open="' + worker.id + '">open →</span></div>';
    h += '<div class="tsec"><div class="ts-h">steps</div>' +
      t.steps.map(st => '<div class="step ' + st.state + '"><span class="mk">' + (st.state === 'done' ? '✓' : st.state === 'active' ? '▸' : '·') + '</span>' +

    h += '<div class="tsec"><div class="ts-h">acceptance — evidence-gated</div><div class="crits">' +
      t.crits.map(c => '<span class="crit ' + c.state + '"><span class="c">' + (c.state === 'sat' ? '✓' : c.state === 'fail' ? '✗' : '○') + '</span>' + esc(c.t) + '</span>').join('') + '</div>';
    if (t.evidence && t.evidence.length) h += t.evidence.map(ev =>
      '<div class="ev' + (ev.ok ? '' : ' bad') + '">' + (ev.ok ? '<span class="ok">✓</span> ' : '✗ ') + esc(ev.t) + '</div>').join('');
    h += '</div>';
    if (t.blocker) h += '<div class="tsec"><div class="ts-h">blocked</div><div class="ev bad">' + esc(t.blocker) + '</div></div>';
    h += '<div class="rc"><span class="rcl">resume contract</span><br>' + esc(t.resume) + '</div>';
    h += '<div class="tc-actions">' +
      (t.state === 'in_progress' ? '<button class="tmini" data-tact="nudge" data-task="' + t.id + '">nudge worker</button>' : '') +

/* ================= actions ================= */
function setView(v) { S.view = v; render(); }
function setWs(w) {
  S.ws = w;
  const first = wsSessions(w)[0];
  if (first) S.session = first.id;
  S.view = 'chat'; S.chFile = 0; S.sheet = null; S.lsheet = null; S.bellOpen = false;
  render();
}
function openSession(id) {
  const s = sById(id);
  if (!s) return;
  S.ws = s.ws; S.session = id; S.view = 'chat';
  S.sheet = null; S.lsheet = null; S.bellOpen = false; S.chFile = 0;
  render();
}
function closeWs(id) {
  const i = WSTABS.indexOf(id);
  if (i >= 0 && WSTABS.length > 1) { WSTABS.splice(i, 1); actToast(WS[id].name + ' closed (prototype: workspaces survive restart in the real app)'); if (S.ws === id) S.ws = WSTABS[0]; render(); }
}
let nsN = 0;
function newSession() {
  const id = 'sn' + (++nsN);
  SESSIONS.unshift({ id, ws: S.ws, title: 'New session ' + id, model: S.composer.model, state: 'idle', activity: 'empty — say something', files: 0, age: 'now', tokens: 0, cost: '$0.00', parent: null });
  openSession(id);
  actToast('new session in ' + WS[S.ws].name);
}
function jumpSession(dir) {
  const list = wsSessions(S.ws);
  if (!list.length) return;
  const i = list.findIndex(x => x.id === S.session);
  const next = list[(i + dir + list.length) % list.length];
  openSession(next.id);
}
function stopTurn() {
  const s = activeS();
  if (s.state !== 'running') { actToast('nothing running'); return; }
  s.state = 'idle'; s.activity = 'stopped — partial entry kept';
  S.sim.streamEntry = null;
  actToast('stop — stream interrupted, partial kept as an interrupted entry, tool batch finished');
  render();
}
function toggleFocus() { S.focus = !S.focus; S.sheet = null; S.lsheet = null; S.bellOpen = false; render(); }
function openAttention() { S.sheet = 'attention'; S.bellOpen = true; render(); }
function toggleReasoning() { S.thinkAll = S.thinkAll === false; render(); }
function showKeymap() { S.palView = 'keymap'; render(); }
function actToast(msg) { toast({ title: WS[S.ws].name, msg }); }
function sendMsg() {
  const text = S.composer.text.trim();
  if (!text) return;
  const lane = S.composer.lane;
  const s = activeS();
  S.composer.text = ''; S.ac = null;
  if (s.state === 'running' && lane !== 'force') {
    const q = QUEUES[S.session] || (QUEUES[S.session] = { reports: [], steering: [], follow: [] });
    if (lane === 'steering') q.steering.push(text); else q.follow.push(text);
    actToast('queued as ' + lane + ' — ' + (lane === 'steering' ? 'delivered at the next tool-batch boundary' : 'delivered after all work finishes'));
  } else {
    S.userAdd = S.userAdd || {};
    (S.userAdd[S.session] = S.userAdd[S.session] || []).push({ k: 'user', who: 'you', ts: 'now', lane: lane === 'force' ? 'force' : null, text });
    if (lane === 'force') actToast('force — in-flight stream killed, partial kept, delivering at the head of the queue');
    if (s.state !== 'running') { s.state = 'running'; s.activity = 'thinking…'; }
  }
  render();
}
function sendCommitAsk() {
  S.composer.text = 'Commit the current changes with a message you are happy with.';
  S.composer.lane = 'steering';
  actToast('prefilled — commit via the agent (v0: the agent is the committer)');
  render();
}
function computeAc(v) {
  const m = v.match(/^\/(\w*)$/);
  if (m) {
    const q = m[1].toLowerCase();
    const items = [{ n: '/model', d: 'switch provider + model' }, { n: '/help', d: 'show help' }]
      .concat(SKILLS.map(s => ({ n: '/' + s.id, d: 'skill — ' + s.d })))
      .concat(AGENT_TYPES.map(a => ({ n: '/' + a.id, d: 'spawn sub-agent — ' + a.d })))
      .filter(i => i.n.includes(q));
    return { type: 'slash', items, sel: 0 };
  }
  const a = v.match(/@([\w./-]*)$/);
  if (a) {
    const q = a[1].toLowerCase();
    const items = (FILES[S.ws] || []).filter(f => f[2] === 'file').map(f => f[1])
      .filter(n => n.toLowerCase().includes(q)).map(n => ({ n: '@' + n, d: 'file' }));
    return { type: 'file', items, sel: 0 };
  }
  return null;
}
function applyAc(item) {
  S.composer.text = item.n + ' ';
  S.ac = null;
  if (item.n === '/model') S.modelMenu = true;
  render();
}
function palFiltered() {
  const q = S.palQ.toLowerCase();
  return palItems().filter(it => !q || (it.g + ' ' + it.label).toLowerCase().includes(q));
}
function palItems() {
  const s = activeS();
  const items = [
    { g: 'View', label: 'Go to board', key: '⌘1', fn: () => setView('board') },
    { g: 'View', label: 'Go to chat', key: '⌘2', fn: () => setView('chat') },
    { g: 'View', label: 'Go to changes', key: '⌘3', fn: () => setView('changes') },
    { g: 'View', label: 'Toggle focus mode', key: '⌘.', fn: toggleFocus },
    { g: 'View', label: 'Show attention — ' + attention().length + ' need you', key: '⌘⇧A', fn: openAttention },
    { g: 'Session', label: 'New session in ' + WS[S.ws].name, key: '⌘N', fn: newSession },
    { g: 'Session', label: 'Next session', key: '⌘⇧]', fn: () => jumpSession(1) },
    { g: 'Session', label: 'Previous session', key: '⌘⇧[', fn: () => jumpSession(-1) },
    { g: 'Session', label: 'Stop current turn', key: 'esc', fn: stopTurn },
    { g: 'Session', label: 'Toggle all reasoning', key: 'r', fn: toggleReasoning },
    { g: 'Current session', label: 'Branch “' + s.title + '”', fn: () => actToast('session_branch — new child entry at the leaf (file is only ever appended)') },
    { g: 'Current session', label: 'Fork “' + s.title + '”', fn: () => actToast('session_fork — branched copy of the history') },
    { g: 'Current session', label: 'Archive “' + s.title + '”', fn: () => actToast('archive — one-way zstd into archive/, parent-scoped (ADR-0005)') },
  ];
  for (const w of WSTABS.filter(x => x !== S.ws)) items.push({ g: 'Workspace', label: 'Open workspace: ' + WS[w].name, fn: () => setWs(w) });
  for (const x of wsSessions(S.ws)) items.push({ g: 'Jump to', label: x.title, fn: () => openSession(x.id) });
  items.push({ g: 'Help', label: 'Show keymap', fn: showKeymap });
  return items;
}
function palExec() {
  const f = palFiltered();
  const it = f[S.palSel];
  if (!it) return;
  S.pal = false; render();
  setTimeout(() => it.fn(), 0);
}
function movePal(d) {
  const n = palFiltered().length;
  if (n) S.palSel = (S.palSel + d + n) % n;
  render();
}

/* ================= wiring ================= */
function wire(was, stick, prevTop) {
  app.querySelectorAll('[data-act]').forEach(el => el.addEventListener('click', ev => {
    if (el.dataset.act === 'closews') return; // handled separately (stop propagation)
    const a = el.dataset.act;
    if (a === 'pal') { S.pal = true; S.palQ = ''; S.palSel = 0; S.palView = 'commands'; render(); }
    else if (a === 'bell') { openAttention(); }
    else if (a === 'focus') toggleFocus();
    else if (a === 'settings') { S.settingsOpen = true; render(); }
    else if (a === 'close-settings') { S.settingsOpen = false; render(); }
    else if (a === 'close-sheet') { S.sheet = null; S.bellOpen = false; render(); }
    else if (a === 'close-lsheet') { S.lsheet = null; render(); }
    else if (a === 'lsheet-toggle') { S.lsheet = S.lsheet ? null : 'sessions'; render(); }
    else if (a === 'new-ws') actToast('new workspace — pick a folder (real app: native dialog)');
    else if (a === 'stop') stopTurn();
    else if (a === 'send') sendMsg();
    else if (a === 'model') { S.modelMenu = !S.modelMenu; render(); }
    else if (a === 'branch-sess') actToast('session_branch at the leaf');
    else if (a === 'branch-entry') actToast('session_branch from this entry');
    else if (a === 'fork-entry') actToast('session_fork from this entry');
    else if (a === 'copy-entry') actToast('copied to clipboard');
    else if (a === 'archive-folder') actToast('archive — 12 sessions (one-way, explicit)');
    else if (a === 'commit-ask') sendCommitAsk();
  }));
  app.querySelectorAll('[data-closews]').forEach(el => el.addEventListener('click', ev => { ev.stopPropagation(); closeWs(el.dataset.closews); }));
  app.querySelectorAll('[data-ws]').forEach(el => el.addEventListener('click', () => setWs(el.dataset.ws)));
  app.querySelectorAll('[data-view]').forEach(el => el.addEventListener('click', () => setView(el.dataset.view)));
  app.querySelectorAll('[data-open]').forEach(el => el.addEventListener('click', ev => { ev.stopPropagation(); openSession(el.dataset.open); }));
  app.querySelectorAll('[data-ltab]').forEach(el => el.addEventListener('click', () => { S.leftTab = el.dataset.ltab; render(); }));
  app.querySelectorAll('[data-rtab]').forEach(el => el.addEventListener('click', () => { S.rightTab = el.dataset.rtab; render(); }));
  app.querySelectorAll('[data-tfilter]').forEach(el => el.addEventListener('click', () => { S.taskFilter = el.dataset.tfilter; render(); }));
  app.querySelectorAll('[data-lane]').forEach(el => el.addEventListener('click', () => { S.composer.lane = el.dataset.lane; render(); }));
  app.querySelectorAll('[data-sheet]').forEach(el => el.addEventListener('click', () => { S.sheet = el.dataset.sheet; S.bellOpen = false; render(); }));
  app.querySelectorAll('[data-model]').forEach(el => el.addEventListener('click', () => { S.composer.model = el.dataset.model; S.modelMenu = false; render(); }));
  app.querySelectorAll('[data-set]').forEach(el => el.addEventListener('click', () => {
    const k = el.dataset.set;
    S.settings[k] = !S.settings[k];
    render();
  }));
  app.querySelectorAll('[data-tool]').forEach(el => el.addEventListener('click', () => {
    const id = el.dataset.tool;
    S.expandedTools[id] = !S.expandedTools[id];
    render();
  }));
  const tt = app.querySelector('[data-tools-toggle]');
  if (tt) tt.addEventListener('click', () => { S.toolsOpen = !S.toolsOpen; render(); });
  app.querySelectorAll('[data-think]').forEach(el => el.addEventListener('click', () => toggleReasoning()));
  app.querySelectorAll('[data-recall]').forEach(el => el.addEventListener('click', () => {
    S.openRecall = S.openRecall === el.dataset.recall ? null : el.dataset.recall;
    render();
  }));
  app.querySelectorAll('[data-tl]').forEach(el => el.addEventListener('click', () => {
    const t = el.dataset.tl;
    if (t === 'think') toggleReasoning();
    else if (t === 'stream') { const ts = document.getElementById('tscroll'); if (ts) ts.scrollTop = ts.scrollHeight; }
    else { S.expandedTools[t] = true; render(); }
  }));
  app.querySelectorAll('[data-task]').forEach(el => {
    const isTt = el.classList.contains('tt');
    el.addEventListener('click', ev => {
      if (!isTt) return;
      const id = el.dataset.task;
      S.collapsedTasks[id] = !S.collapsedTasks[id];
      render();
    });
  });
  app.querySelectorAll('[data-tact]').forEach(el => el.addEventListener('click', ev => {
    ev.stopPropagation();
    const t = (TASKS[S.session] || []).find(x => x.id === el.dataset.task);
    if (el.dataset.tact === 'cancel' && t) t.state = 'cancelled';
    actToast(el.dataset.tact === 'nudge' ? 'nudge sent to the worker (one-shot, then failed)' : el.dataset.tact + ' — prototype');
    render();
  }));
  app.querySelectorAll('[data-substop]').forEach(el => el.addEventListener('click', ev => {
    ev.stopPropagation();
    const sub = (SUBS[S.session] || []).find(x => x.id === el.dataset.substop);
    if (sub) { sub.state = 'stopped'; sub.last = 'stopped by you'; }
    const s = sById(el.dataset.substop); if (s) { s.state = 'idle'; s.activity = 'stopped'; }
    actToast('sub-agent stopped — session kept, resumable');
    render();
  }));
  app.querySelectorAll('[data-submsg]').forEach(el => el.addEventListener('click', ev => {
    ev.stopPropagation();
    S.composer.text = 'message ' + el.dataset.submsg + ': ';
    S.composer.lane = 'steering';
    render();
  }));
  app.querySelectorAll('[data-chfile]').forEach(el => el.addEventListener('click', () => { S.chFile = +el.dataset.chfile; render(); }));
  app.querySelectorAll('[data-file]').forEach(el => el.addEventListener('click', () => {
    const f = (FILES[S.ws] || [])[+el.dataset.file];
    if (!f) return;
    const ch = CHANGES[S.session];
    const idx = ch ? ch.files.findIndex(x => x.path === f[1] || x.path.endsWith('/' + f[1])) : -1;
    if (idx >= 0) { S.view = 'changes'; S.chFile = idx; render(); }
    else actToast('prototype: would open ' + f[1] + ' in the editor');
  }));
  app.querySelectorAll('[data-qdel]').forEach(el => el.addEventListener('click', () => {
    const [sec, i] = el.dataset.qdel.split(',').map(Number);
    const q = QUEUES[S.session];
    if (!q) return;
    (sec === 0 ? q.reports.splice(i, 1) : sec === 1 ? q.steering.splice(i, 1) : q.follow.splice(i, 1));
    actToast('removed from queue');
    render();
  }));
  app.querySelectorAll('[data-qrestore]').forEach(el => el.addEventListener('click', () => {
    const [sec, i] = el.dataset.qrestore.split(',').map(Number);
    const q = QUEUES[S.session];
    if (!q) return;
    const t = sec === 1 ? q.steering.splice(i, 1)[0] : q.follow.splice(i, 1)[0];
    S.composer.text = t; S.ac = null;
    render();
  }));
  app.querySelectorAll('[data-ac]').forEach(el => el.addEventListener('click', () => {
    applyAc(S.ac.items[+el.dataset.ac]);
  }));
  app.querySelectorAll('[data-pal]').forEach(el => el.addEventListener('click', () => palExec()));
  app.querySelectorAll('[data-toast]').forEach(el => el.addEventListener('click', () => {
    const t = S.toasts[+el.dataset.toast];
    if (t && t.sid) openSession(t.sid);
  }));
  // inputs
  const comp = app.querySelector('#comp');
  if (comp) {
    comp.addEventListener('input', () => { S.composer.text = comp.value; S.ac = computeAc(comp.value); render(); });
    comp.addEventListener('keydown', e => {
      if (S.ac && S.ac.items.length) {
        if (e.key === 'ArrowDown') { e.preventDefault(); S.ac.sel = (S.ac.sel + 1) % S.ac.items.length; render(); return; }
        if (e.key === 'ArrowUp') { e.preventDefault(); S.ac.sel = (S.ac.sel - 1 + S.ac.items.length) % S.ac.items.length; render(); return; }
        if (e.key === 'Tab' || e.key === 'Enter') { e.preventDefault(); applyAc(S.ac.items[S.ac.sel]); return; }
        if (e.key === 'Escape') { S.ac = null; render(); return; }
      }
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
    });
  }
  const pin = app.querySelector('#pal-in');
  if (pin) {
    pin.addEventListener('input', () => { S.palQ = pin.value; S.palSel = 0; if (S.palQ === '?') { S.palView = 'keymap'; } render(); });
    pin.addEventListener('keydown', e => {
      if (e.key === 'ArrowDown') { e.preventDefault(); movePal(1); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); movePal(-1); }
      else if (e.key === 'Enter') { e.preventDefault(); palExec(); }
    });
  }
  const ss = app.querySelector('#s-search');
  if (ss) ss.addEventListener('input', () => { S.sessionSearch = ss.value; render(); });
  const fs = app.querySelector('#f-search');
  if (fs) fs.addEventListener('input', () => { S.fileSearch = fs.value; render(); });
  const fs2 = app.querySelector('#f-search2');
  if (fs2) fs2.addEventListener('input', () => { S.fileSearch = fs2.value; render(); });
  // restore focus
  if (was === 'comp') { const c = app.querySelector('#comp'); if (c) { c.focus(); c.selectionStart = c.selectionEnd = c.value.length; } }
  if (was === 'pal-in') { const p = app.querySelector('#pal-in'); if (p) p.focus(); }
  if (was === 's-search') { const s2 = app.querySelector('#s-search'); if (s2) s2.focus(); }
  if (was === 'f-search') { const f3 = app.querySelector('#f-search'); if (f3) f3.focus(); }
  if (was === 'f-search2') { const f4 = app.querySelector('#f-search2'); if (f4) f4.focus(); }
  // scroll transcript to bottom
  const ts = document.getElementById('tscroll');
  if (ts) ts.scrollTop = stick === false ? prevTop : ts.scrollHeight;
}

/* global keyboard */
function inInput() { const a = document.activeElement; return a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.isContentEditable); }
document.addEventListener('keydown', e => {
  const k = e.key;
  const mod = e.metaKey || e.ctrlKey;
  if (S.pal && S.palView === 'commands' && document.activeElement && document.activeElement.id === 'pal-in') {
    if (k === 'Escape') { e.preventDefault(); S.pal = false; render(); return; }
  }
  if (mod && k.toLowerCase() === 'k') { e.preventDefault(); S.pal = !S.pal; S.palQ = ''; S.palSel = 0; S.palView = 'commands'; render(); return; }
  if (mod && k === '.') { e.preventDefault(); toggleFocus(); return; }
  if (mod && k === '1') { e.preventDefault(); setView('board'); return; }
  if (mod && k === '2') { e.preventDefault(); setView('chat'); return; }
  if (mod && k === '3') { e.preventDefault(); setView('changes'); return; }
  if (mod && k.toLowerCase() === 'n') { e.preventDefault(); newSession(); return; }
  if (mod && e.shiftKey && k.toLowerCase() === 'a') { e.preventDefault(); openAttention(); return; }
  if (mod && k === '[') { e.preventDefault(); jumpSession(-1); return; }
  if (mod && k === ']') { e.preventDefault(); jumpSession(1); return; }
  if (k === 'ArrowUp' && e.altKey) { e.preventDefault(); jumpSession(-1); return; }
  if (k === 'ArrowDown' && e.altKey) { e.preventDefault(); jumpSession(1); return; }
  if (k === 'Escape') {
    if (S.pal) { S.pal = false; render(); return; }
    if (S.modelMenu) { S.modelMenu = false; render(); return; }
    if (S.ac) { S.ac = null; render(); return; }
    if (S.settingsOpen) { S.settingsOpen = false; render(); return; }
    if (S.sheet || S.lsheet) { S.sheet = null; S.lsheet = null; S.bellOpen = false; render(); return; }
    stopTurn(); return;
  }
  if (k === 'r' && !mod && !inInput()) { e.preventDefault(); toggleReasoning(); }
});
document.addEventListener('click', e => {
  if (S.focus && (S.sheet || S.lsheet) && !e.target.closest('.sheet') && !e.target.closest('.lsheet') && !e.target.closest('.rrail') && !e.target.closest('.lrail')) {
    S.sheet = null; S.lsheet = null; render();
  }
});

/* ================= live simulation ================= */
const SIM = { tool3: false, turn2: false, xw: false, sub: false, om: false, end: false };
function simTick() {
  S.sim.t += 0.1;
  const t = S.sim.t;
  let ch = false;
  const st = S.sim.streamEntry;
  if (st && S.sim.chars < st.md.length) { S.sim.chars = Math.min(st.md.length, S.sim.chars + 3); ch = true; }
  if (!SIM.tool3 && t >= 5) {
    SIM.tool3 = true;
    const t3 = T_S1.find(e => e.k === 'tools').items[2];
    t3.st = 'ok'; t3.el = '4.2s'; t3.out = '17';
    ch = true;
  }
  if (!SIM.turn2 && t >= 9) {
    SIM.turn2 = true;
    QUEUES.s1.steering = [];
    T_S1.push({ k: 'user', who: 'you', ts: '13:59', lane: 'steering', text: 'Also consider a shared tokens layer so the two themes can swap' });
    const e2 = { k: 'stream2', md: 'Good — folded in. The scale gets a per-theme accent family: `--acc`, `--acc-soft`, `--acc-ghost`, so both themes swap at the root and no component changes. I will write the scale to `docs/notes/tokens.md` next, and the reviewer can work off it.' };
    T_S1.push(e2);
    S.sim.streamEntry = e2; S.sim.chars = 0;
    sById('s1').activity = 'thinking · drafting token scale';
    ch = true;
  }
  if (!SIM.xw && t >= 10) {
    SIM.xw = true;
    const s10 = sById('s10');
    s10.state = 'needs'; s10.why = 'sub-agent waiting on you'; s10.activity = 'sub-agent parked — wants your input';
    toast({ needs: true, title: 'bloody-chairs · ' + s10.title, msg: s10.why, sid: 's10' });
    ch = true;
  }
  if (!SIM.sub && t >= 15) {
    SIM.sub = true;
    const s6 = sById('s6');
    s6.state = 'done'; s6.activity = 'report delivered · 4 tools surveyed';
    const r = SUBS.s1[0]; r.state = 'done'; r.last = 'Report delivered (4 tools surveyed)';
    TASKS.s1[0].pct = 62;
    toast({ title: 'tau · researcher', msg: 'done — report in thread' });
    ch = true;
  }
  if (!SIM.om && t >= 17) { SIM.om = true; S.om.obs = 25500; S.om.pending = 0; ch = true; }
  if (!SIM.end && SIM.turn2 && S.sim.streamEntry && S.sim.chars >= S.sim.streamEntry.md.length && t >= 22) {
    SIM.end = true;
    const s1 = sById('s1');
    s1.state = 'idle'; s1.activity = 'idle · 132k tokens';
    toast({ title: 'turn complete', msg: 'CSS architecture review · +$0.06' });
    ch = true;
  }
  if (ch) render();
}

/* ================= boot ================= */
S.settings = { sound: false, notify: true, reasoning: true, stick: true };
S.collapsedTasks = {};
S.sim.streamEntry = T_S1[6];
render();
setInterval(simTick, 100);
</script>

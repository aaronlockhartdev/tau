[package]
name = "tau-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["devtools"] }
tauri-plugin-dialog = "2"
# debug builds only (cfg-gated in main.rs): the agent's window into the UI
tauri-plugin-pilot = { git = "https://github.com/mpiton/tauri-pilot" }
tau-protocol = { path = "../../crates/tau-protocol" }
tau-core = { path = "../../crates/tau-core" }
tokio = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# the `test` feature gates `tauri::test::mock_app` (an unstable API —
# keep the smoke suite to one test)
tauri = { version = "2.11", features = ["test"] }
tempfile = { workspace = true }
serde_json = { workspace = true }

[package]
name = "tau-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[features]
# The E2E/dogfooding stack (roadmap G2): the pilot socket + the WebdriverIO
# server. Debug builds opt in via `--features e2e`; release builds compile
# none of it in (sweep finding X1: debug seams stay out of the artifact).
e2e = [
    "dep:tauri-plugin-pilot",
    "dep:tauri-plugin-wdio",
    "dep:tauri-plugin-wdio-webdriver",
]
[dependencies]
tauri = { version = "2.11", features = ["devtools"] }
tauri-plugin-dialog = "2"
# E2E/dogfooding only (the `e2e` feature; registered in main.rs for debug
# builds): the agent's window into the UI
tauri-plugin-pilot = { git = "https://github.com/mpiton/tauri-pilot", optional = true }
# E2E/dogfooding only (the `e2e` feature; registered in main.rs for debug
# builds): the WebdriverIO E2E stack (roadmap G2)
tauri-plugin-wdio = { version = "1.4", optional = true }
tauri-plugin-wdio-webdriver = { version = "1.4", optional = true }
tau-protocol = { path = "../../crates/tau-protocol" }
tau-core = { path = "../../crates/tau-core" }
tokio = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# the `test` feature gates `tauri::test::mock_app` (an unstable API —
# keep the smoke suite to one test)
tauri = { version = "2.11", features = ["test"] }
tempfile = { workspace = true }
serde_json = { workspace = true }

<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>τ concierge · dialogue-first prototype</title>
<style>
:root {
  --bg: #0a0c10; --panel: #11141a; --panel2: #161b23; --line: #1e232d; --line2: #2a3140;
  --text: #e6e9ef; --text2: #9aa3b2; --faint: #5c6572;
  --accent: #4c8dff; --green: #3fb950; --red: #f85149; --amber: #d29920; --purple: #a371f7;
  --mono: 'SF Mono', ui-monospace, 'Menlo', monospace;
  --sans: -apple-system, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font: 13px var(--sans); }
#app { display: grid; grid-template-rows: 48px 1fr 24px; height: 100vh; }

/* ── topbar ─────────────────────────────────────────────── */
.topbar { display: flex; align-items: center; gap: 12px; padding: 0 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
.logo { font-weight: 700; font-size: 13.5px; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.logo .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px rgba(63,185,80,.55); }
.topbar .sub { font-size: 11.5px; color: var(--faint); white-space: nowrap; }
.spacer { flex: 1; }
.btn { display: flex; align-items: center; gap: 6px; background: var(--bg); border: 1px solid var(--line2); border-radius: 6px; color: var(--text2); font: 12px var(--sans); padding: 5px 10px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--faint); color: var(--text); }
.btn kbd { font: 10px var(--mono); color: var(--faint); }
.bell { position: relative; }
.bell .n { position: absolute; top: -6px; right: -6px; min-width: 15px; height: 15px; border-radius: 8px; background: var(--red); color: #fff; font: 700 9.5px var(--mono); display: flex; align-items: center; justify-content: center; padding: 0 3px; }

/* ── body: conversation | fleet rail ────────────────────── */
.body { display: grid; grid-template-columns: 1fr 280px; min-height: 0; }

.conv { display: grid; grid-template-rows: auto 1fr auto; min-width: 0; min-height: 0; background: var(--bg); }
.conv-head { padding: 9px 24px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: baseline; }
.conv-head .t { font-weight: 700; font-size: 13px; }
.conv-head .s { font-size: 11.5px; color: var(--faint); }
.conv-scroll { overflow-y: auto; padding: 18px 24px 10px; display: flex; flex-direction: column; gap: 14px; }

.entry { max-width: 720px; animation: rowin .25s ease; }
.entry .eh { display: flex; gap: 8px; align-items: center; margin-bottom: 5px; }
.entry .av { width: 22px; height: 22px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font: 600 11px var(--mono); background: var(--panel2); color: var(--green); border: 1px solid var(--line2); flex: none; }
.entry .who { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text2); }
.entry .tm { font: 10px var(--mono); color: var(--faint); }
.entry .txt { font-size: 13.5px; line-height: 1.55; }
.entry .txt code { font: 12px var(--mono); background: var(--panel2); padding: 1px 5px; border-radius: 4px; }
.entry.user { align-self: flex-end; max-width: 560px; }
.entry.user .bubble { background: rgba(76,141,255,.12); border: 1px solid rgba(76,141,255,.3); border-radius: 10px; padding: 9px 13px; font-size: 13.5px; line-height: 1.5; }

/* inline fleet snapshot */
.fleet { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; margin-top: 9px; }
.fcell { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; cursor: pointer; }
.fcell:hover { border-color: var(--line2); background: var(--panel2); }
.fcell .r1 { display: flex; gap: 7px; align-items: center; }
.fcell .nm { font-size: 12.5px; font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fcell .st { font: 10px var(--mono); }
.fcell .r2 { font-size: 11.5px; color: var(--text2); margin-top: 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fcell .r3 { font: 10.5px var(--mono); color: var(--faint); margin-top: 4px; }
.fcell.warn { border-color: rgba(248,81,73,.45); }

/* inline session card */
.scard { background: var(--panel); border: 1px solid var(--line2); border-radius: 10px; margin-top: 9px; max-width: 440px; overflow: hidden; }
.scard .h { display: flex; gap: 8px; align-items: center; padding: 9px 12px; border-bottom: 1px solid var(--line); }
.scard .h .d { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.scard .h .nm { font-weight: 700; font-size: 13px; }
.scard .h .ws { font: 10.5px var(--mono); color: var(--faint); border: 1px solid var(--line2); border-radius: 4px; padding: 1px 6px; }
.scard .h .st { margin-left: auto; font: 10.5px var(--mono); }
.scard .b { padding: 9px 12px 10px; }
.scard .act { font-size: 12.5px; }
.scard .meta { font: 10.5px var(--mono); color: var(--faint); margin-top: 6px; display: flex; gap: 14px; }
.scard .latest { font-size: 12px; color: var(--text2); margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); }
.scard .a { display: flex; gap: 7px; padding: 8px 12px; border-top: 1px solid var(--line); }
.scard .a button { background: var(--bg); border: 1px solid var(--line2); color: var(--text2); font: 11.5px var(--sans); border-radius: 6px; padding: 4px 11px; cursor: pointer; }
.scard .a button:hover { color: var(--text); border-color: var(--faint); }
.scard .a button.pri { background: var(--accent); border-color: var(--accent); color: #fff; }
.scard.flash { animation: flash .9s ease; }
@keyframes flash { 0% { box-shadow: 0 0 0 2px rgba(63,185,80,.55); } 100% { box-shadow: 0 0 0 0 rgba(63,185,80,0); } }

/* done notice */
.done { display: flex; gap: 10px; align-items: flex-start; background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--green); border-radius: 8px; padding: 10px 12px; margin-top: 9px; max-width: 480px; cursor: pointer; }
.done:hover { border-color: var(--line2); }
.done .t { font-size: 12.5px; font-weight: 600; }
.done .s { font-size: 11.5px; color: var(--text2); margin-top: 3px; }

/* ── fleet rail ─────────────────────────────────────────── */
.rail { background: var(--panel); border-left: 1px solid var(--line); display: grid; grid-template-rows: auto 1fr; min-height: 0; }
.rail .h { padding: 10px 12px; font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); border-bottom: 1px solid var(--line); display: flex; gap: 8px; }
.rail .list { overflow-y: auto; padding: 6px 8px 10px; }
.rail .g { font-size: 9.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); padding: 9px 6px 4px; display: flex; gap: 6px; align-items: center; }
.rail .g .d { width: 6px; height: 6px; border-radius: 2px; }
.rrow { display: flex; gap: 8px; align-items: center; padding: 6px; border-radius: 6px; cursor: pointer; }
.rrow:hover { background: var(--panel2); }
.rrow.on { background: rgba(76,141,255,.13); }
.rrow.warn { background: rgba(248,81,73,.08); }
.rrow .d { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.rrow .d.running { animation: pulse 1.3s infinite; }
.rrow .nm { font-size: 12px; font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rrow .st { font: 10px var(--mono); color: var(--faint); flex: none; }
.rrow .act { font-size: 10.5px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 86px; flex: none; }
.rrow.flash { animation: flash .9s ease; }

/* ── composer ───────────────────────────────────────────── */
.comp { border-top: 1px solid var(--line); padding: 10px 24px 12px; }
.comp .box { max-width: 720px; background: var(--panel); border: 1px solid var(--line2); border-radius: 10px; }
.comp .box:focus-within { border-color: var(--accent); }
.comp textarea { width: 100%; background: none; border: none; outline: none; color: var(--text); font: 13.5px var(--sans); padding: 11px 14px 4px; resize: none; height: 42px; }
.comp .f { display: flex; align-items: center; gap: 10px; padding: 0 12px 9px; }
.comp .hint { font: 10.5px var(--mono); color: var(--faint); }
.comp .send { margin-left: auto; background: var(--accent); border: none; color: #fff; font: 12px var(--sans); font-weight: 600; border-radius: 6px; padding: 6px 16px; cursor: pointer; }
.comp .send:hover { filter: brightness(1.1); }

/* ── drawer (overlay) ───────────────────────────────────── */
.drawer { position: fixed; top: 48px; right: 280px; bottom: 24px; width: 440px; z-index: 30; background: var(--panel); border-left: 1px solid var(--line2); box-shadow: -12px 0 40px rgba(0,0,0,.45); display: grid; grid-template-rows: auto 1fr auto auto; transform: translateX(102%); transition: transform .18s ease; }
#app.has-drawer .drawer { transform: none; }
.dhead { display: flex; align-items: center; gap: 9px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.dhead .d { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.dhead .nm { font-weight: 700; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dhead .ws { font: 10.5px var(--mono); color: var(--faint); border: 1px solid var(--line2); border-radius: 4px; padding: 1px 6px; flex: none; }
.dhead .mdl { font: 10.5px var(--mono); color: var(--faint); margin-left: auto; flex: none; }
.dhead .x { background: none; border: none; color: var(--faint); cursor: pointer; font-size: 15px; line-height: 1; padding: 2px 6px; border-radius: 4px; flex: none; }
.dhead .x:hover { color: var(--text); background: var(--panel2); }
.dtrans { overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 9px; }
.dentry { max-width: 94%; }
.dentry .eh { display: flex; gap: 8px; align-items: baseline; margin-bottom: 3px; }
.dentry .who { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text2); }
.dentry .tm { font: 10px var(--mono); color: var(--faint); }
.dentry .eb { font-size: 12.5px; line-height: 1.5; }
.dentry.user { align-self: flex-end; background: rgba(76,141,255,.1); border: 1px solid rgba(76,141,255,.28); border-radius: 8px; padding: 7px 10px; }
.dentry.user .who { color: var(--accent); }
.dqueue { border-top: 1px solid var(--line); padding: 7px 12px; max-height: 90px; overflow-y: auto; }
.dq-h { font-size: 9.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin: 3px 0; }
.dq-i { font-size: 12px; color: var(--text2); padding: 2px 0; }
.dcomp { border-top: 1px solid var(--line); padding: 10px 12px 12px; }
.dcomp textarea { width: 100%; background: var(--bg); border: 1px solid var(--line2); border-radius: 6px; color: var(--text); font: 13px var(--sans); padding: 8px 10px; resize: none; height: 52px; outline: none; }
.dcomp textarea:focus { border-color: var(--accent); }
.dcomp .f { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.dcomp .lane { font: 10.5px var(--mono); color: var(--faint); cursor: pointer; border: 1px solid var(--line2); border-radius: 5px; padding: 3px 8px; }
.dcomp .lane.on { color: var(--text); border-color: var(--accent); background: rgba(76,141,255,.12); }
.dcomp .send { margin-left: auto; background: var(--accent); border: none; color: #fff; font: 12px var(--sans); font-weight: 600; border-radius: 6px; padding: 6px 14px; cursor: pointer; }

/* ── statusbar ──────────────────────────────────────────── */
.statusbar { display: flex; align-items: center; gap: 16px; padding: 0 12px; background: var(--panel); border-top: 1px solid var(--line); font: 11px var(--mono); color: var(--faint); white-space: nowrap; overflow: hidden; }
.statusbar b { color: var(--text2); font-weight: 500; }
.statusbar .r { margin-left: auto; }

/* ── toasts + palette ───────────────────────────────────── */
.toasts { position: fixed; right: 14px; bottom: 34px; display: flex; flex-direction: column; gap: 8px; z-index: 60; }
.toast { background: var(--panel2); border: 1px solid var(--line2); border-left: 3px solid var(--accent); border-radius: 7px; padding: 9px 13px; font-size: 12.5px; box-shadow: 0 10px 30px rgba(0,0,0,.5); animation: rowin .25s ease; max-width: 340px; }
.toast.red { border-left-color: var(--red); }
.toast .tt { font-weight: 600; }
.toast .ts { color: var(--text2); font-size: 11.5px; margin-top: 2px; }
.pal { position: fixed; left: 50%; top: 15%; transform: translate(-50%, -8px); width: 560px; max-width: calc(100vw - 32px); z-index: 50; background: var(--panel); border: 1px solid var(--line2); border-radius: 8px; overflow: hidden; opacity: 0; pointer-events: none; transition: opacity .15s, transform .15s; box-shadow: 0 16px 48px rgba(0,0,0,.55); }
.pal.open { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
.pal-in { width: 100%; padding: 13px 16px; background: none; border: none; outline: none; color: var(--text); font: 13.5px var(--sans); border-bottom: 1px solid var(--line); }
.pal-list { max-height: 340px; overflow-y: auto; padding: 6px; }
.pal-g { padding: 8px 10px 3px; font-size: 10px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); }
.pal-item { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 6px; font-size: 13px; color: var(--text2); cursor: pointer; }
.pal-item.on { background: rgba(76,141,255,.13); color: var(--text); }
.pal-item kbd { margin-left: auto; font: 10.5px var(--mono); color: var(--faint); }
.pal-empty { padding: 18px 12px; font-size: 12.5px; color: var(--faint); }
.pal-foot { padding: 7px 12px; border-top: 1px solid var(--line); font: 10.5px var(--mono); color: var(--faint); }
@keyframes rowin { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
</style>
</head>
<body>
<div id="app"></div>
<script>
// ── helpers ──────────────────────────────────────────────
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const pad2 = n => String(n).padStart(2,'0');
const now = () => { const d = new Date(); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); };
const ago = min => { const d = new Date(Date.now() - min * 60000); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); };

// ── data ─────────────────────────────────────────────────
const WS = {
  tau:    { name: 'tau',           color: '#4c8dff' },
  chairs: { name: 'bloody-chairs', color: '#d29920' },
  pi:     { name: 'pi',            color: '#a371f7' },
};
const SESS = [
  { id: 's1', ws: 'tau',    name: 'CSS architecture review',  model: 'qwen3.7:latest', state: 'running', tok: 42100, cost: 0.31, activity: 'drafting token scale',        latest: 'the scale gets a per-theme accent family: --acc, --acc-soft, --acc-ghost' },
  { id: 's2', ws: 'tau',    name: 'Refactor store windowing', model: 'qwen3.7:latest', state: 'running', tok: 84200, cost: 0.31, activity: 'bash cargo clippy',             latest: 'windowing pass is in — virtualization off, paged hydration on' },
  { id: 's3', ws: 'tau',    name: 'Wayfinder map #12',        model: 'gpt-5.2',        state: 'needs',   tok: 41200, cost: 0.12, activity: 'asked a question',            latest: 'Should the board view ship in v0, or wait for the focus-mode work?' },
  { id: 's4', ws: 'chairs', name: 'Input remap pass',         model: 'gpt-5.2',        state: 'needs',   tok: 18200, cost: 0.12, activity: 'waiting on you',                latest: 'blocked: waiting on the input map draft to continue the remap' },
  { id: 's5', ws: 'tau',    name: 'Compaction thresholds',    model: 'gpt-5.2',        state: 'idle',    tok: 61000, cost: 0.18, activity: 'done 3d',                     latest: 'thresholds settled at 30k / 40k — written to config notes' },
  { id: 's6', ws: 'chairs', name: 'Credits screen pass',      model: 'llama3.3:70b',   state: 'idle',    tok: 22000, cost: 0.04, activity: 'idle 40m',                    latest: 'credits screen matches the reference — parked' },
  { id: 's7', ws: 'pi',     name: 'Protocol versioning note', model: 'o4-mini',        state: 'running', tok: 9400,  cost: 0.06, activity: 'writing docs/adr/0011',         latest: 'drafting 0011 — versioning the session file format' },
  { id: 's8', ws: 'pi',     name: 'Fuzz harness triage',      model: 'gpt-5.2',        state: 'done',    tok: 31000, cost: 0.09, activity: 'finished 26m',                  latest: '3 corpus crashes triaged — 2 duplicate, 1 filed' },
];
const sById = id => SESS.find(x => x.id === id);
const fmtK = n => n >= 1000 ? (n/1000).toFixed(1) + 'k' : String(n);
const STATE_COLOR = { running: 'var(--green)', needs: 'var(--red)', idle: 'var(--faint)', done: 'var(--green)' };

let DTRANS = {
  s1: [
    { who: 'agent', t: ago(24), text: esc('So my read: keep the per-component <style> blocks — scoped styles are the feature, not the bug.') },
    { who: 'agent', t: ago(11), text: esc('I will draft a token scale with the two themes in mind while the researcher surveys sibling tools.') },
    { who: 'agent', t: ago(4),  text: esc('the scale gets a per-theme accent family: --acc, --acc-soft, --acc-ghost') },
  ],
  s2: [ { who: 'agent', t: ago(15), text: esc('windowing pass is in — virtualization off, paged hydration on') } ],
  s3: [ { who: 'agent', t: ago(12), text: esc('Should the board view ship in v0, or wait until the focus-mode work lands? Your call.') } ],
  s4: [
    { who: 'agent', t: ago(18), text: esc('two bindings collide — remapping layer 3 before the global map applies') },
    { who: 'agent', t: ago(6),  text: esc('blocked: waiting on the input map draft to continue the remap.') },
  ],
  s7: [ { who: 'agent', t: ago(9), text: esc('drafting 0011 — protocol versioning note for the session file format') } ],
};
const DEXTRA = {};
const QUEUE = {
  s1: { steering: ['Also consider a shared tokens layer so the two themes can swap'], followup: [] },
  s4: { steering: [], followup: ['then check the settings page'] },
};

let _cid = 0;
function ce(t, who, kind, text, sid) { return { id: 'c' + (++_cid), t, who, kind, text: esc(text), sid: sid || null, born: 0 }; }
let CONV = [
  ce(ago(9), 'you', 'text', "What's going on?"),
  ce(ago(9), 'tau', 'fleet', 'Five sessions are active. One needs you — the reviewer in Input remap pass is blocked on your input map draft.'),
  ce(ago(8), 'you', 'text', 'Open it.'),
  ce(ago(8), 'tau', 'card', 'Here — Input remap pass, with the question inline.', 's4'),
];

// ── state ────────────────────────────────────────────────
const S = {
  convt: '',
  drawer: null,
  dtext: {}, dlane: {},
  pal: false, palText: '',
  toasts: [], bell: 2,
  flash: {},
  sim: { t: 0, i: 0 },
};
function toast(tt, ts, red) { S.toasts.push({ tt, ts, red }); if (S.toasts.length > 3) S.toasts.shift(); setTimeout(() => { S.toasts.shift(); render(); }, 6000); }
function markFlash(id) { S.flash[id] = Date.now(); }
// ── render ───────────────────────────────────────────────
function fleetGridHtml() {
  const act = SESS.filter(s => s.state === 'running' || s.state === 'needs');
  return `<div class="fleet">${act.map(s => `
    <div class="fcell ${s.state === 'needs' ? 'warn' : ''}" data-act="open" data-id="${s.id}">
      <div class="r1"><span class="nm">${esc(s.name)}</span><span class="st" style="color:${STATE_COLOR[s.state]}">${s.state}</span></div>
      <div class="r2">${esc(s.activity)}</div>
      <div class="r3">${s.model} · ${fmtK(s.tok)} tok · $${s.cost.toFixed(2)}</div>
    </div>`).join('')}</div>`;
}
function scardHtml(e) {
  const s = sById(e.sid); if (!s) return '';
  const fresh = Date.now() - (S.flash[s.id] || 0) < 1200;
  return `<div class="scard ${fresh ? 'flash' : ''}">
    <div class="h"><span class="d" style="background:${WS[s.ws].color}"></span><span class="nm">${esc(s.name)}</span><span class="ws">${WS[s.ws].name}</span><span class="st" style="color:${STATE_COLOR[s.state]}">${s.state}</span></div>
    <div class="b">
      <div class="act">${esc(s.activity)}</div>
      <div class="meta"><span>${s.model}</span><span>${fmtK(s.tok)} tok</span><span>$${s.cost.toFixed(2)}</span></div>
      <div class="latest">${esc(s.latest)}</div>
    </div>
    <div class="a"><button class="pri" data-act="open" data-id="${s.id}">open transcript</button><button data-act="stop" data-id="${s.id}">stop</button></div>
  </div>`;
}
function doneHtml(e) {
  const s = sById(e.sid); if (!s) return '';
  const parts = e.text.split(' — '); return `<div class="done" data-act="open" data-id="${s.id}"><div><div class="t">${esc(parts[0])}</div><div class="s">${esc(parts.slice(1).join(' — '))}</div></div></div>`;
}
function entryHtml(e) {
  if (e.who === 'you') return `<div class="entry user"><div class="eh" style="justify-content:flex-end"><span class="tm">${e.t}</span><span class="who">you</span></div><div class="bubble">${e.text}</div></div>`;
  let body = e.kind === 'text' ? `<div class="txt">${e.text}</div>` : '';
  if (e.kind === 'fleet') body += fleetGridHtml();
  if (e.kind === 'card')  body += scardHtml(e);
  if (e.kind === 'done')  body += doneHtml(e);
  return `<div class="entry tau"><div class="eh"><span class="av">τ</span><span class="who">concierge</span><span class="tm">${e.t}</span></div>${body}</div>`;
}

function shell() {
  const run = SESS.filter(s => s.state === 'running').length;
  const need = SESS.filter(s => s.state === 'needs').length;
  const tot = SESS.reduce((a, s) => a + s.cost, 0).toFixed(2);
  return `
  <div class="topbar">
    <div class="logo"><span class="dot"></span>τ concierge</div>
    <div class="sub">chief of staff for your agents</div>
    <div class="spacer"></div>
    <button class="btn bell" data-act="bell">🔔${S.bell ? `<span class="n">${S.bell}</span>` : ''}</button>
    <button class="btn" data-act="pal">command <kbd>⌘K</kbd></button>
  </div>
  <div class="body">
    <div class="conv">
      <div class="conv-head"><span class="t">Concierge</span><span class="s">one conversation · the whole fleet</span></div>
      <div class="conv-scroll" id="conv-scroll">${CONV.map(entryHtml).join('')}</div>
      <div class="comp"><div class="box">
        <textarea id="conv-in" placeholder="ask about the fleet, steer a session, spawn new work…"></textarea>
        <div class="f"><span class="hint">enter sends · / focuses · ⌘K commands</span><button class="send" data-act="csend">send</button></div>
      </div></div>
    </div>
    ${railHtml()}
  </div>
  <div class="statusbar">
    <span><b>${run}</b> running</span>
    <span><b style="color:${need ? 'var(--red)' : ''}">${need}</b> need you</span>
    <span><b>${SESS.length}</b> sessions</span>
    <span>$<b>${tot}</b> total</span>
    <span class="r">esc closes drawer · ⌘K</span>
  </div>
  ${drawerHtml()}
  <div class="toasts">${S.toasts.map(t => `<div class="toast ${t.red ? 'red' : ''}"><div class="tt">${esc(t.tt)}</div>${t.ts ? `<div class="ts">${esc(t.ts)}</div>` : ''}</div>`).join('')}</div>
  ${palHtml()}
  `;
}

function railHtml() {
  let html = '<div class="rail"><div class="h">fleet · ' + SESS.length + '</div><div class="list">';
  for (const [wid, w] of Object.entries(WS)) {
    const list = SESS.filter(s => s.ws === wid);
    html += `<div class="g"><span class="d" style="background:${w.color}"></span>${w.name}</div>`;
    for (const s of list) {
      const fresh = Date.now() - (S.flash[s.id] || 0) < 1200;
      html += `<div class="rrow ${S.drawer === s.id ? 'on' : ''} ${s.state === 'needs' ? 'warn' : ''} ${fresh ? 'flash' : ''}" data-act="open" data-id="${s.id}">
        <span class="d ${s.state === 'running' ? 'running' : ''}" style="background:${STATE_COLOR[s.state]}"></span>
        <span class="nm">${esc(s.name)}</span>
        <span class="st">${s.state}</span>
        <span class="act">${esc(s.activity)}</span>
      </div>`;
    }
  }
  return html + '</div></div>';
}

function drawerHtml() {
  const s = S.drawer && sById(S.drawer);
  if (!s) return '<div class="drawer"></div>';
  const entries = (DTRANS[s.id] || []).concat(DEXTRA[s.id] || []);
  const q = QUEUE[s.id] || { steering: [], followup: [] };
  const lane = S.dlane[s.id] || 'steering';
  const qh = (q.steering.length || q.followup.length) ? `<div class="dqueue">
    ${q.steering.length ? `<div class="dq-h">steering — next opportunity</div>${q.steering.map(x => `<div class="dq-i">${esc(x)}</div>`).join('')}` : ''}
    ${q.followup.length ? `<div class="dq-h">follow-up — after work completes</div>${q.followup.map(x => `<div class="dq-i">${esc(x)}</div>`).join('')}` : ''}
  </div>` : '';
  return `<div class="drawer">
    <div class="dhead">
      <span class="d" style="background:${WS[s.ws].color}"></span>
      <span class="nm">${esc(s.name)}</span><span class="ws">${WS[s.ws].name}</span>
      <span class="mdl">${s.model} · ${s.state}</span>
      <button class="x" data-act="dclose">✕</button>
    </div>
    <div class="dtrans" id="dtrans">${entries.map(x => `<div class="dentry ${x.who === 'you' ? 'user' : ''}"><div class="eh"><span class="who">${x.who}</span><span class="tm">${x.t}</span></div><div class="eb">${x.text}</div></div>`).join('')}</div>
    ${qh}
    <div class="dcomp">
      <textarea id="dcomp-in" placeholder="message ${esc(s.name)} — enter sends as ${lane}">${esc(S.dtext[s.id] || '')}</textarea>
      <div class="f">
        <span class="lane ${lane === 'steering' ? 'on' : ''}" data-act="dlane" data-id="${s.id}" data-v="steering">steering</span>
        <span class="lane ${lane === 'followup' ? 'on' : ''}" data-act="dlane" data-id="${s.id}" data-v="followup">follow-up</span>
        <button class="send" data-act="dsend" data-id="${s.id}">send</button>
      </div>
    </div>
  </div>`;
}

function palItems() {
  const items = [];
  items.push({ g: 'ask', label: "ask: what's going on?", run: () => { CONV.push(ce(now(), 'tau', 'fleet', 'Current state:')); } });
  for (const s of SESS) items.push({ g: 'open session', label: s.name + '  ·  ' + WS[s.ws].name, run: () => { S.drawer = s.id; } });
  items.push({ g: 'view', label: S.drawer ? 'close session drawer' : 'open a session', run: () => { S.drawer = S.drawer ? null : 's1'; } });
  return items;
}
function palHtml() {
  if (!S.pal) return '';
  const q = S.palText.toLowerCase();
  const items = palItems().filter(i => !q || i.label.toLowerCase().includes(q));
  let html = '', lastG = '';
  for (const i of items) { if (i.g !== lastG) { html += `<div class="pal-g">${i.g}</div>`; lastG = i.g; } html += `<div class="pal-item">${esc(i.label)}</div>`; }
  return `<div class="pal open"><input class="pal-in" id="pal-in" placeholder="type a command…" value="${esc(S.palText)}"><div class="pal-list">${html || '<div class="pal-empty">no matches</div>'}</div><div class="pal-foot">${items.length} commands · ⏎ run first · esc close</div></div>`;
}

// ── render ───────────────────────────────────────────────
function render() { wire(); }

// ── wire ─────────────────────────────────────────────────
function wire() {
  const app = document.getElementById('app');
  app.className = S.drawer ? 'has-drawer' : '';
  const was = document.activeElement && document.activeElement.id ? document.activeElement.id : null;
  const cs = document.getElementById('conv-scroll');
  const cdist = cs ? cs.scrollHeight - cs.scrollTop - cs.clientHeight : 0;
  const cstick = cdist < 80;
  const dtr = document.getElementById('dtrans');
  const dstick = dtr ? dtr.scrollHeight - dtr.scrollTop - dtr.clientHeight < 50 : true;
  app.innerHTML = shell();

  const c2 = document.getElementById('conv-scroll');
  if (c2) c2.scrollTop = cstick ? c2.scrollHeight : Math.max(0, c2.scrollHeight - cdist - c2.clientHeight);
  const d2 = document.getElementById('dtrans');
  if (d2 && dstick) d2.scrollTop = d2.scrollHeight;

  app.addEventListener('click', e => {
    const el = e.target.closest('[data-act]'); if (!el) return;
    const act = el.dataset.act, id = el.dataset.id;
    if (act === 'open') S.drawer = id;
    else if (act === 'stop') { const s = sById(id); if (s) { s.state = 'idle'; s.activity = 'stopped'; toast(s.name, 'stopped'); } }
    else if (act === 'dclose') S.drawer = null;
    else if (act === 'bell') { const n = SESS.find(s => s.state === 'needs'); if (n) S.drawer = n.id; else S.bell = 0; }
    else if (act === 'pal') S.pal = true;
    else if (act === 'csend') { conciergeSend(); return; }
    else if (act === 'dlane') S.dlane[id] = el.dataset.v;
    else if (act === 'dsend') { dsend(id); return; }
    render();
  });

  const ci = app.querySelector('#conv-in');
  if (ci) ci.addEventListener('input', () => { S.convt = ci.value; });
  const di = app.querySelector('#dcomp-in');
  if (di) { di.addEventListener('input', () => { S.dtext[S.drawer] = di.value; }); di.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); dsend(S.drawer); } }); }
  const pi = app.querySelector('#pal-in');
  if (pi) pi.addEventListener('input', () => {
    S.palText = pi.value;
    const q = S.palText.toLowerCase();
    const items = palItems().filter(i => !q || i.label.toLowerCase().includes(q));
    let html = '', lastG = '';
    for (const i of items) { if (i.g !== lastG) { html += `<div class="pal-g">${i.g}</div>`; lastG = i.g; } html += `<div class="pal-item">${esc(i.label)}</div>`; }
    const list = document.querySelector('.pal-list'); if (list) list.innerHTML = html || '<div class="pal-empty">no matches</div>';
    const foot = document.querySelector('.pal-foot'); if (foot) foot.textContent = items.length + ' commands · ⏎ run first · esc close';
  });

  if (was === 'conv-in') { const i = app.querySelector('#conv-in'); if (i) { i.focus(); i.selectionStart = i.selectionEnd = i.value.length; } }
  if (was === 'dcomp-in') { const i = app.querySelector('#dcomp-in'); if (i) i.focus(); }
  const p = app.querySelector('#pal-in');
  if (p) { p.focus(); if (was === 'pal-in') { p.selectionStart = p.selectionEnd = p.value.length; } else p.select(); }
}

// ── actions ──────────────────────────────────────────────
function conciergeSend() {
  const txt = S.convt.trim(); if (!txt) return;
  S.convt = '';
  CONV.push(ce(now(), 'you', 'text', txt));
  const t = txt.toLowerCase();
  render();
  setTimeout(() => {
    if (t.includes('open')) {
      const need = SESS.find(s => s.state === 'needs');
      if (need) { CONV.push(ce(now(), 'tau', 'card', 'Opening it — transcript on the right.', need.id)); S.drawer = need.id; }
      else CONV.push(ce(now(), 'tau', 'text', 'Nothing needs you right now — say a session name and I will open it.'));
    } else if (t.includes('what') || t.includes('going') || t.includes('status') || t.includes('fleet')) {
      CONV.push(ce(now(), 'tau', 'fleet', 'Current state — the snapshot below stays live:'));
    } else {
      CONV.push(ce(now(), 'tau', 'text', 'Noted — I will surface it if it changes state. Say what\'s going on for the live picture, or click a session in the fleet rail.'));
    }
    render();
  }, 700);
}
function dsend(id) {
  const s = sById(id); if (!s) return;
  const txt = (S.dtext[id] || '').trim(); if (!txt) return;
  const lane = S.dlane[id] || 'steering';
  (DEXTRA[id] = DEXTRA[id] || []).push({ who: 'you', t: now(), text: esc(txt) });
  s.state = 'running'; s.activity = 'turn started'; s.latest = esc(txt).slice(0, 90);
  S.dtext[id] = '';
  markFlash(id);
  toast(s.name, 'sent as ' + lane);
  setTimeout(() => { (DEXTRA[id] = DEXTRA[id] || []).push({ who: 'agent', t: now(), text: esc('on it — folding your note into the current turn.') }); render(); }, 1500);
  render();
}

// ── keyboard ─────────────────────────────────────────────
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  const inInput = tag === 'input' || tag === 'textarea';
  if (e.metaKey && e.key === 'k') { e.preventDefault(); S.pal = !S.pal; render(); return; }
  if (e.key === 'Escape') { if (S.pal) S.pal = false; else if (S.drawer) S.drawer = null; render(); return; }
  if (S.pal) { if (e.key === 'Enter') { const q = S.palText.toLowerCase(); const items = palItems().filter(i => !q || i.label.toLowerCase().includes(q)); if (items[0]) { items[0].run(); S.pal = false; } } render(); return; }
  if (inInput) return;
  if (e.key === '/') { e.preventDefault(); const i = document.getElementById('conv-in'); if (i) i.focus(); }
});

// ── simulation ───────────────────────────────────────────
const SIMSCRIPT = [
  { at: 2.5, fn: () => { S.drawer = 's4'; toast('Input remap pass', 'transcript open'); } },
  { at: 6,   fn: () => { const s = sById('s4'); s.state = 'running'; s.activity = 'turn started'; s.latest = 'remapping layer 3 — global map stays the fallback'; markFlash('s4'); CONV.push(ce(now(), 'you', 'text', 'Layer 3 wins, global map stays the fallback.')); CONV.push(ce(now(), 'tau', 'card', 'Sent — Input remap pass is running the remap again.', 's4')); } },
  { at: 11,  fn: () => { const s = sById('s7'); s.state = 'idle'; s.activity = 'idle'; markFlash('s7'); CONV.push(ce(now(), 'tau', 'done', 'Protocol versioning note — turn complete · wrote docs/adr/0011 · 9.8k tok · +$0.03', 's7')); toast('Protocol versioning note', 'turn complete'); } },
  { at: 14,  fn: () => { const s = sById('s1'); s.latest = 'researcher → done · 4 tools surveyed · report in-thread'; markFlash('s1'); } },
  { at: 16,  fn: () => CONV.push(ce(now(), 'you', 'text', "Also have the researcher check Zed's token setup.")) },
  { at: 17,  fn: () => { const s = sById('s1'); s.latest = 'steering queued: also survey Zed\'s token setup'; markFlash('s1'); CONV.push(ce(now(), 'tau', 'text', "Steering queued for CSS architecture review — it will fold Zed's check in at the next tool boundary.")); } },
  { at: 20,  fn: () => { const s = sById('s4'); s.state = 'idle'; s.activity = 'idle'; s.latest = 'remap pass complete — settings page next'; markFlash('s4'); CONV.push(ce(now(), 'tau', 'done', 'Input remap pass — turn complete · 21.4k tok · +$0.04', 's4')); toast('Input remap pass', 'turn complete'); } },
];
function simTick() {
  const a = document.activeElement;
  const typing = a && (a.id === 'conv-in' || a.id === 'dcomp-in' || a.id === 'pal-in');
  if (S.pal || typing) return; // demo freezes while the user is driving
  S.sim.t += 0.1;
  while (S.sim.i < SIMSCRIPT.length && SIMSCRIPT[S.sim.i].at <= S.sim.t) { SIMSCRIPT[S.sim.i].fn(); S.sim.i++; }
  render();
}

render();
setInterval(simTick, 100);
</script>
</body>
</html>

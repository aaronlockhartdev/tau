<!doctype html>
<!--
  PROTOTYPE — throwaway, not production. Do not promote without rewrite.

  #11 verdict design (2026-09-16), round 2 after the user's bug/design list:
    · chat always central; focus mode hides both side panes
    · open workspaces = tabs on top + a "+" button (open a folder)
    · LEFT is TAB-based: [files] [sessions] — sessions MRU-sorted, sub-agent
      groups collapsible (active expanded, others collapsed), archive at bottom.
      Top-level sessions show a "running" tag ONLY when the model is actively
      generating or a sub-agent is running; inactive ones are untagged.
      Sub-agent sessions keep their full status tags.
    · RIGHT = [tasks | sub-agents] tabs; filtered (default: not-done),
      sorted by last modified; task detail with labeled sections
      (steps / evidence / blocker / resume contract); sub-agents are a tree,
      single-click selects, double-click opens the session (no hint text).
    · Steering queue VERTICAL with two sections: steering (top, next
      opportunity) and follow-up (bottom, after all work completes).
    · Composer: one send button + a 3-way message-lane selector
      (⚡ force / ↪ steering / ⏭ follow-up); force delivers immediately
      (interrupts), the others queue.
    · Markdown renders with code segments protected (no more mangled rust);
      entry heights are MEASURED (no clipping, no oversized gaps).
    · Bottom lualine-style status bar: [workspace · session · state]
      [prototype axis + hints] [10k render stats · model].
  Axis (←/→ or click the bar): ?right=tabs (default) | ?right=stacked.
  Earlier A/B/C variants: branch prototype/gui-ia-variants-a-c.
  10k-entry virtualization + 2 live 25 ms-coalesced streams retained (#10 bar).

  Run:  open this file, or:  python3 -m http.server 4173 -d prototype/gui-ia
-->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tau GUI — PROTOTYPE (verdict design)</title>
<style>
:root{
  --bg:#101115; --panel:#16181d; --panel2:#1c1f26; --line:#262a33;
  --tx:#d7dae0; --dim:#7d8494; --acc:#4cc2ff; --green:#57d97a; --amber:#e8b64c;
  --red:#ef6a6a; --purple:#b58cff; --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 var(--sans)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#2c313c;border-radius:5px}
.proto-banner{position:absolute;top:0;left:0;right:0;height:26px;background:#2a2113;color:#e8b64c;
  display:flex;align-items:center;justify-content:center;gap:10px;font:11px/1 var(--mono);letter-spacing:.08em;z-index:50}
#app{position:absolute;inset:26px 0 30px 0;display:flex;flex-direction:column}
/* ---------- top bar ---------- */
.top{display:flex;align-items:stretch;border-bottom:1px solid var(--line);background:var(--panel);flex:none;position:relative}
.wstabs{display:flex;align-items:stretch}
.wstab{display:flex;align-items:center;gap:8px;padding:9px 16px;font-size:13px;color:var(--dim);border-right:1px solid var(--line);cursor:pointer}
.wstab.on{color:var(--tx);background:var(--bg);box-shadow:inset 0 2px 0 var(--acc)}
.wstab .cw{font:10px var(--mono);color:#4d5462}
.wsp{display:flex;align-items:center;padding:0 14px;font-size:15px;color:var(--dim);border-right:1px solid var(--line);cursor:pointer}
.wsp:hover{color:var(--acc);background:var(--panel2)}
.wmenu{position:absolute;top:100%;left:0;z-index:40;background:var(--panel2);border:1px solid var(--line);border-radius:0 0 8px 8px;box-shadow:0 8px 24px rgba(0,0,0,.5);min-width:280px;padding:4px}
.wmenu .mi{display:flex;gap:8px;align-items:center;padding:6px 10px;border-radius:6px;font-size:12.5px;cursor:pointer}
.wmenu .mi:hover{background:var(--panel)}
.wmenu .mi .mk{margin-left:auto;color:var(--green);font:10px var(--mono)}
.wmenu .sep{border-top:1px solid var(--line);margin:4px 0}
.top .tspacer{flex:1}
.top .sht{display:flex;align-items:center;padding:0 12px;font-size:12.5px;color:var(--dim)}
.top .sht a{color:var(--acc);cursor:pointer}
.iconbtn{display:flex;align-items:center;gap:7px;padding:0 14px;font-size:12.5px;color:var(--dim);border-left:1px solid var(--line)}
.iconbtn:hover{color:var(--tx);background:var(--panel2)}
.iconbtn.on{color:var(--acc);background:var(--bg)}
/* ---------- body grid ---------- */
.body{display:grid;grid-template-columns:280px 1fr 330px;flex:1;min-height:0}
.body.focus{grid-template-columns:0 1fr 0}
.body.focus .left,.body.focus .right{display:none}
.body.focus .center{grid-column:2;grid-row:1}
.left{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;min-height:0}
.center{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.right{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;min-height:0}
/* ---------- left tabs ---------- */
.ltabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.ltab{flex:1;text-align:center;padding:8px;font:11px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--dim);cursor:pointer}
.ltab.on{color:var(--acc);box-shadow:inset 0 -2px 0 var(--acc)}
.lsec{overflow-y:auto;min-height:0}
/* ---------- file tree ---------- */
.frow{display:flex;align-items:center;gap:6px;padding:3px 10px 3px 12px;font-size:12.5px;color:var(--dim);white-space:nowrap}
.frow:hover{background:var(--panel2);color:var(--tx)}
.frow .chev{font-size:9px;width:10px;cursor:pointer}
.frow .fn{color:var(--tx)}
.frow .dir{color:var(--acc)}
.kids{display:none}.kids.open{display:block}
/* ---------- session tree ---------- */
.srow{display:flex;align-items:center;gap:7px;padding:5px 10px;font-size:13px;cursor:pointer;color:var(--tx)}
.srow:hover{background:var(--panel2)}
.srow.sel{background:rgba(76,194,255,.12)}
.srow .chev{font-size:9px;width:12px;color:var(--dim);cursor:pointer}
.srow .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .mru{font:9.5px var(--mono);color:#4d5462}
.srow.child{padding-left:26px}
.srow.nested{padding-left:44px}
.arch-h{display:flex;align-items:center;gap:6px;padding:9px 12px;font:11px var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--dim);cursor:pointer}
.arch-h:hover{color:var(--tx)}
/* ---------- badges ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;font:10.5px/1.6 var(--mono);padding:1px 7px;border-radius:9px;border:1px solid var(--line);color:var(--dim);white-space:nowrap;flex:none}
.badge .dot{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.badge.running{color:var(--acc);border-color:rgba(76,194,255,.4)}.badge.running .dot{background:var(--acc);animation:pulse 1.2s infinite}
.badge.done{color:var(--green);border-color:rgba(87,217,122,.4)}.badge.done .dot{background:var(--green)}
.badge.idle{color:var(--amber);border-color:rgba(232,182,76,.4)}.badge.idle .dot{background:var(--amber)}
.badge.failed{color:var(--red);border-color:rgba(239,106,106,.45)}.badge.failed .dot{background:var(--red);animation:pulse .8s infinite}
.badge.stopped{color:var(--dim)}.badge.stopped .dot{background:var(--dim)}
.badge.in-progress{color:var(--acc);border-color:rgba(76,194,255,.4)}.badge.in-progress .dot{background:var(--acc);animation:pulse 1.2s infinite}
.badge.blocked{color:var(--red);border-color:rgba(239,106,106,.45)}.badge.blocked .dot{background:var(--red)}
.badge.pending{color:var(--dim)}.badge.cancelled{color:var(--dim)}
@keyframes pulse{50%{opacity:.35}}
/* ---------- center ---------- */
.chead{display:flex;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex:none}
.chead .n{font-weight:600;font-size:13.5px}
.chead .m{margin-left:auto;font:10.5px var(--mono);color:#4d5462}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--dim)}
.empty .big{font-size:15px;color:var(--tx)}
.scroll{flex:1;overflow-y:auto;min-height:0;position:relative}
.entry{border-bottom:1px solid var(--line);padding:8px 16px}
.entry .eh{display:flex;align-items:center;gap:8px}
.entry .eh .who{font:11px var(--mono);color:var(--dim)}
.entry .eh .who .fz{color:var(--red)}
.entry .eh .tt{font:10px var(--mono);color:#4d5462;margin-left:auto}
.entry .body{margin-top:4px;color:#c6cad2;font-size:13.5px}
.entry.user .who{color:var(--purple)}
.entry.user .body{color:var(--tx)}
.entry.om{background:rgba(181,140,255,.05)}
.entry.om .who{color:var(--purple)}
.entry.archived{background:var(--panel);color:var(--dim);font-size:12px}
.entry.notify{background:rgba(76,194,255,.05);border-left:2px solid var(--acc);padding-left:14px}
.entry.notify .who{color:var(--acc)}
.entry.streaming .body::after{content:"▍";color:var(--acc);animation:pulse 1s infinite}
.entry .body code.ic{font:11.5px var(--mono);background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.entry .body pre.code{background:#0c0d10;border:1px solid var(--line);border-radius:6px;padding:9px 11px;font:11.5px/1.55 var(--mono);overflow-x:auto;margin:6px 0;white-space:pre}
.entry .body pre.code .lang{float:right;font-size:9.5px;color:#4d5462;text-transform:uppercase}
.entry .body .mh{font-weight:600;margin-top:8px}.entry .body .mh2{font-weight:600;font-size:12px;margin-top:8px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em}
.entry .body .mi{padding-left:14px;position:relative}.entry .body .mi::before{content:"–";position:absolute;left:2px;color:var(--dim)}
.entry .body .lk{color:var(--acc)}
.entry .body .k{color:var(--purple)}.entry .body .s{color:var(--green)}.entry .body .c{color:#525a6a}.entry .body .n{color:var(--amber)}.entry .body .t2{color:var(--acc)}
.entry .body .add{color:var(--green);display:block}.entry .body .del{color:var(--red);display:block}
.entry .body .hsh{color:#525a6a;display:inline-block;width:44px}
.entry .body .blob{color:var(--amber);font-style:italic}
.entry .body .iv{color:#5d6474}
.entry.tool .name{font:12px var(--mono);color:var(--acc)}
.entry.tool .arg{font:11.5px var(--mono);color:var(--dim);margin-left:8px}
.entry.tool .out{margin-top:6px;background:#0c0d10;border:1px solid var(--line);border-radius:6px;padding:8px 10px;font:11.5px/1.55 var(--mono);color:#9aa3b2;max-height:320px;overflow:auto;white-space:pre}
/* ---------- vertical queue (two sections) ---------- */
.qvert{flex:none;border-top:1px solid var(--line);background:var(--panel);max-height:170px;overflow-y:auto;padding:6px 14px}
.qh{font:10px var(--mono);color:#4d5462;text-transform:uppercase;letter-spacing:.08em;margin:4px 0 3px}
.qh.empty{opacity:.5}
.qrow{display:flex;align-items:flex-start;gap:8px;padding:4px 8px;border-radius:7px;margin-bottom:3px;background:var(--panel2);border:1px solid var(--line)}
.qrow:hover{border-color:var(--acc)}
.qrow .t{flex:1;font-size:12.5px;color:var(--tx)}
.qrow .x{color:#4d5462;cursor:pointer;font-size:13px;line-height:1.2}
.qrow:hover .x{color:var(--red)}
/* ---------- composer ---------- */
.composer{border-top:1px solid var(--line);background:var(--panel);padding:8px 16px 10px;flex:none}
.lanes{display:flex;gap:4px;margin-bottom:7px}
.lane{font:11px var(--mono);border:1px solid var(--line);border-radius:12px;padding:2px 10px;color:var(--dim);cursor:pointer}
.lane.on{color:var(--tx);border-color:var(--acc);background:rgba(76,194,255,.1)}
.lane.f.on{border-color:var(--red);color:var(--red);background:rgba(239,106,106,.08)}
.lane-hint{margin-left:auto;font:10px var(--mono);color:#4d5462}
.composer .row{display:flex;gap:8px;align-items:center}
.composer input{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 12px;outline:none}
.composer input:focus{border-color:var(--acc)}
.composer .send{background:var(--acc);color:#081018;border-radius:8px;padding:9px 18px;font-weight:600}
/* ---------- right ---------- */
.rtabs{display:flex;border-bottom:1px solid var(--line)}
.rtab{flex:1;text-align:center;padding:8px;font:11px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--dim);cursor:pointer}
.rtab.on{color:var(--acc);box-shadow:inset 0 -2px 0 var(--acc)}
.filters{display:flex;gap:4px;padding:8px 12px 4px;flex-wrap:wrap}
.fchip{font:10.5px var(--mono);border:1px solid var(--line);border-radius:11px;padding:2px 9px;color:var(--dim);cursor:pointer}
.fchip.on{color:var(--acc);border-color:rgba(76,194,255,.5);background:rgba(76,194,255,.08)}
.list{padding:4px 0}
.lrow{padding:7px 14px;cursor:pointer;border-bottom:1px solid rgba(38,42,51,.5)}
.lrow:hover{background:var(--panel2)}
.lrow .lh{display:flex;align-items:center;gap:8px}
.lrow .ln{flex:1;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .lm{font:9.5px var(--mono);color:#4d5462}
.lrow .chev{font-size:9px;color:var(--dim);width:10px}
.lrow .ld{margin-top:8px;display:none}
.lrow.open .ld{display:block}
.lrow.open .chev{transform:rotate(90deg)}
.detail .dl{font:9.5px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:#4d5462;margin:6px 0 2px}
.detail .dl:first-child{margin-top:0}
.detail .step{display:flex;gap:8px;font-size:12px;padding:1px 0;color:var(--dim)}
.detail .step .mk{font-family:var(--mono)}
.detail .step.active{color:var(--tx)}.detail .step.active .mk{color:var(--acc)}
.detail .step.done .mk{color:var(--green)}
.detail .ev{font:10.5px var(--mono);color:var(--dim);padding:1px 0}
.detail .ev .ok{color:var(--green)}.detail .ev .pend{color:var(--amber)}
.detail .block{color:var(--red);font-size:12px}
.detail .rc{background:#0c0d10;border:1px solid var(--line);border-radius:6px;padding:8px 10px;font:10.5px/1.55 var(--mono);color:#9aa3b2;white-space:pre}
.detail .a{margin-top:6px;font:10.5px var(--mono);color:#4d5462}
.srow2{padding:7px 14px;cursor:pointer;border-bottom:1px solid rgba(38,42,51,.5);display:flex;align-items:center;gap:8px}
.srow2:hover{background:var(--panel2)}
.srow2.sel{background:rgba(76,194,255,.12)}
.srow2 .ln{flex:1;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow2 .lm{font:9.5px var(--mono);color:#4d5462}
.srow2.d2{padding-left:34px}
/* ---------- lualine-style status bar ---------- */
#bar{position:fixed;left:0;right:0;bottom:0;height:30px;display:flex;z-index:60;font:11.5px/30px var(--mono);overflow:hidden}
.seg{display:flex;align-items:center;gap:10px;padding:0 12px;white-space:nowrap;overflow:hidden}
.seg .sv{color:var(--tx)}
.seg1{background:#1a2333;color:#9fb4d8}
.seg2{flex:1;justify-content:center;background:#141a26;color:#7d8494}

.seg2 button:hover{color:var(--tx)}
.seg3{background:#10141c;color:#5d6474}
.seg3 .perf{color:#7fd4ff}
</style>

function genEntries(n){
  const es = new Array(n);

    const r = i % 11;

    else if(r===4)es[i] = {...base, type:'event', preview:'task event t'+(1+(i%5))};
    else if(r===5)es[i] = {...base, type:'assistant', body:'Continuing. '+(i%2?'Context stable.':'Cache hit.')};

  }
  return es;
}

const C = {

      if(s){
        const last = s.entries[s.entries.length-1];
        if(s.generating){ last.interrupted = true; s.generating = false; s.entries.push({id:'i'+Date.now(), type:'event', preview:'⚡ force: in-flight turn interrupted — partial output kept, tools finished, delivered at head of queue'}); }
        s.entries.push({id:'f'+Date.now(), type:'user', body:t, forced:true, t:Math.floor(Date.now()/1000)});
        state.current = s.id;
      }
    } else {
      (state.lane==='steering'? queue.steering : queue.follow).push({t});
    }
    mount();
  };
  inp.addEventListener('keydown', e=>{ if(e.key==='Enter') doSend(); });
  send.onclick = doSend;
}
/* ================= right pane ================= */
function buildRight(){
  const r = el('div','right');
  const sections = { tasks: buildTasks, subs: buildSubs };
  if(state.rightMode==='tabs'){
    const tabs = el('div','rtabs');
    for(const [k,label] of [['tasks','tasks'],['subs','sub-agents']]){
      const t = el('div','rtab'+(state.rightTab===k?' on':''), label);
      t.onclick = ()=>{ state.rightTab=k; mount(); };
      tabs.appendChild(t);
    }
    r.appendChild(tabs);
    r.appendChild(sections[state.rightTab]());
  } else {
    r.appendChild(sections.tasks());
    r.appendChild(sections.subs());
  }
  return r;
}
function buildTasks(){
  const sec = el('div');
  const F = [['open','open'],['all','all'],['in-progress','in-progress'],['blocked','blocked'],['pending','pending'],['done','done']];
  const frow = el('div','filters');
  for(const [label,key] of F){
    const c = el('span','fchip'+(state.tFilter===key?' on':''), label);
    c.onclick = ()=>{ state.tFilter = key; mount(); };
    frow.appendChild(c);
  }
  sec.appendChild(frow);
  const list = el('div','list');
  const items = TASKS.filter(t=>t.ws===state.ws && (state.tFilter==='all' || (state.tFilter==='open' ? t.state!=='done' : t.state===state.tFilter))).sort((a,b2)=>b2.mru-a.mru);
  if(!items.length) list.appendChild(el('div','lrow','<span class="lm">none</span>'));
  for(const t of items){
    const row = el('div','lrow'+(state.expandedTasks.has(t.id)?' open':''));
    let d = `<div class="ld detail">`;
    if(t.steps){
      d += `<div class="dl">steps — ${t.steps.filter(s=>s.s==='done').length}/${t.steps.length} done</div>`;
      d += t.steps.map(s=>`<div class="step ${s.s}"><span class="mk">${s.s==='done'?'✓':s.s==='active'?'▸':'○'}</span>${s.t}${s.eo?` <span style="color:#4d5462">→ ${s.eo}</span>`:''}</div>`).join('');
    }
    if(t.crit){
      d += `<div class="dl">acceptance criteria</div>`;
      d += t.crit.map(c2=>`<div class="ev"><span class="${c2.sat?'ok':'pend'}">${c2.sat?'✓':'…'}</span> ${c2.t}</div>`).join('');
    }
    if(t.ev && t.ev.length){
      d += `<div class="dl">evidence</div>`;
      d += t.ev.map(e2=>`<div class="ev"><span class="${e2.ok?'ok':'pend'}">${e2.ok?'✓':'…'}</span> ${e2.t}</div>`).join('');
    }
    if(t.block) d += `<div class="dl">blocker</div><div class="block">⛔ ${t.block}${t.unblock?' — '+t.unblock:''}</div>`;
    if(t.rc) d += `<div class="dl">resume contract</div><div class="rc">${esc(t.rc)}</div>`;
    d += `<div class="a">${t.assigned?'assigned: '+t.assigned:'unassigned'} · modified ${fmtAgo(t.mru)}</div></div>`;
    row.innerHTML = `<div class="lh"><span class="chev">▸</span>${badge(t.state)}<span class="ln">${t.name}</span><span class="lm">${t.assigned||''}</span></div>${d}`;
    row.onclick = ()=>{ state.expandedTasks.has(t.id)?state.expandedTasks.delete(t.id):state.expandedTasks.add(t.id); mount(); };
    list.appendChild(row);
  }
  sec.appendChild(list);
  return sec;
}
function buildSubs(){
  const sec = el('div');
  const F = [['open','open'],['all','all'],['running','running'],['idle','idle'],['failed','failed'],['stopped','stopped'],['done','done']];
  const frow = el('div','filters');
  for(const [label,key] of F){
    const c = el('span','fchip'+(state.sFilter===key?' on':''), label);
    c.onclick = ()=>{ state.sFilter = key; mount(); };
    frow.appendChild(c);
  }
  sec.appendChild(frow);
  const list = el('div','list');
  const kids = allSessions().filter(s=>s.parent);
  const roots = kids.filter(s=>s.parent && !findSession(s.parent)?.parent).sort((a,b)=>b.mru-a.mru);
  const pass = s => state.sFilter==='all' || (state.sFilter==='open' ? s.state!=='done' : s.state===state.sFilter);
  const show = roots.filter(pass);
  if(!show.length) list.appendChild(el('div','lrow','<span class="lm">none</span>'));
  for(const s of show){
    list.appendChild(subRow2(s, 1));
    for(const nc of kids.filter(x=>x.parent===s.id).filter(pass)) list.appendChild(subRow2(nc, 2));
  }
  sec.appendChild(list);
  return sec;
}
function subRow2(s, depth){
  const r = el('div','srow2'+(depth===2?' d2':''),
    `${badge(s.state)}<span class="ln">${s.title}</span><span class="lm">${s.task||''}</span>`);
  r.onclick = ()=>{ document.querySelectorAll('.srow2.sel').forEach(x=>x.classList.remove('sel')); r.classList.add('sel'); };
  r.ondblclick = ()=>openSession(s.id);
  return r;
}
/* ================= status bar (lualine-style) ================= */
function updateBar(){
  const s = state.current ? findSession(state.current) : null;
  const w = WORKSPACES.find(x=>x.id===state.ws);
  const active = s ? (s.parent ? badge(s.state) : ((s.generating || (s.children||[]).some(c2=>findSession(c2)?.state==='running')) ? '· running' : '')) : '';
  $('#seg1').innerHTML = `📁 <span class="sv">${w?w.name:'?'}</span> <span style="color:#4d5462">${w?w.cwd:''}</span> ${s?`· <span class="sv">${s.title}</span> ${s.parent?'(sub-agent)':''}`:''} ${active}`;
  $('#seg2').innerHTML = `right pane: <button id="axisBtn">${state.rightMode}</button> ←/→ &nbsp;·&nbsp; focus: <button id="focusBtn">${state.focus?'on':'off'}</button> &nbsp;·&nbsp; ${state.lane}`;
  const ax = $('#axisBtn'); if(ax) ax.onclick = ()=>{ state.rightMode = state.rightMode==='stacked'?'tabs':'stacked'; history.replaceState(null,'','?right='+state.rightMode); mount(); };
  const fb2 = $('#focusBtn'); if(fb2) fb2.onclick = ()=>{ state.focus = !state.focus; mount(); };
  const n = s? s.entries.length : 0;
  $('#seg3').innerHTML = `${s&&n>=1000?'10k · ':''}<span class="perf">${lastRange||(s?n+' entries':'—')}</span> · render ${lastRenderMs.toFixed(1)} ms · 2 streams @ 25 ms · ${s?.model?.split('/').pop()||'no model'}`;
}
/* ================= mount + events ================= */
function openSession(id){ state.current = id; const s = findSession(id); if(s.parent) state.openGroups.add(s.parent); mount(); }
function onStream(child){
  if(state.current===child){
    const c=$('.center');
    if(c){
      const sc = c.querySelector('.scroll');
      const wasAtTail = sc ? Math.abs((sc.scrollHeight - sc.scrollTop) - sc.clientHeight) < 80 : true;
      const prevTop = sc ? sc.scrollTop : 0;
      c.replaceWith(buildCenter());
      const nc = $('.center .scroll');
      if(nc) nc.scrollTop = wasAtTail ? nc.scrollHeight : prevTop;
    }
  }
  const sig = allSessions().map(s=>s.state).join(',');
  if(sig !== (onStream._sig ?? (onStream._sig = sig))) mountRightOnly();
  updateBar();
}
function mountRightOnly(){
  const right = $('.right');
  if(right) right.replaceWith(buildRight());
}
function mount(){
  const app = $('#app'); app.innerHTML='';
  app.appendChild(buildTop());
  const body = el('div','body'+(state.focus?' focus':''));
  body.appendChild(buildLeft());
  body.appendChild(buildCenter());
  body.appendChild(buildRight());
  app.appendChild(body);
  const sc = $('.center .scroll'); if(sc) sc.scrollTop = sc.scrollHeight;
  window.onkeydown = (e)=>{
    const t = document.activeElement;
    if(t && (t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable)) return;
    if(e.key==='ArrowLeft' || e.key==='ArrowRight'){
      state.rightMode = state.rightMode==='stacked' ? 'tabs' : 'stacked';
      history.replaceState(null,'','?right='+state.rightMode);
      mount();
    }
  };
  updateBar();
}
mount();
</script>

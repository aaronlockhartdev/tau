<!doctype html>
<!--
  PROTOTYPE — throwaway, not production. Do not promote without rewrite.

  Question (#11): what should the tau sessions & sub-agents GUI look like?
  Three variants of the whole IA, switchable via ?variant= (and the floating bottom bar):
    A — Workbench:  3-pane (tree | transcript+composer | inspector); children browse as SIBLING TABS
    B — Focus:      single column, no sidebars; children browse as INLINE NESTED panels; tasks as top strip
    C — Triage:     icon rail + command palette (⌘K) as primary affordance; children browse as a RIGHT DRAWER
  All variants share one fake dataset and demonstrate the #10 protocol performance shape:
  snapshot-projection load (metadata skeleton, payloads lazy), paged/virtualized reads,
  25 ms delta coalescing, sidecar blobs on demand. Status strip (bottom bar) proves it live.

  Run:  open this file directly, or:  python3 -m http.server 4173 -d prototype/gui-ia
  Keys: ←/→ cycle variants (not while typing) · ⌘/Ctrl+K opens the palette in variant C
-->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tau GUI IA — PROTOTYPE</title>
<style>
:root{
  --bg:#101115; --panel:#16181d; --panel2:#1c1f26; --line:#262a33;
  --tx:#d7dae0; --dim:#7d8494; --acc:#4cc2ff; --green:#57d97a; --amber:#e8b64c;
  --red:#ef6a6a; --purple:#b58cff; --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 var(--sans)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#2c313c;border-radius:5px}
.proto-banner{position:absolute;top:0;left:0;right:0;height:26px;background:#2a2113;color:#e8b64c;
  display:flex;align-items:center;justify-content:center;gap:10px;font:11px/1 var(--mono);letter-spacing:.08em;z-index:50}
#app{position:absolute;inset:26px 0 0 0}
/* ---------- shared atoms ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;font:10.5px/1.6 var(--mono);padding:1px 7px;border-radius:9px;border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.badge .dot{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.badge.running{color:var(--acc);border-color:rgba(76,194,255,.4)}.badge.running .dot{background:var(--acc);animation:pulse 1.2s infinite}
.badge.done{color:var(--green);border-color:rgba(87,217,122,.4)}.badge.done .dot{background:var(--green)}
.badge.idle{color:var(--amber);border-color:rgba(232,182,76,.4)}.badge.idle .dot{background:var(--amber)}
.badge.failed{color:var(--red);border-color:rgba(239,106,106,.45)}.badge.failed .dot{background:var(--red);animation:pulse .8s infinite}
.badge.stopped{color:var(--dim)}.badge.stopped .dot{background:var(--dim)}
.badge.in-progress{color:var(--acc);border-color:rgba(76,194,255,.4)}
.badge.blocked{color:var(--red);border-color:rgba(239,106,106,.45)}
.badge.pending{color:var(--dim)}.badge.satisfied{color:var(--green)}.badge.cancelled{color:var(--dim)}
@keyframes pulse{50%{opacity:.35}}
.entry{border-bottom:1px solid var(--line);padding:8px 14px;cursor:default}
.entry .eh{display:flex;align-items:center;gap:8px}
.entry .eh .who{font:11px var(--mono);color:var(--dim)}
.entry .eh .tt{font:10px var(--mono);color:#4d5462;margin-left:auto}
.entry .body{margin-top:4px;color:var(--tx);white-space:pre-wrap;font-size:13px}
.entry.user .who{color:var(--purple)}
.entry.assistant .body{color:#c6cad2}
.entry.om{background:rgba(181,140,255,.05)}
.entry.om .who{color:var(--purple)}
.entry.archived{background:var(--panel);color:var(--dim);font-size:12px}
.entry.tool .name{font:12px var(--mono);color:var(--acc)}
.entry.tool .arg{font:11.5px var(--mono);color:var(--dim);margin-left:8px}
.entry.tool .out{margin-top:6px;background:#0c0d10;border:1px solid var(--line);border-radius:6px;padding:8px 10px;font:11.5px/1.5 var(--mono);white-space:pre;overflow-x:auto;color:#9aa3b2;max-height:260px;overflow-y:auto}
.entry.tool .out .add{color:var(--green);display:block}.entry.tool .out .del{color:var(--red);display:block}
.entry.tool .out .hsh{color:#525a6a;display:inline-block;width:44px}
.entry.tool .out .blob{color:var(--amber);font-style:italic}
.entry.notify{background:rgba(76,194,255,.05);border-left:2px solid var(--acc);padding-left:12px}
.entry.notify .who{color:var(--acc)}
.entry.streaming .body::after{content:"▍";color:var(--acc);animation:pulse 1s infinite}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:2px 10px;font:11.5px var(--sans);color:var(--dim)}
.chip b{color:var(--tx);font-weight:500}
.chip .k{font:9.5px var(--mono);color:var(--acc);text-transform:uppercase}
.chip .x{color:#4d5462;cursor:pointer;font-size:13px;line-height:1}
.chip:hover .x{color:var(--red)}
.composer{border-top:1px solid var(--line);background:var(--panel);padding:10px 14px}
.composer .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;min-height:4px}
.composer .row{display:flex;gap:8px;align-items:center}
.composer input{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;outline:none}
.composer input:focus{border-color:var(--acc)}
.composer .send{background:var(--acc);color:#081018;border-radius:8px;padding:8px 16px;font-weight:600}
.composer .force{background:transparent;color:var(--red);border:1px solid rgba(239,106,106,.5);border-radius:8px;padding:7px 12px;font-size:12.5px}
.composer .force:hover{background:rgba(239,106,106,.12)}
.panel-h{font:11px var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--dim);padding:10px 14px 6px}
.tree-item{display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:7px;cursor:pointer;font-size:13px;color:var(--tx)}
.tree-item:hover{background:var(--panel2)}
.tree-item.sel{background:rgba(76,194,255,.12)}
.tree-item .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree-item.child{padding-left:26px}
.task{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:10px 12px;margin:0 14px 10px}
.task .th{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.task .th .n{font-weight:600;font-size:13px;flex:1}
.task .step{display:flex;gap:8px;font-size:12.5px;padding:2px 0;color:var(--dim)}
.task .step .mk{font-family:var(--mono)}
.task .step.active{color:var(--tx)}.task .step.active .mk{color:var(--acc)}
.task .step.done .mk{color:var(--green)}
.task .ev{font:11px var(--mono);color:var(--dim);padding:1px 0}
.task .ev .ok{color:var(--green)}.task .ev .pend{color:var(--amber)}
.task .block{color:var(--red);font-size:12.5px;margin-top:4px}
.task .rc{margin-top:8px;background:#0c0d10;border:1px solid var(--line);border-radius:6px;padding:8px 10px;font:11px/1.55 var(--mono);color:#9aa3b2;white-space:pre}
.agent-row{display:flex;gap:10px;padding:7px 14px;cursor:pointer;align-items:baseline}
.agent-row:hover{background:var(--panel2)}
.agent-row .n{font:12.5px var(--mono);color:var(--tx)}
.agent-row .n .bi{color:var(--dim);font-size:10px}
.agent-row .d{color:var(--dim);font-size:11.5px;flex:1}
.sub-row{display:flex;align-items:center;gap:8px;padding:6px 14px;cursor:pointer}
.sub-row:hover{background:var(--panel2)}
.sub-row .n{flex:1;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub-row .meta{font:10.5px var(--mono);color:var(--dim)}
/* ---------- switcher (prototype chrome) ---------- */
#bar{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:10px;
  background:#000;color:#fff;border:1px solid #333;border-radius:999px;padding:5px 8px;box-shadow:0 6px 24px rgba(0,0,0,.6);font:12px var(--mono)}
#bar button{width:30px;height:26px;border-radius:6px;color:#fff}
#bar button:hover{background:#222}
#bar .lbl{min-width:170px;text-align:center}
#bar .status{min-width:330px;text-align:center;color:#7fd4ff;font-size:11px}
/* ---------- variant A: workbench ---------- */
.a{display:grid;grid-template-columns:270px 1fr 300px;height:100%}
.a .left,.a .right{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto}
.a .right{border-right:none;border-left:1px solid var(--line)}
.a .ws{padding:12px 14px;font-weight:600;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
.a .ws .cw{font:10.5px var(--mono);color:var(--dim);font-weight:400}
.a .center{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.a .tabs{display:flex;gap:4px;padding:8px 10px 0;border-bottom:1px solid var(--line);background:var(--panel);overflow-x:auto}
.a .tab{display:flex;align-items:center;gap:7px;padding:6px 12px;border-radius:8px 8px 0 0;font-size:12.5px;color:var(--dim);white-space:nowrap;border:1px solid transparent;border-bottom:none}
.a .tab.on{background:var(--bg);color:var(--tx);border-color:var(--line)}
.a .tab .dot{width:7px;height:7px;border-radius:50%}
.a .scroll{flex:1;overflow-y:auto;position:relative;min-height:0}
.a .rtabs{display:flex;border-bottom:1px solid var(--line)}
.a .rtab{flex:1;text-align:center;padding:9px;font:11px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--dim)}
.a .rtab.on{color:var(--acc);box-shadow:inset 0 -2px 0 var(--acc)}
.a .rbody{overflow-y:auto;flex:1}
.a .right{display:flex;flex-direction:column}
.a>.left,.a>.center,.a>.right{min-height:0}
/* ---------- variant B: focus ---------- */
.b{display:flex;flex-direction:column;height:100%;min-height:0}
.b .top{border-bottom:1px solid var(--line);background:var(--panel);padding:10px 18px;display:flex;align-items:center;gap:14px}
.b .ws{font-weight:600}
.b .crumb{display:flex;gap:6px;align-items:center;color:var(--dim);font-size:13px}
.b .crumb a{color:var(--tx);cursor:pointer;text-decoration:none}
.b .crumb a:hover{color:var(--acc)}
.b .tstrip{margin-left:auto;display:flex;gap:8px;align-items:center}
.b .tstrip button{font:11.5px var(--mono);color:var(--dim);border:1px solid var(--line);border-radius:12px;padding:3px 10px}
.b .tstrip button:hover{color:var(--tx);border-color:var(--acc)}
.b .tstrip .warn{color:var(--red)}
.b .tasks-open{border-bottom:1px solid var(--line);background:var(--panel);max-height:220px;overflow-y:auto}
.b .scroll{flex:1;overflow-y:auto;min-height:0}
.b .scroll .entry{max-width:880px;margin:0 auto}
.b .inline-child{margin:0 auto;max-width:880px;border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-bottom:6px;overflow:hidden}
.b .ic-head{display:flex;align-items:center;gap:9px;padding:8px 14px;cursor:pointer}
.b .ic-head .n{font-weight:600;font-size:13px}
.b .ic-head .meta{font:10.5px var(--mono);color:var(--dim);margin-left:auto}
.b .ic-head .chev{color:var(--dim);transition:transform .12s}
.b .ic-head.open .chev{transform:rotate(90deg)}
.b .ic-body{border-top:1px solid var(--line);max-height:300px;overflow-y:auto;background:#0e0f13}
.b .composer .spawn{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.b .composer .spawn .k{font:10px var(--mono);color:var(--dim);text-transform:uppercase}
/* ---------- variant C: triage ---------- */
.c{display:grid;grid-template-columns:52px 1fr auto;height:100%;min-height:0}
.c .rail{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding-top:12px;gap:6px}
.c .rail button{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--dim);position:relative}
.c .rail button.on,.c .rail button:hover{background:var(--panel2);color:var(--tx)}
.c .rail .cnt{position:absolute;top:2px;right:2px;background:var(--acc);color:#081018;font:9px var(--mono);border-radius:7px;padding:0 4px}
.c .center{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.c .scroll{flex:1;overflow-y:auto;min-height:0}
.c .drawer{width:380px;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.c .drawer.hidden{display:none}
.c .dr-head{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.c .dr-head .n{flex:1;font-weight:600;font-size:13px}
.c .dr-head .x{color:var(--dim);font-size:15px;cursor:pointer}
.c .dr-body{flex:1;overflow-y:auto}
.c .dr-list .sub-row{border-bottom:1px solid var(--line)}
.c .palette{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:40;display:flex;justify-content:center;padding-top:12vh}
.c .palette.hidden{display:none}
.c .pal-box{width:560px;max-height:60vh;background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.c .pal-box input{background:transparent;border:none;border-bottom:1px solid var(--line);padding:14px 16px;font-size:15px;outline:none}
.c .pal-list{overflow-y:auto;padding:6px}
.c .pal-item{display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:8px;cursor:pointer}
.c .pal-item .ic{width:20px;text-align:center}
.c .pal-item .n{flex:1;font-size:13px}
.c .pal-item .k{font:10.5px var(--mono);color:var(--dim)}
.c .pal-item.sel{background:rgba(76,194,255,.14)}
.c .pal-hint{padding:8px 16px;font:10.5px var(--mono);color:var(--dim);border-top:1px solid var(--line)}
</style>
</head>
<body>
<div class="proto-banner">PROTOTYPE — throwaway IA exploration for ticket #11 · not production · ←/→ to switch variants</div>
<div id="app"></div>
<div id="bar">
  <button id="prev" title="previous variant (←)">‹</button>
  <span class="lbl" id="lbl"></span>
  <button id="next" title="next variant (→)">›</button>
  <span class="status" id="status"></span>
</div>
<script>
'use strict';
/* ================= fake data (snapshot shape: metadata skeleton, payloads lazy) ================= */
const WS = {id:'ws-tau', name:'tau', cwd:'~/git/tau'};
const AGENTS = [
  {name:'general', builtin:true, desc:'Inherits the session’s tools and model.'},
  {name:'researcher', file:'~/.config/tau/agents/researcher.md', desc:'Primary-source research; writes findings docs.'},
  {name:'reviewer', file:'.tau/agents/reviewer.md', desc:'Blocker-first review of staged diffs.'},
];
const S1N = 10000; // the 10k-entry stress session
function genEntries(n){ // metadata skeleton only — payload is a closure, computed on demand
  const es = new Array(n);
  const toolNames = ['read','edit','bash','read','task_evidence','bash','read','edit','bash'];
  for(let i=0;i<n;i++){
    const r = i % 11;
    const base = {id:i+1, t:(1758100000 + i*47) };
    if(r===0)     es[i] = {...base, type:'user', size:200+ (i*13)%400};
    else if(r===1)es[i] = {...base, type:'assistant', size:600+ (i*29)%900};
    else if(r===2)es[i] = {...base, type:'tool', tool:toolNames[i%9], size:300+(i*31)%1200};
    else if(r===3)es[i] = {...base, type:'om', size:420};
    else if(r===4)es[i] = {...base, type:'event', size:120};
    else if(r===5)es[i] = {...base, type:'assistant', size:500+(i*7)%700};
    else if(r===6)es[i] = {...base, type:'tool', tool:toolNames[(i+3)%9], size:250+(i*17)%800};
    else if(r===7)es[i] = {...base, type:'user', size:150+(i*11)%300};
    else if(r===8)es[i] = {...base, type:'tool', tool:toolNames[(i+5)%9], size:200+(i*19)%900};
    else if(r===9) es[i] = {...base, type:'archived', size:900, span:'entries '+(i*40-1600)+'–'+(i*40+240)};
    else           es[i] = {...base, type:'assistant', size:400+(i*3)%600};
  }
  return es;
}
const s1 = genEntries(S1N);
// curated tail: the interesting last entries of the 10k session
const TAIL = [
  {id:S1N-7, type:'event', preview:'task: t2 step 2/3 → active'},
  {id:S1N-6, type:'tool', tool:'edit', arg:'src/protocol/message.rs  {wUp, k2F} → 3 lines',
    payload:()=>['<span class="hsh">wUp│</span><span class="del">- pub struct Command { pub kind: String }</span>',
                 '<span class="hsh">wUp│</span><span class="add">+ #[derive(Serialize, Deserialize)]</span>',
                 '<span class="hsh">wUp│</span><span class="add">+ pub enum Command { Open(OpenCmd), Send(SendCmd) }</span>',
                 '<span class="hsh">k2F│</span> pub struct Envelope { pub ws: WsId, ... }'].join('\n')},
  {id:S1N-5, type:'tool', tool:'bash', arg:'cargo test protocol -- --nocapture',
    payload:()=>'running 42 tests\ntest message::roundtrip ... ok\ntest envelope::multiplex ... ok\ntest result: ok. 42 passed; 0 failed; 0 ignored',
    sidecar:true, blobMB:2.1},
  {id:S1N-4, type:'notify', who:'C2 · sub-agent', preview:'parent_notify: SSE parser ports cleanly — 3 edge cases in llama.cpp shim, notes in findings/sse.md', body:'parent_notify {text: "SSE parser ports cleanly — 3 edge cases in the llama.cpp shim, notes in findings/sse.md"}'},
  {id:S1N-3, type:'om', preview:'OM: observed 6,412 tokens → 21 observations (group g47)', body:'observed 6,412 unobserved tokens → 21 observations · observations now 31.2k / 40k'},
  {id:S1N-2, type:'assistant', body:'The envelope multiplexing works. Kicking off the snapshot benchmark as a sub-agent — I’ll park and wait for it. (ends turn)'},
  {id:S1N-1, type:'tool', tool:'subagent_spawn', arg:'"Benchmark the 10k snapshot" · type=general · context=fresh · task=t5'},
];
s1.push(...TAIL);
function childEntries(id, seed){ // small curated child sessions
  const e = [];
  const mk=(t,extra)=>Object.assign({id:id+'-'+(e.length+1), type:t}, extra);
  e.push(mk('user',{body:'Brief: '+ (SEED_BRIEF[id]||'do the work') + '\nAgent type: general · context: fresh'}));
  e.push(mk('assistant',{body:'Starting. Reading the relevant sources first.'}));
  e.push(mk('tool',{tool:'read', arg:'findings/'+id+'.md', payload:()=>'(842 lines of notes)'}));
  e.push(mk('tool',{tool:'bash', arg:'cargo check 2>&1 | tail -5', payload:()=>'Checking tau-core v0.0.1\nFinished dev profile in 1.8s'}));
  e.push(mk('assistant',{body:'Halfway. The middle section is straightforward; the edge cases are in the shim layer.'}));
  return e;
}
const SEED_BRIEF = {
  c1:'Survey hashline edit schemes (Can Bölük, kebbbnnn/hashline, pi-better-edit). Write findings/hashline.md.',
  c2:'Port the SSE parser from the research notes to Rust. Task t2. Target: src/protocol/sse.rs.',
  c3:'Fix the flaky snapshot test (fails ~1 in 40).',
  c4:'Draft the recall tool interface. Task pending.',
  c5:'Trim the context assembly path.',
  c6:'Benchmark: snapshot projection of a 10k-entry session, plus 2 concurrent child streams. Report frame times.',
};
const CHILD = {
  c1:{entries:childEntries('c1'), state:'done', note:'done: parent_notify{done:true, output: findings/hashline.md}'},
  c2:{entries:childEntries('c2'), state:'running', task:'t2'},
  c3:{entries:childEntries('c3'), state:'failed', reason:'nudge-exhausted — turn ended twice, no done, no wait declaration',
       last:'the test only fails when the clock ticks between snapshot and compare; I was about to inject a fixed clock…'},
  c4:{entries:childEntries('c4'), state:'idle', waiting_on:'parent', note:'waiting on parent: "should recall take a group id or a range?"'},
  c5:{entries:childEntries('c5'), state:'stopped', by:'user', note:'stopped by user · resumable'},
  c6:{entries:childEntries('c6'), state:'running'},
};
const SESSIONS = [
  {id:'s1', title:'Protocol crate: messages & events', parent:null, state:'running', entries:s1, model:'yunyun/qwen3.8-27b'},
  {id:'s2', title:'Session storage format research', parent:null, state:'done', entries:childEntries('s2')},
  {id:'c1', title:'Survey hashline edit schemes', parent:'s1', state:'done', task:'t1', entries:CHILD.c1.entries},
  {id:'c2', title:'Port the SSE parser', parent:'s1', state:'running', task:'t2', entries:CHILD.c2.entries},
  {id:'c3', title:'Fix the flaky snapshot test', parent:'s1', state:'failed', reason:CHILD.c3.reason, last:CHILD.c3.last, entries:CHILD.c3.entries},
  {id:'c4', title:'Draft the recall tool', parent:'s1', state:'idle', waiting_on:'parent', note:CHILD.c4.note, entries:CHILD.c4.entries},
  {id:'c5', title:'Trim the context assembly', parent:'s1', state:'stopped', note:CHILD.c5.note, entries:CHILD.c5.entries},
  {id:'c6', title:'Benchmark the 10k snapshot', parent:'t5' && 's1', state:'running', task:'t5', entries:CHILD.c6.entries},
];
const TASKS = [
  {id:'t1', name:'Implement hash-anchored read/edit', state:'done', assigned:'c1',
    steps:[{s:'done',t:'Port xxhash + allocation bitset'},{s:'done',t:'Wire read/edit with hash anchors'}],
    crit:[{t:'3-char/62-alphabet anchors, allocated uniqueness', sat:true, ev:'ev1'},

  inp.onkeydown = e=>{
    if(e.key==='ArrowDown'){ state.palSel = Math.min(pals().length-1, state.palSel+1); mountPalette(pal); e.preventDefault(); }
    else if(e.key==='ArrowUp'){ state.palSel = Math.max(0, state.palSel-1); mountPalette(pal); e.preventDefault(); }
    else if(e.key==='Enter'){ const p = pals()[state.palSel]; if(p) p.go(); }
    else if(e.key==='Escape'){ state.palOpen=false; mount(); }
  };
  const list = el('div','pal-list');
  const q = state.palText.toLowerCase();
  const items = pals().filter(p=>!q || p.n.toLowerCase().includes(q));
  for(const [i,p] of items.entries()){
    const it = el('div','pal-item'+(i===state.palSel?' sel':''), `<span class="ic">${p.ic}</span><span class="n">${p.n}</span><span class="k">${p.k}</span>`);
    it.onclick = p.go;
    list.appendChild(it);
  }
  box.append(inp, list, el('div','pal-hint','↑↓ navigate · ↵ open · esc close'));
  pal.appendChild(box);
  setTimeout(()=>inp.focus(),0);
}
function pals(){
  const items = [];
  for(const s of SESSIONS) items.push({ic: s.parent?'↳':'📄', n:s.title, k:'session', go:()=>{ state.palOpen=false; openSession(s.id); }});
  for(const t of TASKS) items.push({ic:'✓', n:t.name, k:'task', go:()=>{ state.palOpen=false; state.drawer='tasks'; mount(); }});
  for(const a of AGENTS) items.push({ic:'👤', n:a.name, k:'agent type', go:()=>{ state.palOpen=false; state.drawer='agents'; mount(); }});
  items.push({ic:'⚡', n:'force-send a message', k:'action', go:()=>{ state.palOpen=false; }});
  items.push({ic:'⎇', n:'fork / branch here', k:'action', go:()=>{ state.palOpen=false; }});
  return items;
}
/* ================= wiring ================= */
const VARIANTS = [
  ['a','A (Workbench — 3 panes, children as tabs)'],
  ['b','B (Focus — single column, children inline)'],
  ['c','C (Triage — rail + ⌘K palette, children in drawer)'],
];
function mount(){
  const app = $('#app'); app.innerHTML='';
  state.palOpen = false;
  app.appendChild(state.variant==='a'?variantA():state.variant==='b'?variantB():variantC());
  if(state.variant==='a') mountCenter();
  else if(state.variant==='b') mountBody();
  else { const cc=$('.c'); if(cc){ const sc2=cc.querySelector('.scroll'); if(sc2) mountScrollC(sc2); } mountDrawer(); const pal2=cc.querySelector('.palette'); if(pal2) mountPalette(pal2); }
  $('#lbl').textContent = VARIANTS.find(v=>v[0]===state.variant)[1];
  if(state.variant==='c') window.onkeydown = (e)=>{
    const t = document.activeElement;
    const typing = t && (t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable);
    if((e.metaKey||e.ctrlKey) && e.key==='k'){ e.preventDefault(); state.palOpen=true; mount(); }
    else if(!typing && e.key==='ArrowLeft'){ cycle(-1); }
    else if(!typing && e.key==='ArrowRight'){ cycle(1); }
  };
  else window.onkeydown = (e)=>{
    const t = document.activeElement;
    const typing = t && (t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable);
    if(typing) return;
    if(e.key==='ArrowLeft') cycle(-1);
    if(e.key==='ArrowRight') cycle(1);
  };
}
function cycle(d){
  const i = VARIANTS.findIndex(v=>v[0]===state.variant);
  state.variant = VARIANTS[(i+d+VARIANTS.length)%VARIANTS.length][0];
  history.replaceState(null,'','?variant='+state.variant);
  mount();
}
$('#prev').onclick = ()=>cycle(-1);
$('#next').onclick = ()=>cycle(1);
const url = new URLSearchParams(location.search).get('variant');
if(url && VARIANTS.some(v=>v[0]===url)) state.variant = url;
mount();
</script>

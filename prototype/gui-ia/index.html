function updateStatus(){
  const s = findSession(state.current);
  const n = s.entries.length;
  $('#status').textContent = `${s.id} ${n>=1000?'(10k stress)':''} · rendering ${lastRange||n+' entries'} · render ${lastRenderMs.toFixed(1)} ms · 2 streams @ 25 ms · flush ${lastFlushMs.toFixed(1)} ms`;
}
function onStream(child){
  if(state.current===child){ const c=$('.center'); if(c) c.replaceWith(buildCenter()); const nc=$('.center .scroll'); if(nc) nc.scrollTop = nc.scrollHeight; }
  else if(state.ws==='w1' && (state.rightMode==='stacked' || state.rightTab==='subs')) mountRightOnly();
  else if(state.ws==='w1') mountRightOnly();
  updateStatus();
}
function mountRightOnly(){
  const right = $('.right');
  if(right) right.replaceWith(buildRight());
}
function mount(){
  const app = $('#app'); app.innerHTML='';
  app.appendChild(buildTop());
  const body = el('div','body'+(state.focus?' focus':''));
  body.appendChild(buildLeft());
  body.appendChild(buildCenter());
  body.appendChild(buildRight());
  app.appendChild(body);
  const sc = $('.center .scroll'); if(sc) sc.scrollTop = sc.scrollHeight;
  $('#lbl').textContent = 'verdict design · right pane: ' + state.rightMode;
  window.onkeydown = (e)=>{
    const t = document.activeElement;
    if(t && (t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable)) return;
    if(e.key==='ArrowLeft' || e.key==='ArrowRight'){
      state.rightMode = state.rightMode==='stacked' ? 'tabs' : 'stacked';
      history.replaceState(null,'','?right='+state.rightMode);
      mount();
    }
  };
  updateStatus();
}
$('#prev').onclick = ()=>{ state.rightMode = state.rightMode==='stacked'?'tabs':'stacked'; history.replaceState(null,'','?right='+state.rightMode); mount(); };
$('#next').onclick = ()=>{ state.rightMode = state.rightMode==='stacked'?'tabs':'stacked'; history.replaceState(null,'','?right='+state.rightMode); mount(); };
mount();
</script>
</body>
</html>
